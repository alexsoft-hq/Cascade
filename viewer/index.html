<!doctype html>
<html lang="en" data-theme="signal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade viewer</title>
<!-- The theme, before the first paint. The page defaults to "signal" (the mark-
     up says so); a reader who chose "drawing" last time must not see one frame
     of the other one first. `prefers-color-scheme` is NOT consulted: the choice
     is the reader's, and the default is the product's. -->
<script>try{var _th=localStorage.getItem('cascade.viewer.theme');if(_th==='drawing'||_th==='signal')document.documentElement.setAttribute('data-theme',_th);}catch(e){}</script>
<!-- The mark itself as the tab icon: the same three-step fall, on nothing,
     written straight into the document as an SVG data URI. Per-part colours,
     the light-ground palette — a tab icon cannot ask which ground it is on.
     No PNG fallback and no second request: a page that may be read with no
     network must not go looking for its own icon. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M2.5%204.5h8v6'%20stroke='%231B2A41'%20stroke-width='2.8'/%3E%3Cpath%20d='M10.5%2010.5h5.5v6'%20stroke='%232B5FA5'%20stroke-width='2.2'/%3E%3Cpath%20d='M16%2016.5h3.5'%20stroke='%237FA6D8'%20stroke-width='1.6'/%3E%3Ccircle%20cx='20.5'%20cy='16.5'%20r='1.9'%20fill='%232B5FA5'/%3E%3C/svg%3E">
<style>
  /* ------------------------------------------------------------------
     TWO THEMES, ONE TOKEN SYSTEM.

     `signal` (the default) is the signal room: a dark instrument panel where
     each kind of node carries its own hue and a lit thing glows. `drawing` is
     the engineering drawing this page used to be: ink on drafting paper, where
     meaning is carried by LINE and SYMBOL and the only saturated colour is the
     access. Both are written with the SAME token names, so every rule below —
     and every canvas renderer in the script, which reads these very properties
     with getComputedStyle — changes theme without one line of branching and
     without a single request.

     In BOTH themes:
       · certainty  = the stroke pattern of a line or a chip's box
       · node kind  = a glyph (ring / triangle / circle / diamond / rectangle / dot)
     In `drawing` every kind token is the same ink, so the glyph alone says what
     a thing is and a screenshot survives greyscale. In `signal` the glyph is
     kept and the hue is added on top of it.
     ------------------------------------------------------------------ */
  /* The type. Vendored (viewer/vendor/fonts, served by /vendor) — the page is
     read on a machine that may have no network. The Sans file is a VARIABLE
     font (its table directory carries fvar/gvar/avar/HVAR/MVAR/STAT), so one
     face covers 400-600 and the browser interpolates; the two Mono cuts are
     static. `swap` everywhere: the page is readable in the fallback before the
     download lands, and no text is ever invisible. */
  @font-face { font-family:"IBM Plex Sans"; font-style:normal; font-weight:400 600;
    font-display:swap; src:url("/vendor/fonts/IBM-Plex-Sans-latin.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-style:normal; font-weight:400;
    font-display:swap; src:url("/vendor/fonts/IBM-Plex-Mono-400-latin.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-style:normal; font-weight:500;
    font-display:swap; src:url("/vendor/fonts/IBM-Plex-Mono-500-latin.woff2") format("woff2"); }

  :root {
    /* Korean has no vendored cut: it falls back to the system face. */
    --sans:"IBM Plex Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  /* ---- THEME: signal (the default) --------------------------------------- */
  /* The four ground steps go from the page's own dark to the raised face of a
     card; `--frame` is the one hairline a panel is drawn with. Every kind has a
     hue, every state has one, and `--glow` is the shadow a lit thing carries.
     Nothing outside this block may name a colour.

     `--n-*` are THE MAP'S NODE FILLS. A node on the three pictures is a filled
     disc and its kind is the fill, so these four are what a reader sees at
     rest, where `--k-*` is the ink the page writes a kind's NAME in. The table
     fill is a warmer green than the mint `--k-table`: beside the cyan endpoint
     the mint read as the same hue at four pixels across. In `drawing` they are
     that theme's own muted inks, a printed map rather than a greyscale one, and
     certainty is still the LINE pattern, which is the part that photocopies. */
  [data-theme="signal"] {
    --g0:#0B1020; --g1:#111729; --g2:#171E33; --g3:#1E2740;
    --hair:#273354; --frame:#2C3A5E;
    --t1:#EAF0FF; --t2:#A7B3D1; --t3:#6E7A9A;
    --k-group:#C4B5FD; --k-endpoint:#22D3EE; --k-service:#A78BFA;
    --k-statement:#FB923C; --k-table:#34D399; --k-column:#F472B6;
    --k-screen:#F9A8D4; --k-webfn:#67E8F9;
    --read:#60A5FA; --write:#F87171; --join:#FBBF24;
    --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
    --edge:#7C89AD;
    --glow:0 0 8px currentColor;
    --panel-bg:linear-gradient(180deg,var(--g2),var(--g1));
    --panel-shadow:0 12px 40px rgba(0,0,0,.35);
    --r-panel:14px; --r-chip:999px; --r-tag:4px;
    --body-bg:radial-gradient(1200px 600px at 20% -10%,#1A2447 0%,var(--g0) 55%);
    --head-bg:transparent; --field-bg:rgba(255,255,255,.03);
    --src-hi:rgba(96,165,250,.14);
    --halo:rgba(11,16,32,.86); --dim-node:rgba(167,179,209,.28); --dim-link:rgba(167,179,209,.10);
    --overlay:rgba(17,23,41,.82);
    --n-group:#C4B5FD; --n-endpoint:#22D3EE; --n-table:#4ADE80; --n-statement:#FB923C;
    --n-screen:#F9A8D4;
  }
  /* ---- THEME: drawing (what this page was, on the same token names) ------- */
  /* Every KIND token is the same ink here: outside the pictures a kind is named
     in words beside its swatch, so one ink is enough. The three access hues are
     the only saturated colour, and the state tints are ink-family so they never
     shout. The map's own discs are the exception and have five muted fills of
     their own (`--n-*` below): a disc with no name beside it needs a hue.
     The two FRONTEND kinds are the other exception. A screen and a web function
     stand at the far end of the round trip, on the same row as the backend
     lanes they lead into, and a reader who is looking at six columns of the
     same ink cannot see where the browser stops and the server starts. So
     `--k-screen` and `--k-webfn` carry a hue in this theme too, both dark
     enough to read as ink on paper. */
  [data-theme="drawing"] {
    --g0:#F3F5F8; --g1:#FFFFFF; --g2:#FFFFFF; --g3:#F3F5F8;
    --hair:#E1E6EC; --frame:#C7CFDA;
    --t1:#1B2A41; --t2:#4A5568; --t3:#7B8794;
    --k-group:#1B2A41; --k-endpoint:#1B2A41; --k-service:#1B2A41;
    --k-statement:#1B2A41; --k-table:#1B2A41; --k-column:#1B2A41;
    --k-screen:#8A2A62; --k-webfn:#3C6FB0;
    --read:#2B5FA5; --write:#B33A3A; --join:#A8842B;
    --ok:#2F5D50; --warn:#7A6224; --bad:#8E3232;
    --edge:#1B2A41;
    --glow:none;
    --panel-bg:var(--g1);
    --panel-shadow:none;
    --r-panel:0px; --r-chip:2px; --r-tag:2px;
    --body-bg:var(--g0);
    --head-bg:var(--g1); --field-bg:var(--g1);
    --src-hi:rgba(43,95,165,.10);
    --halo:rgba(255,255,255,.92); --dim-node:rgba(27,42,65,.25); --dim-link:rgba(27,42,65,.07);
    --overlay:rgba(255,255,255,.88);
    --n-group:#1B2A41; --n-endpoint:#2B5FA5; --n-table:#2F855A; --n-statement:#A8842B;
    --n-screen:#8A2A62;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--body-bg); background-attachment:fixed;
    color:var(--t1); font:14px/1.5 var(--sans);
    -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  /* One focus ring for the whole page: 2px of ink, 2px off the control. */
  :focus-visible { outline:2px solid var(--t1); outline-offset:2px; }

  /* ---- the masthead ------------------------------------------------------ */
  /* THE BRAND AND ONE MONO LINE on the left; the state of this answer, as
     chips, on the right. The line reads
       project . digest . lanes . base commit
     and it is the ONE place on this page that uses a middle dot: it is a
     dateline, not prose, and the dots are what make four fields read as four.
     Under it, the cascade rail. The old ruled TITLE BLOCK is gone — every fact
     it carried is on this line or in a chip beside it.
     `#proj` is a direct child of <header>, so test/viewer_page.test.mjs still
     walks #proj -> header -> body -> .tab. */
  header { background:var(--head-bg); border-bottom:1px solid var(--hair);
    padding:14px clamp(14px,2.2vw,40px) 0; position:sticky; top:0; z-index:5;
    backdrop-filter:blur(6px);
    display:grid; grid-template-columns:auto minmax(0,1fr) auto;
    column-gap:16px; row-gap:0; align-items:center; }
  h1 { grid-column:1; grid-row:1; margin:0; display:flex; align-items:center; gap:12px;
    font:600 22px/1.1 var(--sans); letter-spacing:-.01em; }
  /* The mark, at 30px, centred on the wordmark — the mockup's proportion. */
  .mark { width:30px; height:30px; flex:none; }
  .marksprite { position:absolute; width:0; height:0; overflow:hidden; }
  /* The dateline. It ellipsizes rather than wrapping: it is one line. */
  .mline { grid-column:2; grid-row:1; display:flex; align-items:center; gap:8px;
    min-width:0; font:12.5px/1.4 var(--mono); color:var(--t2);
    overflow:hidden; white-space:nowrap; }
  .mline .mval { color:var(--t2); overflow:hidden; text-overflow:ellipsis; }
  .mline .msep { color:var(--t3); }
  .mline .mval b { color:var(--t1); font-weight:400; }
  select.proj { max-width:180px; min-width:0; font-size:12px; padding:1px 6px;
    text-overflow:ellipsis; font-family:var(--mono); }
  .projone { font-family:var(--mono); font-size:12.5px; color:var(--t1); }
  .projnone { color:var(--write); font-size:12px; display:inline-block; text-align:left;
    white-space:normal; }
  .projnone code { font-family:var(--mono); border:1px solid var(--write);
    border-radius:var(--r-tag); padding:0 4px; }
  /* BUILD IDENTITY, closed at rest. The control is a word on the line, not a
     box: it reads as one more field of the dateline until you use it, and the
     dashed rule under it is the only thing that says it can be used. Opened,
     the digest and the base commit take the places they used to hold, so a
     reader who lived on those two values gets the old line back with one
     click and keeps it. */
  .mbuildbtn { font:inherit; color:var(--t3); background:none; border:0; padding:0;
    cursor:pointer; border-bottom:1px dashed var(--hair); line-height:1.2; }
  .mbuildbtn:hover { color:var(--t1); border-bottom-color:var(--frame); }
  .mbuild { display:inline-flex; align-items:center; gap:8px; min-width:0; }
  /* The chips: what this answer is worth, and the two toggles. */
  .mchips { grid-column:3; grid-row:1 / span 2; justify-self:end; align-self:center;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
  .mchip { font:11.5px/1.6 var(--mono); padding:3px 10px; border-radius:var(--r-chip);
    border:1px solid var(--hair); color:var(--t2); background:var(--field-bg);
    white-space:nowrap; }
  button.mchip { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  button.mchip:hover { border-color:var(--frame); color:var(--t1); }
  .mchip.warn { border-color:var(--warn); color:var(--warn); background:none; }
  .mchip.ok { border-color:var(--ok); color:var(--ok); background:none; }
  /* THE VERDICT CHIPS (RM36). A state with nothing to warn about is a DOT and
     no words: the dot says the page has an opinion and the tooltip carries the
     engine's own verdict, so nothing is hidden and nothing is shouted. The dot
     is DRAWN, never a character, for the same reason the fold chevron is: a
     character comes out of the reader's font and gets read aloud. */
  .mchip.quiet { display:inline-flex; align-items:center; gap:7px; }
  /* The state, for a reader who is being read to. A chip whose whole message is
     a coloured dot says nothing to a screen reader, and the tooltip that carries
     the rest needs a pointer to exist at all. So the state is also written here,
     clipped to a pixel: no width, no height, no gap in the flex row (it is out
     of flow), and no visual change of any kind. */
  .sronly { position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }
  .mdot { width:6px; height:6px; flex:none; border-radius:50%; background:var(--t3); }
  .mchip.warn .mdot { background:var(--warn); }
  .mchip.ok .mdot { background:var(--ok); }
  /* A chip with a dot and no words is a dot, not a dot and a gap. */
  .mchip.quiet > span:not(.mdot):empty { display:none; }
  /* The limits list, when the chip above is opened: a full-width row under the
     masthead, so it pushes nothing sideways. */
  .mfolds { grid-column:1 / -1; grid-row:3; font-size:12px; color:var(--t2); }
  .mfolds .foldbody { padding-left:0; }
  /* The cascade rail: the six lanes of the chain, in the order it runs, joined
     by hairlines. A lane the pack does not ship is drawn hollow. */
  .crail { grid-column:1 / span 2; grid-row:2; display:flex; flex-wrap:wrap; align-items:baseline;
    font-size:12px; color:var(--t3); padding:6px 0 2px; }
  .crlane { display:inline-flex; align-items:baseline; gap:7px; white-space:nowrap; }
  .crlane b { font:500 13px/1 var(--mono); color:var(--t1); font-variant-numeric:tabular-nums; }
  .crlane.hollow, .crlane.hollow b { color:var(--t3); font-weight:400; }
  .crrule { width:20px; height:1px; background:var(--hair); margin:0 10px; flex:none;
    align-self:center; }
  /* Loading, and the server's own refusal: said under the line, not instead of
     the page. Empty once the meta has landed, so it takes no room at all. */
  .mnote { grid-column:1 / -1; grid-row:4; font-size:12px; color:var(--t2); padding:0 0 4px; }
  .mnote:empty { display:none; }
  /* Tabs are WORDS ON A RULE: the active one is underlined in the endpoint hue,
     sitting on the header's own bottom hairline. No folders, no fills. */
  .tabs { grid-column:1 / -1; grid-row:5; display:flex; gap:24px; flex-wrap:wrap; margin-top:10px;
    border-bottom:1px solid var(--hair); margin-bottom:-1px; }
  /* Under 1100px the chips drop below the line rather than squeezing it. */
  @media (max-width:1100px){
    header { grid-template-columns:auto minmax(0,1fr); row-gap:6px; }
    .mchips { grid-column:1 / -1; grid-row:3; justify-self:start; justify-content:flex-start; }
    .mfolds { grid-row:4; }
    .mnote { grid-row:5; }
    .tabs { grid-row:6; margin-top:4px; }
  }
  .tab { padding:8px 0 11px; border:0; border-bottom:2px solid transparent; margin-bottom:-1px;
    background:none; color:var(--t2); cursor:pointer; font-size:14px; font-family:inherit; }
  .tab:hover { color:var(--t1); }
  .tab.active { color:var(--t1); font-weight:600; border-bottom-color:var(--k-endpoint); }

  /* ---- sheets, controls, type ------------------------------------------- */
  .wrap { max-width:min(2400px, 100%); margin:0 auto; padding:18px clamp(14px,2.2vw,40px) 40px; }
  .searchbar { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
  input[type=text] { flex:1; min-width:180px; padding:7px 10px; border:1px solid var(--frame);
    border-radius:var(--r-tag); font:14px var(--sans); background:var(--field-bg); color:var(--t1); }
  input[type=text]::placeholder { color:var(--t3); }
  select, button { padding:7px 10px; border:1px solid var(--frame); border-radius:var(--r-tag);
    background:var(--field-bg); color:var(--t1); cursor:pointer; font:13px var(--sans); }
  button:hover, select:hover { border-color:var(--t1); }
  button.primary { background:var(--t1); color:var(--g0); border-color:var(--t1); }
  button.primary:hover { background:var(--t2); border-color:var(--t2); }
  button[disabled] { color:var(--t3); border-color:var(--hair); cursor:default; }
  .hint { color:var(--t2); font-size:13px; line-height:1.5; max-width:80ch; margin:2px 0 16px; }
  /* ONE WAY BACK, in the same place on every tab that can narrow: the right end
     of its own toolbar. It is disabled while the tab IS its opening state, so
     the control also reports whether anything is narrowed at all. */
  button.showall { margin-left:auto; }
  .hint code { font-family:var(--mono); font-size:12px; }
  /* A hint that has been folded is a LEAD and a chevron: the lead must not wrap
     at 1400px, so the 80ch measure moves off the block and onto the paragraph
     inside the fold, where it belongs. */
  .hint.hintfold { max-width:none; }
  .hint.hintfold .foldbody { max-width:80ch; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:900px){ .cols{ grid-template-columns:1fr; } }
  /* A sheet: square, one hairline frame, no shadow, no gradient. */
  .panel { background:var(--panel-bg); border:1px solid var(--hair); border-radius:var(--r-panel);
    box-shadow:var(--panel-shadow); padding:14px 16px; margin-bottom:14px; }
  .panel h2 { margin:0 0 9px; font-size:13px; font-weight:600; color:var(--t1);
    text-transform:none; letter-spacing:0; }
  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li { padding:6px 0; border-bottom:1px solid var(--hair); display:flex;
    align-items:center; gap:8px; justify-content:space-between; line-height:1.35; }
  ul.list li:last-child { border-bottom:0; }
  .id { font-family:var(--mono); font-size:12.5px; word-break:break-all; }
  a.id { color:var(--t1); cursor:pointer; text-decoration:none; border-bottom:1px solid var(--frame); }
  a.id:hover { border-bottom-color:var(--t1); }
  /* A ruled table: hairlines, no zebra, every number in Mono with tabular
     figures so a column of counts lines up on its digits. */
  table.ruled { width:100%; border-collapse:collapse; font-size:13px; line-height:1.35; }
  table.ruled th { text-align:left; font-weight:500; font-size:12px; color:var(--t3);
    padding:0 12px 5px 0; border-bottom:1px solid var(--frame); white-space:nowrap; }
  table.ruled th.num, table.ruled td.num { text-align:right; padding-right:0;
    font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.ruled td { padding:6px 12px 6px 0; border-bottom:1px solid var(--hair); vertical-align:baseline; }
  table.ruled tr:last-child td { border-bottom:0; }
  table.ruled td.wrapcell { word-break:break-word; }

  /* ---- certainty is a LINE, not a colour --------------------------------- */
  /* A grade chip is the grade's NAME in Mono inside a 2px box drawn with that
     grade's own stroke. The name is always printed, so nothing on this page
     depends on the stroke alone. EXACT is the one filled box. */
  .grade { position:relative; display:inline-block; font:500 11px/1.3 var(--mono);
    letter-spacing:.02em; padding:1px 6px; border-radius:var(--r-tag); white-space:nowrap;
    border:1.5px solid var(--t1); color:var(--t1); background:none; }
  .grade.g-EXACT { background:var(--t1); color:var(--g0); }
  .grade.g-SOUND_SET { border-style:dashed; }
  .grade.g-RUNTIME_ONLY { border-style:dotted; }
  /* dash-dot has no border-style: the box is an SVG rect inside the chip. */
  .grade.g-HEURISTIC { border-color:transparent; }
  .grade.g-HEURISTIC .gbox { display:block; }
  .gbox { display:none; position:absolute; left:0; top:0;
    width:calc(100% - 1.5px); height:calc(100% - 1.5px); overflow:visible; pointer-events:none; }
  /* UNRESOLVED: the outline only, muted, with one diagonal slash through it. */
  .grade.g-UNRESOLVED { border-color:var(--t3); color:var(--t3);
    background-image:linear-gradient(to top right, transparent calc(50% - .7px),
      var(--t3) calc(50% - .7px), var(--t3) calc(50% + .7px), transparent calc(50% + .7px)); }

  /* ---- small marks ------------------------------------------------------- */
  .tag { font:400 11px/1.4 var(--mono); padding:1px 6px; border-radius:var(--r-tag);
    border:1px solid var(--frame); color:var(--t2); background:none; white-space:nowrap; }
  .tag.read { color:var(--read); border-color:var(--read); }
  .tag.write { color:var(--write); border-color:var(--write); }
  .tag.warn { color:var(--t2); border-color:var(--t3); border-style:dashed; }
  /* A PROVISIONAL row exists only in the working-tree overlay: no certified run
     has ever seen it. Dashed, so it reads as "not settled" at a glance. */
  .tag.prov { color:var(--t3); border-color:var(--t3); border-style:dashed; }
  li.prov { outline:1px dashed var(--t3); outline-offset:2px; }
  .empty { color:var(--t3); padding:7px 0; font-size:13px; }
  .comment { color:var(--t2); font-size:12px; line-height:1.45; }
  .count { color:var(--t3); font-size:11.5px; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .dot { width:7px; height:7px; background:var(--t1); display:inline-block; }
  .kglyph { vertical-align:-1px; flex:none; }
  /* The kind / grade legends above a picture. */
  .klegend, .gmapleg, .famleg { display:flex; gap:13px; flex-wrap:wrap; font-size:11.5px;
    color:var(--t2); margin-bottom:9px; align-items:center; }
  .klegend span, .gmapleg span, .famleg span { display:inline-flex; align-items:center; gap:5px; }
  .gmapleg b, .famleg b { color:var(--t1); font-weight:600; }
  /* The map's line swatches carry the ACCESS hue the lines carry, so this rule
     sets the geometry only and lets the drawing say what colour it is. */
  .gmapleg .swatch { width:20px; height:2px; display:inline-block; vertical-align:middle; }
  /* The key for a connected project's ring: the ring itself, at legend size. */
  .fedring { width:11px; height:11px; border-radius:50%; border:1.6px solid var(--edge);
    display:inline-block; vertical-align:middle; flex:none; }
  /* A CONNECTED PROJECT'S ROW. The project's NAME is what the reader is looking
     for, so it takes the width and never falls below a few characters; the
     counts beside it are what shrinks and ellipsises. Without this the counts
     kept their full content width and `customers-service` rendered as
     `custome…`. The specificity is what it is because `.grow .id` sets
     min-width:0 and would otherwise win. Same lesson as the federated lane
     row's project chip. */
  .grow .id.fedname { flex:1 1 auto; min-width:6ch; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; word-break:normal; }
  /* …and it is CAPPED, not merely shrinkable. Flex shrinks two shrinkable
     items in proportion to their content width, so the longer counts text kept
     most of the room and the name still measured 60px and read `custom…`. The
     cap is the same 45% the RM44 project chip takes. */
  .count.fedcount { flex:0 1 auto; max-width:45%; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  /* ONE ROW PER CONNECTED PROJECT on the Overview. The whole row is the
     control: clicking anywhere on it opens that project. */
  .ovconn { display:block; width:100%; text-align:left; margin-top:8px; padding:8px 10px;
    background:var(--field-bg); border:1px solid var(--hair); border-radius:var(--r-tag);
    color:inherit; font:inherit; cursor:pointer; }
  .ovconn:hover { border-color:var(--frame); }
  .ovconn-none { cursor:default; }
  .ovconn-none:hover { border-color:var(--hair); }
  .ovconnhead { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  /* The two pan/zoom canvases the vendored renderer mounts into: it owns them
     and sizes them itself, so all this says is where the box is. */
  #garound, #erdcanvas { position:absolute; inset:0; }
  /* Hiding must beat whatever display a component sets for itself. */
  .hidden { display:none !important; }
  .srchead { display:flex; justify-content:space-between; align-items:center; gap:8px;
    font-size:11.5px; color:var(--t3); }
  .srchead .path { font-family:var(--mono); }
  .clickable { cursor:pointer; }

  /* ---- the fold: GLANCE, then READ, then INSPECT -------------------------- */
  /* One component, used everywhere on the page. The LEAD is a button carrying
     one line and a chevron in ink — no arrow characters, no "more" word, so the
     page does not repeat a label 30 times. The BODY is `display:none` until the
     reader opens it, which is why a closed fold costs nothing: not a line of
     text, not a line of layout, and nothing an assistive reader has to skip.
     NO MOTION: a height that animates is a height the reader waits for, and the
     lane strip's connectors are measured from the DOM the frame after a click. */
  .fold { margin:0; min-width:0; }
  button.foldlead { display:flex; align-items:baseline; gap:6px; width:100%; min-width:0;
    text-align:left; padding:1px 0; border:0; border-radius:0; background:none;
    color:inherit; font:inherit; cursor:pointer; }
  button.foldlead:hover { border:0; color:var(--t1); }
  .foldchev { flex:none; align-self:center; color:var(--t1); }
  button.foldlead.open .foldchev { transform:rotate(90deg); }
  .foldtext { min-width:0; }
  .foldbody { display:none; padding:5px 0 3px 14px; }
  .foldbody.open { display:block; }

  /* ---- the evidence rail: what this answer rests on ---------------------- */
  /* Replaces the dashed grey "honesty" box. Same place on every tab. The FIELD
     LABELS stay English whatever the interface language: they name the engine's
     own contract fields, and a translated one would be a field this page
     invented. Only the heading is the page's own words. */
  .rail { background:var(--panel-bg); border:1px solid var(--hair); border-radius:var(--r-panel);
    box-shadow:var(--panel-shadow); padding:14px 16px;
    margin-bottom:14px; font-size:12px; color:var(--t2); line-height:1.5; }
  .rail h2 { margin:0; font-size:13px; font-weight:600; color:var(--t1); }
  /* The rail's header carries the GRADE LEGEND — the five strokes, named — so
     the vocabulary sits beside the block that is about what an answer rests on
     rather than above every tab whether or not it draws a graded thing. */
  .railhead { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
    margin-bottom:10px; }
  .legend { display:flex; gap:7px; flex-wrap:wrap; align-items:center;
    font-size:11.5px; color:var(--t3); }
  /* A note the ENGINE wrote, inside a pane of the page's own: set apart by a
     rule down its left edge rather than by a box of its own. */
  .honesty { margin-top:10px; padding:2px 0 2px 11px; border-left:2px solid var(--frame);
    font-size:12px; color:var(--t2); line-height:1.5; overflow-wrap:anywhere; }
  .railsec { border-top:1px solid var(--hair); padding:8px 0 0; margin-top:8px; }
  .railsec:first-of-type { border-top:0; padding-top:0; margin-top:0; }
  .raillbl { display:block; font-size:11px; color:var(--t3); margin-bottom:3px; }
  .railrow { display:flex; justify-content:space-between; gap:12px; padding:1px 0; }
  .railrow span:last-child { font-family:var(--mono); text-align:right; overflow-wrap:anywhere; color:var(--t1); }
  .raillim { padding:3px 0; }
  /* A limit whose reason is short enough to BE its own lead carries no chevron;
     it is indented to the same column as the ones that do. */
  .raillim.plain { padding-left:14px; }
  .raillim .scope { font-family:var(--mono); color:var(--t1); }
  /* The rail COLLAPSED is one line of chips: the trust level, the freshness
     verdict, how many limits there are, and every field the answer truncated
     with its own shown/total. Those are the counts that were already on this
     page, and they stay outside every fold — only the SENTENCES fold. */
  .railchips { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:2px; }
  .railchip { font:400 11px/1.5 var(--mono); padding:1px 6px; border:1px solid var(--frame);
    border-radius:2px; color:var(--t1); background:none; max-width:100%; }
  .railchip { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button.railchip { display:inline-flex; width:auto; gap:5px; cursor:pointer;
    border:1px solid var(--frame); padding:1px 6px; }
  button.railchip:hover { border-color:var(--t1); color:var(--t1); }
  .railfolds { margin-top:6px; }
  .railfolds > .fold + .fold { margin-top:2px; }

  /* ---- Overview ---------------------------------------------------------- */
  .ovgrid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start; }
  @media (max-width:1100px){ .ovgrid{ grid-template-columns:minmax(0,1fr); } }
  /* ---- the hero, row 1: four KPI dials ----------------------------------- */
  /* One card per lane of the chain. The big number is the SHARE reached, in the
     lane's own kind hue; the fraction and what is left over are in mono under
     it; the arc on the right is the same share drawn. `color` is set on the
     card, so the number, the arc and its glow all read `currentColor` and the
     card carries exactly one hue. */
  /* FOUR OR FIVE, depending on whether this pack has a frontend, so the track
     count is not written down: auto-fit gives four wide cards on a backend-only
     pack and five narrower ones where the screen axis is there. */
  .ovkpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:14px; margin-bottom:18px; }
  @media (max-width:1100px){ .ovkpis{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:620px){ .ovkpis{ grid-template-columns:minmax(0,1fr); } }
  .kpi { position:relative; background:linear-gradient(180deg,var(--g3),var(--g1));
    border:1px solid var(--hair); border-radius:var(--r-panel); box-shadow:var(--panel-shadow);
    padding:16px 18px 14px; overflow:hidden; min-width:0; }
  .kpi .kpilbl { color:var(--t2); font-size:12.5px; }
  .kpi .kpinum { font:600 40px/1.05 var(--sans); letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; margin:6px 0 2px; color:currentColor; }
  .kpi .kpipct { font-size:20px; color:var(--t3); }
  .kpi .kpiden { color:var(--t3); font:12px var(--mono); font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kpi .kpidial { position:absolute; right:14px; top:14px; }
  /* One line under the denominator, for a dial whose DENOMINATOR is itself a
     lower bound: a router the server fills in at run time. */
  .kpi .kpinote { color:var(--t3); font-size:11.5px; margin-top:3px; line-height:1.35; }
  .kpi .kpitrack { stroke:var(--g3); }
  [data-theme="signal"] .kpi .kpitrack { stroke:#1E2740; }
  .kpi .kpiarc { stroke:currentColor; filter:var(--kpiglow); }
  [data-theme="signal"] .kpi { --kpiglow:drop-shadow(0 0 6px currentColor); }
  [data-theme="drawing"] .kpi { --kpiglow:none; }
  /* The arcs draw themselves in, once, on the first paint of the signal theme —
     600ms, and never again. The drawing theme has no motion at all, and neither
     does a reader who asked their system for less of it (the global
     prefers-reduced-motion rule below turns every animation off). */
  @keyframes kpisweep { from { stroke-dasharray:0 1000; } }
  [data-theme="signal"] .kpi .kpiarc { animation:kpisweep .6s ease-out 1; }
  /* ---- the hero, row 2: cartography, and what it does not show ----------- */
  .ovhero { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:18px; align-items:start; margin-bottom:16px; }
  @media (max-width:1100px){ .ovhero{ grid-template-columns:minmax(0,1fr); } }
  .ovherocol { display:grid; gap:16px; align-content:start; }
  .ovherocol .panel { margin-bottom:0; }
  .panelsub { color:var(--t3); font-size:12.5px; margin:0 0 14px; }
  #ovmap { position:relative; height:420px; min-height:300px; overflow:hidden;
    border:1px solid var(--hair); border-radius:10px; }
  #ovmapwrap { position:absolute; inset:0; }
  /* A busiest table: its name in the table hue, a bar for how many endpoints
     can reach it, and the count. The bar GLOWS where the theme says so. */
  .ovbar { display:flex; align-items:center; gap:14px; padding:8px 0;
    border-bottom:1px solid var(--hair); font-size:13px; }
  .ovbar:last-child { border-bottom:0; }
  .ovbar b { font:500 12.5px var(--mono); color:var(--k-table); font-weight:500;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:0 1 auto; }
  .ovbar .ovbartrack { flex:1 1 auto; min-width:24px; height:6px; border-radius:3px;
    background:var(--g3); position:relative; }
  .ovbar .ovbartrack i { position:absolute; left:0; top:0; bottom:0; border-radius:3px;
    background:var(--k-table); box-shadow:var(--barglow); }
  [data-theme="signal"] .ovbar .ovbartrack i {
    background:linear-gradient(90deg,var(--k-table),var(--k-endpoint));
    --barglow:0 0 10px rgba(52,211,153,.5); }
  [data-theme="drawing"] .ovbar .ovbartrack i { --barglow:none; }
  .ovbar .ovbarn { font:12.5px var(--mono); font-variant-numeric:tabular-nums;
    color:var(--t2); flex:none; }
  /* The grade row: the same five strokes the whole page uses for certainty. */
  .ovgrades { display:flex; gap:10px; flex-wrap:wrap; }
  /* ---- the ribbon, now under a fold ------------------------------------- */
  .ovfoldwrap { margin-bottom:16px; }
  .ribbon { padding:6px 0 10px; }
  .ribbon h2 { margin:0 0 2px; font-size:16px; font-weight:600; }
  .ribbonnote { font-size:12px; color:var(--t2); margin:0 0 6px; max-width:80ch; }
  .ribbonsvg { display:block; width:100%; height:auto; overflow:visible; }
  .ribbonsvg .band { cursor:default; }
  .ribbonsvg text { font-family:var(--mono); font-variant-numeric:tabular-nums; fill:var(--t1); }
  .ribbonsvg text.lane { font-family:var(--sans); font-size:13px; fill:var(--t1); }
  .ribbonsvg text.small, .ribbonsvg tspan.small { font-size:11px; fill:var(--t3); }
  .ribbonsvg tspan.num { font-size:13px; fill:var(--t1); }
  .ribbonsvg .ground { stroke:var(--frame); stroke-width:1; }
  .ribbonsvg .flowband { fill:var(--t1); opacity:.13; }
  .ribbonsvg .solid { fill:var(--t1); }
  .ribbonsvg .hatch { fill:url(#ribbonhatch); stroke:var(--t3); stroke-width:1; }
  .ribbonsvg g.on .flowband { opacity:.24; }
  .ribbonsvg g.dim { opacity:.35; }
  .ribbonsay { font-size:12.5px; color:var(--t1); min-height:1.5em; margin:6px 0 0; }
  .ovpanels { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; align-items:start; }
  .ovpanels .wide { grid-column:1 / -1; }
  @media (max-width:900px){ .ovpanels{ grid-template-columns:minmax(0,1fr); } }
  .ovgap { padding:8px 0; border-bottom:1px solid var(--hair); }
  .ovgap:last-child { border-bottom:0; }
  .ovgaphead { display:flex; align-items:baseline; gap:9px; }
  .ovgaphead .ovnum { margin-left:auto; }
  .ovnum { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; }
  .ovgapnote { font-size:12px; color:var(--t2); margin-top:3px; line-height:1.45; max-width:80ch; }
  .ovchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  button.ovchip { padding:2px 9px; font:400 11px var(--mono); border-radius:var(--r-chip);
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button.ovchip:hover { border-color:var(--t1); color:var(--t1); }
  /* A gap chip is a fold LEAD wearing the chip's box: what we could not see at
     a glance, the engine's sentence about it one click away. TWO TINTS ONLY,
     and neither of them is the error red (RM36): plain for a count of the pack
     itself, soft amber for a boundary of what the analyzer can see at all. A
     blind spot is this tool doing its job and saying so, not a fault, and the
     red we paint a broken thing in would have told a first-time reader the
     opposite. The tint is still a reading of the gap's KIND, never of its
     count. */
  button.foldlead.ovchip { display:inline-flex; width:auto; border:1px solid var(--hair);
    align-items:center; gap:5px; }
  button.ovchip.warn { border-color:var(--warn); color:var(--warn); }
  button.ovchip.warn:hover { color:inherit; }
  button.ovchip.warn .foldchev { color:inherit; }
  .ovgapbodies { margin-top:7px; }
  .ovhubmore { margin-top:7px; font-size:12px; }

  /* ---- Flow / Impact: four lanes with an SVG link overlay behind them ----- */
  /* THREE columns since RM27: the browse rail, the picture, the evidence rail.
     The picture keeps `minmax(0,1fr)` — it is the only one that may take what is
     left, and the lane-strip test pins that it carries no fixed width. At 1400px
     the evidence rail drops UNDER the picture rather than squeezing it; at
     1100px the browse rail becomes a drawer and leaves the grid entirely. */
  .flowgrid { display:grid; grid-template-columns:320px minmax(0,1fr) 320px; gap:18px;
    align-items:start; grid-template-areas:"brail canvas side"; }
  .flowgrid > .browserail { grid-area:brail; }
  .flowgrid > .flowcanvas { grid-area:canvas; }
  .flowgrid > .flowside { grid-area:side; }
  /* 1660px, not 1400: MEASURED in a real Chrome at 1440x900, three columns
     leave the picture 699px and its four 180px lanes need 896px, so the table
     lane (the one that answers the question) scrolled off the right. The
     evidence rail therefore drops under the picture until the picture can hold
     all four lanes without a horizontal scroll. */
  @media (max-width:1660px){
    .flowgrid { grid-template-columns:320px minmax(0,1fr);
      grid-template-areas:"brail canvas" "brail side"; }
  }
  @media (max-width:1100px){
    .flowgrid { grid-template-columns:minmax(0,1fr); grid-template-areas:"canvas" "side"; }
  }
  .flowcanvas { border:1px solid var(--frame); background:var(--g1); overflow:auto; max-height:78vh; }
  /* The four lanes SHARE the pane: fixed 252px lanes overflowed the box beside
     the 320px rail and the table lane — the one that answers the question — was
     scrolled off the right. They flex down to 180px, ellipsize (the full id is
     in `title`), and only cap once the pane is wide enough that a wider lane
     would be white space. The connectors are measured from the DOM, so they
     follow whatever width the lanes end up with. */
  .flowwrap { position:relative; display:flex; gap:54px; min-width:0; padding:14px; }
  /* The card the tab shows BEFORE anything is picked is the only child of the
     strip, so it takes the pane rather than sitting in one lane's width. */
  .flowwrap > .panel { flex:1; min-width:0; margin:0; }
  .flowsvg { position:absolute; inset:0; pointer-events:none; z-index:0; overflow:visible; }
  .fcol { flex:1 1 0; min-width:180px; position:relative; z-index:1; }
  /* Under 1200px the gutters, not the lanes, are what has to give: four 180px
     lanes plus three 54px gutters is wider than the pane a stacked rail leaves. */
  @media (max-width:1200px){ .flowwrap{ gap:30px; } }
  @media (min-width:1600px){ .fcol{ max-width:300px; } }
  .fcolhead { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    border-bottom:1px solid var(--frame); padding-bottom:5px; margin-bottom:8px; }
  .fcoltitle { font-size:12px; font-weight:600; color:var(--t1); text-transform:none; letter-spacing:0; }
  .fcolsub { display:flex; align-items:center; gap:6px; margin:-3px 0 8px; flex-wrap:wrap; }
  button.moreb, button.mini { padding:1px 7px; font-size:11px; }
  /* A lane row: a ruled line, not a card. Opaque and above the link overlay, so
     a curve passing behind it never looks like it touches it. */
  .frow { background:var(--g1); border:0; border-bottom:1px solid var(--hair);
    padding:6px 16px 7px 7px; margin-bottom:0; cursor:pointer; position:relative; z-index:1;
    overflow:hidden; transition:opacity .12s; }
  .frow:hover { background:var(--g0); }
  .frow.sel { box-shadow:inset 2px 0 0 var(--t1); background:var(--g0); }
  .frow.hot { background:var(--g0); }
  .frow.dim { opacity:.22; }
  .frowtop { display:flex; align-items:center; gap:6px; min-width:0; }
  .frowtop > * { min-width:0; }
  .frowtop .grade, .fhopn, .frowtop .kglyph { flex:none; }
  /* THE NAME IS THE ROW. It takes what is left over, and it has a FLOOR: with
     `flex:1` its basis is 0, so a sibling that keeps its full content width
     (the project chip on a federated row) took the whole line and the name
     collapsed to nothing. It grows and shrinks from its own content instead,
     and never below a few characters. */
  .fname { font-family:var(--mono); font-size:12px; flex:1 1 auto; min-width:6ch; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  /* ...and the chip that says which project a federated row came from is what
     gives way: it shrinks, ellipsises, and keeps the whole id in its tooltip. */
  .tag.fproj { flex:0 1 auto; max-width:45%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .fhopn { font:400 10px var(--mono); color:var(--t3); border:1px solid var(--hair);
    border-radius:var(--r-tag); padding:0 4px; }
  /* In the signal room a hop chip carries its row's own kind, so a lane reads
     as one colour from the glyph through the number. In the drawing theme every
     kind is ink and a tinted box would be the only hue on a page that has none. */
  [data-theme="signal"] .fhopn.kh-service { color:var(--k-service); border-color:var(--k-service); }
  [data-theme="signal"] .fhopn.kh-statement { color:var(--k-statement); border-color:var(--k-statement); }
  [data-theme="signal"] .fhopn.kh-webfn { color:var(--k-webfn); border-color:var(--k-webfn); }
  [data-theme="signal"] .fhopn.kh-screen { color:var(--k-screen); border-color:var(--k-screen); }
  .fsub { display:flex; align-items:center; gap:5px; margin-top:3px; min-width:0; }
  /* A lane row's SECOND LINE — the candidate band it came through, the mapper
     method it went via, the read/write tags — is READ level: it belongs to the
     row the reader is pointing at, has focused, or has selected. It is HIDDEN,
     not removed: the row keeps its height, so the bezier connectors measured
     from the DOM still land on the rows they were drawn between, and pointing
     at a row cannot make the picture under the pointer jump. */
  .frow .fsub { visibility:hidden; }
  .frow:hover .fsub, .frow:focus .fsub, .frow:focus-within .fsub,
  .frow.sel .fsub { visibility:visible; }
  .fsub > * { min-width:0; }
  .fsub .tag, .fsub .grade { flex:none; }
  .fsub .comment, .fsub .count { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fhop { font-size:11px; color:var(--t3); margin:12px 0 5px; border-top:1px solid var(--frame);
    padding-top:5px; }
  /* A candidate band inside a hop: the divider carries the band's own stroke. */
  .fdiv { font-size:11px; margin:9px 0 5px; padding-top:5px; border-top:1.5px dashed var(--t3);
    color:var(--t2); }
  .fdiv.fheur { border-top-style:dotted; }
  /* A connector says how sure the hop is (the colour and the dash) and whether
     the reader is looking at it (`hot` / `dim`). `obs` says one more thing and
     only with WEIGHT: a capture of the running system saw this hop run. The
     colour and the dash are untouched, so the mark can never read as a grade.
     Ordered after `hot` so a hover still wins, and heavier again when both. */
  path.flink { fill:none; stroke-width:1.5; transition:opacity .12s; }
  path.flink.dim { opacity:.07; }
  path.flink.hot { stroke-width:2.4; }
  path.flink.obs { stroke-width:2.8; }
  path.flink.hot.obs { stroke-width:3.4; }
  /* The travelling dots. `off` is a connector the reader cannot see (scrolled
     past, or outside the chain they are reading): it comes off the picture
     rather than burning a frame budget behind their back. SMIL has no per-dot
     pause, so this IS the pause. */
  .fdots circle { opacity:.72; }
  .fdots.off { display:none; }
  .fdots.hot circle { opacity:1; r:2.9; }
  path.farrow { stroke:none; opacity:.8; }
  .erdswatch { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px;
    vertical-align:-1px; }
  .flowside { min-width:0; }
  .flowside .srchead { flex-wrap:wrap; }
  .flowside .srchead .path { min-width:0; overflow-wrap:anywhere; }
  .flowside .fsub { flex-wrap:wrap; }
  .flowside .fsub .tag { flex:none; max-width:100%; overflow-wrap:anywhere; }
  .fcard, .fcard .id, .fcard .comment, .fcard code { overflow-wrap:anywhere; word-break:normal; white-space:normal; }
  .fcard .grow .id, .grow .id { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; word-break:normal; }
  .grow { display:flex; align-items:center; gap:7px; min-width:0; flex:1; }
  .fpath { margin:6px 0 0; padding-left:18px; font-size:12px; overflow-wrap:anywhere; }
  .fpath li { margin-bottom:6px; }
  .sug { position:absolute; z-index:9; left:0; right:0; top:calc(100% + 2px); background:var(--g1);
    border:1px solid var(--t1); border-radius:2px; max-height:290px; overflow:auto; }
  .sugrow { padding:5px 9px; cursor:pointer; display:flex; justify-content:space-between;
    gap:10px; align-items:baseline; border-bottom:1px solid var(--hair); }
  .sugrow:last-child { border-bottom:0; }
  .sugrow:hover, .sugrow.cur { background:var(--g0); box-shadow:inset 2px 0 0 var(--t1); }
  /* Flow tab — LAYERS: the same walk folded per hop. */
  .seg { display:inline-flex; border:1px solid var(--frame); border-radius:2px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:7px 11px; background:var(--g1); color:var(--t2); }
  .seg button + button { border-left:1px solid var(--frame); }
  .seg button.on, .seg button.on:hover { background:var(--t1); color:var(--g0); }
  .seg.mini button { padding:3px 9px; font-size:12px; }
  .flowwrap.layersmode { display:block; min-width:0; max-width:840px; }
  .lyrlead { font-size:12.5px; color:var(--t2); margin:2px 2px 12px; }
  .lyr { display:grid; grid-template-columns:62px minmax(110px,1fr) 74px 84px 62px 66px; gap:10px;
    align-items:center; padding:7px 4px; border-top:1px solid var(--hair); }
  .lyr.lyrhead { border-top:none; color:var(--t3); font-size:11px; }
  .lyrhop { font-family:var(--mono); font-size:12px; }
  .lyrbar { height:12px; background:var(--g0); border:1px solid var(--hair); }
  .lyrbarfill { display:flex; height:100%; min-width:2px; }
  .lyrbarfill i { display:block; height:100%; }
  .lyrcell { display:flex; align-items:center; gap:8px; min-width:0; }
  .lyrcell .lyrbar { flex:1; min-width:0; }
  /* A DERIVED hop: no link grades were walked into it, so it gets a hatched bar
     and the words next to it, never a grade stroke it did not earn. */
  .lyrbarfill.lyrderived { background:repeating-linear-gradient(45deg,var(--hair),var(--hair) 3px,var(--g1) 3px,var(--g1) 6px); }
  .lyrderivedlbl { font-size:10.5px; color:var(--t3); white-space:nowrap; flex:none; }
  .lyrbody { padding:2px 0 12px 62px; max-width:540px; }
  .lyrend { margin-top:16px; border-top:1px solid var(--frame); padding-top:10px; }

  /* ---- Coupling: a group x group matrix of DB sharing --------------------- */
  /* A cell shows a COUNT, not a grade: it is painted in INK at varying strength
     and never borrows the certainty vocabulary. The diagonal is hatched — a
     group sharing with itself is not coupling between modules. */
  .cpgrid { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start; }
  @media (max-width:1100px){ .cpgrid{ grid-template-columns:minmax(0,1fr); } }
  .cpsum { font-size:12.5px; color:var(--t2); margin:2px 2px 10px; }
  .cpsum b { color:var(--t1); font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .cpchk { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--t2); white-space:nowrap; }
  .cpscroll { border:1px solid var(--frame); background:var(--g1);
    overflow:auto; max-height:74vh; width:max-content; max-width:100%; }
  table.cpm { border-collapse:separate; border-spacing:0; font-size:12px; }
  table.cpm th, table.cpm td { border-bottom:1px solid var(--hair); border-right:1px solid var(--hair); }
  table.cpm thead th { position:sticky; top:0; z-index:2; background:var(--g1); text-align:left;
    font-size:11px; font-weight:500; color:var(--t3); padding:6px 8px; max-width:104px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.cpm tbody th { position:sticky; left:0; z-index:1; background:var(--g1); text-align:left;
    font-size:11.5px; font-weight:500; padding:5px 10px 5px 9px; max-width:158px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.cpm th.cpcorner { position:sticky; left:0; top:0; z-index:3; font-weight:400; }
  table.cpm th.hot { color:var(--t1); background:var(--g0); }
  table.cpm td { padding:0; text-align:center; }
  .cpcell { display:block; min-width:46px; padding:7px 6px; font-family:var(--mono);
    font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--t3); }
  .cpcell.on { cursor:pointer; color:var(--t1); font-weight:500; }
  .cpcell.on:hover, .cpcell.sel, .cpcell:focus-visible { outline:2px solid var(--t1); outline-offset:-2px; }
  .cpcell.diag { background:repeating-linear-gradient(45deg,var(--g0),var(--g0) 4px,var(--hair) 4px,var(--hair) 8px); }
  .cppair { display:flex; align-items:center; gap:6px; min-width:0; }
  .cppair .cpg { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cparrow { color:var(--t3); flex:none; }
  #cpside .id { overflow-wrap:anywhere; }
  .cpnote { margin-top:7px; font-size:11.5px; color:var(--t2); line-height:1.5; }
  .cpnote .tag { margin-right:5px; }

  /* ---- the browse rail: every tab opens showing the PACK ------------------ */
  /* Explore, Flow and Impact used to open on an empty input. Now they open on a
     LIST: the kinds this tab can show with their counts, a filter over the rows
     already loaded, a sort, the count line, and the rows. The class is
     `browserail` and not `rail`, because `.rail` is already the evidence block
     beside every answer.

     Its HEIGHT is measured in JS from its own top offset, the same rule RM25
     put on the Graph pane, so the list ends where the window does and scrolls
     inside itself instead of pushing the page down. */
  .exgrid { display:grid; grid-template-columns:320px minmax(0,1fr); gap:18px; align-items:start; }
  .browserail { display:flex; flex-direction:column; min-width:0; min-height:420px;
    border:1px solid var(--frame); background:var(--g1); border-radius:var(--r-panel); }
  .brtop { padding:10px 12px 9px; border-bottom:1px solid var(--hair);
    display:flex; flex-direction:column; gap:8px; }
  /* A GRID THAT WRAPS EVENLY, not a strip that scrolls. The scrolling strip it
     replaces measured 408px of English against a 318px rail, so `Methods` was
     off screen until the reader thought to drag sideways, and a chip nobody can
     see is worse than a second row. `auto-fit` with a 92px floor gives equal
     cells, so five chips read as a deliberate 3 + 2 block in English and 3 + 2
     or 5 in Korean, and the count sits in the same place in every cell. The
     hairlines between cells are the grid's own 1px gaps over the frame colour,
     which is what keeps the block reading as ONE control while it wraps. */
  .brkinds { display:grid; grid-template-columns:repeat(auto-fit, minmax(92px, 1fr));
    gap:0; width:100%; }
  /* Every cell draws its OWN left and top hairline as an inset shadow, so the
     seams are exactly 1px, the outer ones fall on the control's own border, and
     a row that does not fill its last column leaves NO empty ruled box behind. */
  .brkinds button { display:flex; align-items:baseline; justify-content:space-between;
    gap:6px; min-width:0; padding:3px 8px; font-size:11px; white-space:nowrap;
    background:var(--g1); border:0; border-radius:0;
    box-shadow:inset 1px 0 0 var(--frame), inset 0 1px 0 var(--frame); }
  .brkinds button + button { border-left:0; }
  .brn { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:10px;
    opacity:.7; margin-left:auto; }
  .brfilter { display:flex; gap:6px; align-items:center; }
  .brfilter input[type=text] { min-width:0; font-size:13px; padding:6px 9px; }
  .brfilter button { padding:6px 9px; font-size:12px; flex:none; }
  .brsort { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brsort select { flex:0 1 auto; min-width:0; font-size:12px; padding:3px 6px; }
  .brcount { font-size:11px; color:var(--t3); font-family:var(--mono);
    font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* The count line grows a second sentence on ONE list: the endpoints the
     masthead counts and this rail does not, because they are routes the pack
     calls and does not serve. Two numbers on one screen that do not match is a
     bug report; connected, it is a fact. */
  .brcount.brwide { white-space:normal; text-align:right; }
  .brout { display:block; color:var(--t3); font-family:var(--sans);
    font-size:10.5px; line-height:1.35; margin-top:2px; }
  .brlist { flex:1 1 auto; min-height:0; overflow:auto; }
  .brlist .empty { padding:12px; font-size:12px; color:var(--t2); line-height:1.5; }
  .brfoot { padding:7px 12px; border-top:1px solid var(--hair); display:flex;
    align-items:center; justify-content:space-between; gap:8px; }
  .brfoot:empty { display:none; }
  .brkeys { padding:7px 12px 9px; border-top:1px solid var(--hair);
    font-size:10.5px; color:var(--t3); }
  /* A row is a ruled line, never a card: the id in Mono, a dim second line, and
     the numbers you would pick by, right aligned in tabular figures. */
  .brwrap { display:flex; align-items:stretch; border-bottom:1px solid var(--hair); }
  .brwrap .brrow { border-bottom:0; flex:1; min-width:0; }
  /* The right padding is the CHEVRON's gutter, reserved whether or not the
     pointer is on the row: a mark that appears over a number is a number the
     reader can no longer read. */
  button.brrow { display:block; width:100%; text-align:left; background:none; border:0;
    border-bottom:1px solid var(--hair); border-radius:0; padding:5px 21px 6px 12px;
    cursor:pointer; font:inherit; color:inherit; position:relative; }
  button.brrow:hover { background:var(--g0); border-color:var(--hair); }
  button.brrow.cur { background:var(--g0); }
  button.brrow[aria-selected="true"], button.brrow.on { background:var(--g0);
    box-shadow:inset 2px 0 0 var(--t1); }
  button.brrow:focus-visible { outline:2px solid var(--t1); outline-offset:-2px; }
  .brline { display:flex; align-items:center; gap:8px; min-width:0; }
  .brid { font-family:var(--mono); font-size:12px; flex:1; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; color:var(--t1); }
  .brsub { font-size:10.5px; color:var(--t3); margin-top:1px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .brstats { display:flex; align-items:center; gap:7px; flex:none; }
  /* A LABEL, not a glyph. The row used to read `◆ 22 ▶ 29`, which is a legend
     the reader does not have; it now reads `sql 22  api 29`. The labels are the
     engine's own nouns and are the same in every language, the number stays in
     tabular figures so a column of rows lines up, and the full sentence is
     still in the chip's title. */
  .brstat { display:inline-flex; align-items:baseline; gap:3px; font-family:var(--mono);
    font-variant-numeric:tabular-nums; font-size:10.5px; color:var(--t2); }
  .brstat .brlbl { font-size:9.5px; color:var(--t3); }
  .brstat.read, .brstat.read .brlbl { color:var(--read); }
  .brstat.write, .brstat.write .brlbl { color:var(--write); }
  .brflag { font:400 9.5px/1.5 var(--mono); padding:0 4px; border:1px solid var(--frame);
    border-radius:var(--r-tag); color:var(--t3); flex:none; }
  /* Flow buckets its rows under the API group each endpoint belongs to. */
  button.brgroup { display:flex; width:100%; text-align:left; align-items:center; gap:8px;
    background:var(--g0); border:0; border-bottom:1px solid var(--hair); border-radius:0;
    padding:5px 12px; font:inherit; font-size:11.5px; color:var(--t2); cursor:pointer;
    position:sticky; top:0; z-index:1; }
  button.brgroup:hover { color:var(--t1); border-color:var(--hair); }
  .brgname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:600; color:var(--t1); font-family:var(--mono); font-size:11.5px; }
  .brgn { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:10px; color:var(--t3); }
  /* Impact opens a table into its own columns: the caret is its own control, so
     the row beside it still picks the table. */
  button.brcaret { flex:none; width:22px; padding:0; border:0; border-radius:0;
    background:none; color:var(--t3); font:10px/1 var(--mono); cursor:pointer; }
  button.brcaret:hover { color:var(--t1); border-color:transparent; }
  button.brrow.brchild { padding-left:34px; }
  .brchildren { border-bottom:1px solid var(--hair); }
  /* The quick picks: what the right-hand side says before anything is picked. */
  .brpicks { margin:0; padding:0; list-style:none; }
  .brpicks li { border-bottom:1px solid var(--hair); }
  .brpicks li:last-child { border-bottom:0; }
  button.brpick { display:flex; width:100%; text-align:left; align-items:center; gap:10px;
    background:none; border:0; border-radius:0; padding:7px 2px; cursor:pointer;
    font:inherit; color:inherit; }
  button.brpick:hover { background:var(--g0); border-color:transparent; }
  /* Under 1100px the rail is a DRAWER over the content, opened from the toolbar
     and closed by Escape or by picking something. */
  .brtoggle, .brclose { display:none; }
  .brscrim { display:none; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.42); }
  @media (max-width:1100px){
    .exgrid { grid-template-columns:minmax(0,1fr); }
    .browserail { position:fixed; left:0; top:0; bottom:0; z-index:41; width:min(360px,92vw);
      height:auto !important; transform:translateX(-102%); transition:transform .18s ease;
      box-shadow:var(--panel-shadow); border-radius:0; border-left:0; }
    .browserail.open { transform:none; }
    .brtoggle, .brclose { display:inline-flex; }
    .brscrim.on { display:block; }
  }
  /* A PICKABLE ROW LOOKS PICKABLE BEFORE IT IS TOUCHED. Both the rail's rows
     and the chain lanes' rows answer a click, and neither said so: the pointer
     is already a hand, and on hover a faint chevron appears at the right edge.
     It is drawn as a pseudo-element over the row's own hover ground, so it
     costs no layout and cannot move a connector measured from the DOM. */
  button.brrow::after, .frow::after { content:"\203A"; position:absolute; right:6px; top:50%;
    transform:translateY(-50%); font:13px/1 var(--mono); color:var(--t3);
    opacity:0; pointer-events:none; }
  button.brrow:hover::after, button.brrow:focus-visible::after,
  .frow:hover::after, .frow:focus::after, .frow:focus-within::after { opacity:.8; }

  /* ---- the source pane: the evidence, at reading size --------------------- */
  /* THE PICTURE IS THE CLAIM; THE SOURCE IS THE EVIDENCE, and evidence has to be
     readable where the claim is made. Every inline preview on this page used to
     be a 286 by 360 pixel box inside a 320px side panel: 35 lines of a MyBatis
     statement with 673px of scroll behind it, no line numbers, nothing marking
     the line the answer was about, and no way to enlarge it.
     One pane replaces all of them. It is docked to the RIGHT edge, full height
     under the masthead, and carries NO SCRIM: the reader keeps clicking rail
     rows, chain rows and map nodes underneath and the pane updates in place,
     the way an IDE preview does. */
  .srcpane { position:fixed; right:0; top:0; bottom:0; z-index:46;
    display:flex; flex-direction:column; min-height:0;
    width:56vw; min-width:420px; max-width:90vw;
    background:var(--g1); border-left:1px solid var(--frame); box-shadow:var(--panel-shadow); }
  /* The left edge IS the size control: 6px of drag, with a grip that appears
     under the pointer. At rest the pane is a page, not an instrument. */
  .srcgrab { position:absolute; left:0; top:0; bottom:0; width:6px; padding:0;
    border:0; border-radius:0; background:none; cursor:col-resize; z-index:2; }
  .srcgrab:hover, .srcgrab.on { background:var(--frame); }
  .srcgrab::after { content:""; position:absolute; left:2px; top:50%; margin-top:-17px;
    width:2px; height:34px; background:var(--t1); border-radius:1px; opacity:0; }
  .srcgrab:hover::after, .srcgrab.on::after { opacity:.8; }
  .srchd { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px;
    padding:9px 14px 9px 18px; border-bottom:1px solid var(--hair);
    font-size:11.5px; color:var(--t3); }
  .srchd .srcnode { font-family:var(--mono); font-size:12px; color:var(--t1);
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srcgap { flex:1 1 8px; min-width:0; }
  button.srcpath { font:11.5px var(--mono); color:var(--t2); background:none; border:0;
    border-radius:0; padding:0; cursor:pointer; text-align:left; min-width:0; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button.srcpath:hover { color:var(--t1); border:0; text-decoration:underline; }
  .srcrange { font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .srchd select, .srchd button.mini { font-size:11px; padding:2px 7px; }
  .srchd .seg button { padding:2px 8px; font-size:11px; }
  /* "Open in editor" is a LINK, because a `vscode://` or `idea://` URL is what
     hands a file to another application; it only wears the button's box. */
  a.srcopen { display:inline-block; padding:2px 8px; font:13px var(--sans); font-size:11px;
    border:1px solid var(--frame); border-radius:var(--r-tag); background:var(--field-bg);
    color:var(--t1); text-decoration:none; white-space:nowrap; }
  a.srcopen:hover { border-color:var(--t1); }
  /* The code. A gutter of REAL file line numbers, 13px mono, and NO WRAPPING:
     a wrapped line of SQL is a line whose indentation lies about its nesting,
     so the pane scrolls sideways instead. The gutter is sticky, so a sideways
     scroll never takes the numbers away. */
  .srcbody { flex:1 1 auto; min-height:0; overflow:auto; background:var(--g0);
    font:13px/1.55 var(--mono); tab-size:4; -moz-tab-size:4; }
  .srccode { display:table; min-width:100%; }
  .srcln { display:table-row; }
  .srcln > span { display:table-cell; }
  .srcno { position:sticky; left:0; z-index:1; width:1%; white-space:nowrap; user-select:none;
    padding:0 10px 0 14px; text-align:right; color:var(--t3); background:var(--g0);
    border-right:1px solid var(--hair); font-variant-numeric:tabular-nums; }
  .srctx { padding:0 18px 0 12px; white-space:pre; color:var(--t1); }
  /* THE LINES THE ANSWER IS ABOUT: a bar down their left edge in the read blue
     and a tint of it behind them, so the extracted range is visible at a glance
     inside a whole file of context. */
  .srcln.hi .srcno { background:var(--src-hi); color:var(--t2);
    box-shadow:inset 3px 0 0 var(--read); }
  .srcln.hi .srctx { background:var(--src-hi); }
  /* Three regexes, and nothing cleverer: comments, string literals, XML tags. */
  .srccm { color:var(--t3); font-style:italic; }
  .srcst { color:var(--ok); }
  .srctg { color:var(--k-statement); }
  .srcft { border-top:1px solid var(--hair); padding:9px 14px 10px 18px; font-size:12px;
    color:var(--t2); line-height:1.5; display:flex; align-items:baseline; gap:8px;
    flex-wrap:wrap; }
  .srcft .id { font-family:var(--mono); font-size:11.5px; }
  .srcmsg { padding:16px 18px; color:var(--t2); font-size:13px; line-height:1.55; }
  /* The excerpt the Flow/Impact card keeps: six lines that do not scroll. The
     card used to hold a second scrolling code box, which is how the reader
     ended up reading 35 lines through a 360px window in the first place. */
  .srcexc { margin-top:8px; padding:7px 10px; border-left:2px solid var(--frame);
    background:var(--g0); font:11.5px/1.5 var(--mono); color:var(--t2);
    white-space:pre; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:1100px){
    .srcpane { width:100vw !important; min-width:0; max-width:none; border-left:0; }
    .srcgrab { display:none; }
  }

  /* ---- the drawings: Graph map, Around, ERD ------------------------------- */
  /* Their background is the one decorative element on the page, and it is the
     paper the drawing sits on: a 24px drafting grid in hairline ink. */
  .sheetgrid { background-color:var(--g1); border-radius:var(--r-panel); }
  [data-theme="drawing"] .sheetgrid {
    background-image:linear-gradient(var(--hair) 1px, transparent 1px),
                     linear-gradient(90deg, var(--hair) 1px, transparent 1px);
    background-size:24px 24px; }
  .gtgrid { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start; }
  @media (max-width:1100px){ .gtgrid{ grid-template-columns:minmax(0,1fr); } }
  /* The height is set in JS from this box's OWN top offset, so the picture ends
     where the window does whatever the toolbar above it grew to. These are the
     values before the first measurement and the floor it is clamped to. */
  #gwrap { height:72vh; min-height:420px; overflow:hidden; border:1px solid var(--frame); position:relative; }
  #gside { max-height:72vh; overflow:auto; }
  /* The three corner overlays. They report on the picture, so they sit on it,
     and they let the pointer through: a reader dragging the map must not catch
     on a legend. The chips inside the top-left one are toggles and take their
     own clicks back. */
  .gover { position:absolute; z-index:3; pointer-events:none; max-width:calc(100% - 20px);
    padding:5px 8px; border-radius:var(--r-tag); background:var(--overlay);
    border:1px solid var(--hair); backdrop-filter:blur(2px); }
  .gover-tl { top:8px; left:8px; max-width:calc(100% - 16px); }
  /* The two bottom corners share the width rather than run into each other:
     the legend takes the left 46%, the count line the right 52%. */
  .gover-bl { bottom:8px; left:8px; max-width:46%; }
  .gover-br { right:8px; bottom:8px; max-width:50%; text-align:right; }
  /* The Overview's map has no count line beside it, so its legend takes the
     whole width rather than wrapping into three rows inside a narrow panel. */
  #ovmap .gover-bl { max-width:calc(100% - 16px); }
  .gover .chips, .gover .gmapleg, .gover .klegend, .gover .gcount { margin:0; }
  .gover .gmapleg, .gover .klegend, .gover .gcount { font-size:10.5px; gap:8px; line-height:1.5; }
  .gover .gcount b, .gover .gcount .count { font-size:10.5px; }
  .gover button.chip { pointer-events:auto; }
  /* The Overview is a page you scroll, so its map does not take the wheel until
     it has been asked to. This says so, on hover, inside the canvas. */
  .gwheel { position:absolute; z-index:4; left:50%; bottom:10px; transform:translateX(-50%);
    padding:3px 9px; border-radius:var(--r-tag); background:var(--overlay);
    border:1px solid var(--hair); color:var(--t2); font-size:11.5px; pointer-events:none; }
  .erdgrid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start; }
  @media (max-width:1100px){ .erdgrid{ grid-template-columns:minmax(0,1fr); } }
  #erdwrap { height:78vh; min-height:540px; overflow:hidden; border:1px solid var(--frame); position:relative; }
  #erdside { max-height:78vh; overflow:auto; }
  #gmapwrap { position:absolute; inset:0; }
  #gmaplabels { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:2; }
  .gmaplbl { position:absolute; white-space:nowrap; font:11px var(--mono); color:var(--t1);
    transform:translate(0,-50%);
    text-shadow:0 0 3px var(--halo), 0 0 3px var(--halo), 0 0 3px var(--halo); }
  .gmaplbl.on { font-weight:500; }
  .gmapmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px; color:var(--t2); font-size:13px; }
  .grendnote { font-size:11.5px; color:var(--t2); align-self:center; }
  #gflow.off { color:var(--t3); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 8px; }
  button.chip { padding:2px 9px; font-size:11.5px; border-radius:2px; display:inline-flex;
    align-items:center; gap:6px; }
  button.chip.off { color:var(--t3); border-color:var(--hair); text-decoration:line-through; }
  .gcount { font-size:11.5px; color:var(--t2); margin:0 0 9px; }
  .gcount b { color:var(--t1); font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .isogrid { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  button.isochip { padding:1px 7px; font:400 11px var(--mono); border-radius:2px;
    display:inline-flex; align-items:center; gap:5px; max-width:100%; }
  .pk { color:var(--join); }
  .card { font:500 10px var(--mono); padding:1px 5px; border-radius:2px; color:var(--join);
    border:1px solid var(--join); }
  /* Over 12 columns a single list runs off the bottom of the rail. */
  .colgrid2 { columns:2; column-gap:16px; }
  .colgrid2 li { break-inside:avoid; }
  /* The pictures' tooltip. A native title takes about a second to appear — too
     slow for a picture you read by sweeping the pointer over it. */
  #gtip { position:fixed; z-index:60; display:none; pointer-events:none; max-width:340px;
    padding:5px 8px; border-radius:var(--r-tag); background:var(--g3); color:var(--t1);
    border:1px solid var(--frame); box-shadow:var(--panel-shadow);
    font:11.5px/1.45 var(--mono); white-space:pre-wrap; }

  /* Motion: none on load, anywhere. The map's directional particles answer a
     toggle, and that toggle starts OFF when the reader asked for less motion. */
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<!-- THE MARK, once, as a symbol: a fall in three steps whose stroke thins and
     whose blue lightens as it descends — the chain from an endpoint down to a
     column, losing certainty on the way — landing on a blue dot. ONE HUE
     FAMILY: the page's read blue and its tint over ink. Never the write red or
     the join ochre, never a gradient, never rotated or mirrored. The colours
     are per part and explicit, so this symbol carries the light-ground palette
     wherever it is used; the dark-ground variant is a file of its own
     (viewer/cascade-mark-dark.svg), not a recolouring of this one. -->
<svg class="marksprite" aria-hidden="true" focusable="false">
  <symbol id="cascade-mark" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4.5h8v6" stroke="#1B2A41" stroke-width="2.8"></path>
    <path d="M10.5 10.5h5.5v6" stroke="#2B5FA5" stroke-width="2.2"></path>
    <path d="M16 16.5h3.5" stroke="#7FA6D8" stroke-width="1.6"></path>
    <circle cx="20.5" cy="16.5" r="1.9" fill="#2B5FA5"></circle>
  </symbol>
</svg>
<header>
  <h1><svg class="mark" aria-hidden="true" focusable="false"><use href="#cascade-mark"></use></svg>Cascade</h1>
  <!-- THE DATELINE: which pack answered and which analyzers ran, on one mono
       line. The project cell is the SELECTOR when this server holds several
       packs, because the first field of the line IS which pack answered;
       printing the name here and the control somewhere else would print the
       project twice.
       BUILD IDENTITY IS ONE CLICK BEHIND IT (RM36). The digest and the base
       commit are the two facts a reader needs when two builds disagree, and
       the two a reader meeting this tool has to look past on every other day.
       So they sit in `#mbuild`, closed at rest, opened by the `build` control
       and remembered like every other fold on this page. Nothing left the
       page: the values are here, verbatim, one activation away. -->
  <div class="mline" id="mline">
    <span class="mval" data-t-title="mast.project">
      <select id="projsel" class="proj hidden" data-t-title="project.select.title"></select>
      <span id="projone" class="projone hidden"></span>
      <span id="projnone" class="projnone hidden"></span>
    </span>
    <span class="msep" aria-hidden="true">·</span><span class="mval" id="mlanes" data-t-title="mast.lanes"></span>
    <span class="msep" aria-hidden="true">·</span><button type="button" class="mbuildbtn" id="mbuildbtn" aria-controls="mbuild" aria-expanded="false" data-t="mast.build" data-t-title="mast.build.title">build</button>
    <span class="mbuild hidden" id="mbuild">
      <span class="mval" id="mdigest" data-t-title="mast.digest"></span>
      <span class="msep" aria-hidden="true">·</span><span class="mval" data-t-title="mast.base">base <span id="mbase"></span></span>
    </span>
  </div>
  <!-- The cascade rail: the six lanes of the chain this product walks, in the
       order it walks them, joined by hairlines. Every count is the `overview`
       answer's own node census — the page counts nothing itself. -->
  <div class="crail" id="crail"></div>
  <!-- What this answer is worth, and the two things the reader may change:
       freshness, trust, the limits (the same fold the evidence rail carries),
       the interface language and the theme. Built in renderMastChrome().
       The two verdict chips carry NO static label since RM36: a chip that
       always printed `freshness` and `trust` had to print a word after it on
       every load, and the resting word for both is the one that frightens a
       first-time reader. Now each chip is a drawn dot plus whatever the state
       actually has to say, and the engine's own verdict is in the tooltip.
       `#mfreshsr` and `#mtrustsr` are that same state written for a screen
       reader: a dot and a tooltip are a pointer's affordances, and the state
       has to reach a reader who has neither. -->
  <div class="mchips" id="mchips">
    <span class="mchip quiet" id="mfreshchip"><span class="mdot" aria-hidden="true"></span><span class="sronly" id="mfreshsr"></span><span id="mfresh"></span></span>
    <span class="mchip quiet" id="mtrustchip"><span class="mdot" aria-hidden="true"></span><span class="sronly" id="mtrustsr"></span><span id="mtrust"></span></span>
    <!-- WHICH CAPTURE INFORMED THIS PACK. Present only when the landing answer
         carries `basis.runtimeEvidence`, and as quiet as the two chips before
         it: the source word and the span count in ink, the capture's own
         coverage note one hover behind. It carries no dot, because the chip's
         own text IS the state and there is nothing a colour would add. -->
    <span class="mchip quiet hidden" id="mtracechip"><span id="mtrace"></span></span>
    <span id="mlimitcell"></span>
    <span class="seg mini" id="langseg" data-t-title="lang.title"></span>
    <span class="seg mini" id="themeseg" data-t-title="theme.title"></span>
  </div>
  <div class="mfolds" id="mfolds"></div>
  <div class="mnote" id="proj">loading…</div>
  <div class="tabs">
    <button type="button" class="tab active" data-tab="overview" data-t="tab.overview">Overview</button>
    <button type="button" class="tab" data-tab="explore" data-t="tab.explore">Explore</button>
    <button type="button" class="tab" data-tab="flow" data-t="tab.flow">Flow</button>
    <button type="button" class="tab" data-tab="impact" data-t="tab.impact">Impact</button>
    <button type="button" class="tab" data-tab="coupling" data-t="tab.coupling">Coupling</button>
    <button type="button" class="tab" data-tab="graph" data-t="tab.graph">Graph</button>
    <button type="button" class="tab" data-tab="erd" data-t="tab.erd">ERD</button>
    <button type="button" class="tab" data-tab="tx" data-t="tab.tx">Transactions</button>
  </div>
</header>

<div class="wrap">

             the very `map` answer the Graph tab uses — asked once and shared,

      <div>
        <div id="erdwrap" class="sheetgrid"><div id="erdcanvas"></div></div>
        <div id="erdiso"></div>
      </div>
      <div id="erdside"></div>
    </div>
    <div id="ehonesty"></div>
  </div>

  <!-- TRANSACTIONS TAB -->
  <div id="tab-tx" class="hidden">
    <div class="hint" data-t-fold="hint.tx"></div>
    <div id="txview"></div>
  </div>
</div>
<!-- The drawer's backdrop. One for all three tabs: only one rail is ever open,
     because only one tab is ever on screen. -->
<div class="brscrim" id="brscrim"></div>

<!-- THE SOURCE PANE. One for the whole page: every tab that used to draw its
     own little code box now opens this. It has no backdrop on purpose — the
     reader goes on clicking rows and nodes underneath, and the pane follows
     them, the way an IDE preview does. The header, the gutter, the marked
     range and the "open in editor" control are all fed by /api/source, which
     answers the absolute path, the line range it cut and how long the file is:
     nothing here is re-derived in the browser. -->
<div class="srcpane hidden" id="srcpane" role="complementary">
  <button class="srcgrab" id="srcgrab" data-t-title="src.resize.title" title="drag to make this pane wider or narrower"></button>
  <div class="srchd" id="srchd"></div>
  <div class="srcbody" id="srcbody" tabindex="-1"></div>
  <div class="srcft hidden" id="srcft"></div>
</div>

<!-- The Graph tab's map renderers. Two vendored MIT browser bundles, served by
     the local server's /vendor route out of viewer/vendor — never a CDN: this
     page is read on a machine that may have no network, and a picture must not
     depend on somebody else's uptime. `three` (r183) is INSIDE the 3D bundle;
     loading a second copy would fight it. See viewer/vendor/README.md + NOTICE.
     Everything else on this page is still inline, in this one file. -->
<script src="/vendor/force-graph.min.js"></script>
<script src="/vendor/3d-force-graph.min.js"></script>
<!-- THE PAGE'S OWN CODE. One scope, in the order the numbers give it: 00 the
     vocabulary the page draws with and the state it holds, 10 the elements and
     the words every tab needs, 20 the one way to ask the server and the one way
     to say where the reader is, 30 the chrome around the tabs, 4x one tab each,
     90 the wiring that runs on load. They are CLASSIC scripts, not modules:
     they share one global scope exactly as the single inline script they were
     cut out of did, and the numbers are the load order that makes that safe.

     The first two are the engine's own modules — src/viewer/i18n.mjs and
     src/viewer/graphlayout.mjs — served by the local server minus their
     `export ` keywords. The page cannot import, and it used to carry a copy of
     each with a test to notice when the two drifted; now there is one file. -->
<script src="/viewer/lib/i18n.js"></script>
<script src="/viewer/lib/graphlayout.js"></script>
<script src="/viewer/js/00_state.js"></script>
<script src="/viewer/js/10_dom.js"></script>
<script src="/viewer/js/20_api.js"></script>
<script src="/viewer/js/30_chrome.js"></script>
<script src="/viewer/js/40_overview.js"></script>
<script src="/viewer/js/41_explore.js"></script>
<script src="/viewer/js/42_flow.js"></script>
<script src="/viewer/js/43_impact.js"></script>
<script src="/viewer/js/44_coupling.js"></script>
<script src="/viewer/js/45_graph.js"></script>
<script src="/viewer/js/46_erd.js"></script>
<script src="/viewer/js/47_transactions.js"></script>
<script src="/viewer/js/90_boot.js"></script>
</body>
