  }
  // READ / INSPECT. `basis` and `trust` are the engine's contract sections and
  // keep their field names; the masthead's title block already prints the
  // project, the digest, the lanes and the base commit beside the page.
  const folds=el('div',{className:'railfolds'},[
    fold(k+'.basis', ['basis'], ()=> [
      row('project', b.project),
      row('digest', b.buildDigest),
      row('built', b.builtAt ? String(b.builtAt).replace('T',' ').replace(/\..*$/,'') : null),
      row('freshness', (b.freshness&&b.freshness.verdict)||'unknown'),
    ].filter(Boolean)),
    fold(k+'.trust', ['trust'], ()=> [
      row('level', tt.trustLevel||'—'),
      row('axes', (tt.axes||[]).join(', ')||'—'),
      (tt.gatesNotShown||[]).length ? row('gates not shown', tt.gatesNotShown.join(', ')) : null,
    ].filter(Boolean)),
  ]);
  // THE GRADE LEGEND lives here now, in the header of the block that is about
  // what an answer rests on — which is where a reader asks what a grade means.
  // It was a fourth line of the masthead, above every tab, whether or not the
  // tab under it drew a graded thing.
  return el('div',{className:'rail'},[
    el('div',{className:'railhead'},[
      el('h2',{textContent:t('rail.rests')}),
      el('span',{className:'legend'},[t('legend.grade')+' ', ...GRADES.map(badge)]) ]),
    chips, ...bodies, folds ]);
}
// One limit: its scope chip, then a one-line lead cut from the engine's own
// reason, folding to that reason in full. A reason short enough to be its own
// lead is simply printed — a fold over nothing is a click that buys nothing.
function railLimit(key, l){
  const reason = l.reason || JSON.stringify(l);
  const scope = l.scope ? el('span',{className:'scope',textContent:l.scope+'  '}) : null;
  const lead = leadOf(reason);
  if(lead===reason) return el('div',{className:'raillim plain'}, [scope, reason].filter(Boolean));
  return el('div',{className:'raillim'},[
    fold(key, [scope, lead].filter(Boolean), ()=> [el('div',{className:'comment'},[reason])], null, true) ]);
}
// The engine's own word for "there is nothing here", as a sentence. Kept apart
// from the <li> below it so a ruled TABLE can print the same reason in a cell.
function emptyText(reasonMap, field) {
  const r = reasonMap && reasonMap[field];
  return r==='not-shipped' ? t('empty.notshipped')
    : r==='none' ? t('empty.none')
    : r==='not-in-this-axis' ? t('empty.notinaxis') : t('empty.none');
}
function emptyNote(reasonMap, field) {
  return el('li',{className:'empty', textContent:emptyText(reasonMap, field)});
}
// A ruled table: hairlines, no cards, every number in Mono. `heads` are
// {label, num} (num = right-aligned tabular figures).
function ruled(heads, rows){
  return el('table',{className:'ruled'},[
    el('thead',{},[ el('tr',{}, heads.map((h)=> el('th',{className:h.num?'num':'', textContent:h.label}))) ]),
    el('tbody',{}, rows) ]);
}
function listPanel(title, total, items, render, emptyReasons, emptyField) {
  const ul = el('ul',{className:'list'});
  if (!items.length) ul.append(emptyNote(emptyReasons, emptyField));
  else for (const it of items) ul.append(render(it));
  return el('div',{className:'panel'}, [el('h2',{}, [title+' ', el('span',{className:'count', textContent: total!=null?`(${total})`:''})]), ul]);
}

// ---------- the browse rail: Explore, Flow and Impact open on the pack -------
//
// A search box is a question you have to already know the answer to. These three
// tabs used to open on one, so the first screen of a project you had never seen
// was an empty input and a sentence telling you to type something. They now open
// on a LIST: the kinds this tab can show with their counts, a filter over the
// rows already on screen, a sort that puts the busiest first, and the rows
// themselves with the numbers you would pick by.
//
// THE PAGE COUNTS NOTHING. Every row, every count and every chip number is one
// `browse` answer (src/mcp/tools.mjs), kept in `RAIL[tab].resp` so a language
// switch re-draws the rail from memory and asks the server for nothing. Typing
// in the filter sends NO request either: it is a substring test over the rows
// already loaded. The one exception is `kind=symbol`, where the server refuses
// to list ten thousand methods and the filter IS the query it asks for.

const RAIL_PAGE = 200;        // the server's own page size, and the step `show more` takes
const RAIL_FILTER_MS = 120;   // the debounce on a filter that asks nothing
const RAIL_SYMBOL_MS = 250;   // ...and on the one kind whose filter is a server query
// The sorts each kind offers, MIRRORING src/mcp/tools.mjs BROWSE_SORTS. The page
// may not invent one: an unknown sort is a bad-input from the server.
const RAIL_SORTS = {
  table: ['statements', 'endpoints', 'groups', 'columns', 'name'],
  column: ['writes', 'reads', 'endpoints', 'name'],
  statement: ['tables', 'name'],
  endpoint: ['tables', 'statements', 'path'],
  symbol: ['name'],
  screen: ['endpoints', 'tables', 'name'],
};
const RAIL_IDFIELD = { table:'table', column:'column', statement:'statement', endpoint:'endpoint',
  symbol:'symbol', screen:'screen' };
// The catalogue keys, written out rather than built by concatenation: a key this
// page assembles at run time is a key test/i18n.test.mjs cannot check exists.
const RAIL_KIND_KEY = { table:'rail.kind.table', column:'rail.kind.column',
  statement:'rail.kind.statement', endpoint:'rail.kind.endpoint', symbol:'rail.kind.symbol',
  screen:'rail.kind.screen' };
const RAIL_SORT_KEY = { name:'rail.sort.name', path:'rail.sort.path', tables:'rail.sort.tables',
  statements:'rail.sort.statements', endpoints:'rail.sort.endpoints', groups:'rail.sort.groups',
  columns:'rail.sort.columns', reads:'rail.sort.reads', writes:'rail.sort.writes' };
// Impact is read for one question ("what would a change here break?"), so its
// table list opens on the tables the most endpoints reach, not the busiest SQL.
const RAIL_TAB_SORT = { impact: { table:'endpoints' } };
const RAILDEF = {
  explore: { kinds:['table','column','statement','endpoint','symbol','screen'], kind:'table',
    railId:'exrail', listId:'exlist', countId:'excount', moreId:'exmore', sortId:'exsort',
    chipsId:'exkinds', drawerId:'exdrawer', closeId:'exclose', inputId:'q', lead:'rail.lead.explore' },
  // Flow can be walked from either end of the round trip: the routes this pack
  // serves, or the screens that call them. The switch is remembered per
  // project, because which end you read from is a property of the project you
  // are reading, not of the browser.
  flow: { kinds:['endpoint','screen'], kind:'endpoint',
    railId:'flowrail', listId:'flist', countId:'fcount', moreId:'fmore', sortId:'fsort',
    chipsId:'fkinds', drawerId:'fdrawer', closeId:'fclose', inputId:'fentry', lead:'rail.lead.flow' },
  impact: { kinds:['table','statement','symbol'], kind:'table',
    railId:'impactrail', listId:'ilist', countId:'icount', moreId:'imore', sortId:'isort',
    chipsId:'ikinds', drawerId:'idrawer', closeId:'iclose', inputId:'ientry', lead:'rail.lead.impact' },
};
const RAILTABS = Object.keys(RAILDEF);
const RAIL = {};
for (const tab of RAILTABS) RAIL[tab] = railFresh(tab);
let RAILOPEN = null;   // which tab's drawer is over the content, under 1100px

function railFresh(tab){
  const d = RAILDEF[tab];
  return { kind:d.kind, sort:railDefaultSort(tab, d.kind), resp:null, counts:null,
    rows:[], hays:[], shown:[], rowEls:[], q:'', typed:'', cur:-1, sel:null, selKind:null,
    seq:0, timer:null, more:false, loading:false, needQuery:false, error:null,
    closedGroups:new Set(), openTables:new Set(), cols:new Map(),
    // One `browse` answer per kind this tab has already asked for, so going
    // back to a list costs nothing. `Show all` puts the rail on the kind the
    // tab OPENED on, and that must not put a request on the wire for a list
    // the reader has already been shown.
    byKind:new Map() };
}
function railDefaultSort(tab, kind){
  const per = RAIL_TAB_SORT[tab];
  return (per && per[kind]) || RAIL_SORTS[kind][0];
}
// WHICH END OF THE ROUND TRIP the Flow rail lists, remembered per project. A

const railId = (kind, row) => String(row[RAIL_IDFIELD[kind]]);

  if (kind === 'statement' || kind === 'symbol') return shortId(kind + ':' + railId(kind, row));

/** The text a filter matches: the id plus the row's own second line. */

  if (kind === 'column') return (row.column + ' ' + (row.comment || '')).toLowerCase();
  if (kind === 'statement') return (row.statement + ' ' + (row.file || '')).toLowerCase();
  if (kind === 'endpoint') return ((row.httpMethod || '') + ' ' + (row.path || '') + ' ' + (row.handlerShort || '')).toLowerCase();

// ---- asking, once per tab ---------------------------------------------------
async function railLoad(tab, append){
  const R = RAIL[tab];
  const args = { kind:R.kind, limit:RAIL_PAGE };
  if (R.sort) args.sort = R.sort;
  if (append) args.offset = R.rows.length;
  if (R.kind === 'symbol') {
    // The one kind the server will not list whole. Until two letters are typed
    // the rail says so instead of asking for ten thousand rows.
    const q = railTyped(tab);
    if (q.length < 2) { R.resp = null; R.rows = []; R.hays = []; R.more = false; R.needQuery = true; railRender(tab); return; }
    args.query = q;
  }
  R.needQuery = false;
  R.loading = true;
  const mine = ++R.seq;
  let r;
  try { r = await api('browse', args); }
  catch(e){ if (stale(e) || mine !== R.seq) return; R.loading = false; R.error = e; railRender(tab); return; }
  if (mine !== R.seq) return;
  R.loading = false; R.error = null; R.resp = r;
  const items = r.answer.items || [];
  R.rows = append ? R.rows.concat(items) : items.slice();
  R.hays = R.rows.map((row) => railHay(R.kind, row));
  R.counts = r.answer.counts || R.counts;
  R.more = ((r.truncated && r.truncated.fields) || []).some((f) => f.field === 'items' && f.nextOffset != null);
  railRender(tab);
  railIdle(tab);
}
/** A tab coming on screen: draw what is in memory, and ask ONCE if there is none. */

  // built before the page knows which project it is looking at, and the
  // preference belongs to the project.
  if (!R.resp && !R.loading) {
    const want = railRememberedKind(tab);
    if (want && want !== R.kind && RAILDEF[tab].kinds.includes(want)) {
      R.kind = want;
      R.sort = railDefaultSort(tab, want);
    }
  }
  railRender(tab);
  if (!R.resp && !R.loading && !R.needQuery) railLoad(tab, false);
  else railIdle(tab);
  railPaneApply(tab);
}
function railSetKind(tab, kind){
  const R = RAIL[tab];
  if (R.kind === kind) return;
  railStash(tab);
  railRememberKind(tab, kind);
  R.kind = kind;
  R.sort = railDefaultSort(tab, kind);
  R.sel = null; R.selKind = null; R.openTables.clear(); R.cols.clear(); R.closedGroups.clear();
  // A list this rail has already been shown is drawn again from memory. Only a
  // kind it has never asked for is a request.
  if (railUnstash(tab, kind)) { railRender(tab); railIdle(tab); return; }
  R.rows = []; R.hays = []; R.shown = []; R.resp = null; R.more = false;
  railLoad(tab, false);
}
/** Put the list on screen aside, under the kind it is a list of. */
function railStash(tab){
  const R = RAIL[tab];
  if (!R.resp && !R.needQuery) return;
  R.byKind.set(R.kind, { resp:R.resp, rows:R.rows, hays:R.hays, more:R.more,
    sort:R.sort, needQuery:R.needQuery });
}
/** Take one back. False when this rail has never asked for that kind. */
function railUnstash(tab, kind){
  const R = RAIL[tab];
  const kept = R.byKind.get(kind);
  if (!kept) return false;
  R.resp = kept.resp; R.rows = kept.rows; R.hays = kept.hays;
  R.more = kept.more; R.sort = kept.sort; R.needQuery = kept.needQuery;
  R.error = null; R.loading = false;
  return true;
}

// ---- drawing it -------------------------------------------------------------
function railRender(tab){
  railApplyFilter(tab);
  railRenderChips(tab);
  railRenderSort(tab);
  railRenderCount(tab);
  railRenderRows(tab);
  railRenderMore(tab);

}
/** The filter: a substring test over the rows already here. No request. */

  R.shown = q ? R.rows.filter((row, i) => R.hays[i].includes(q)) : R.rows.slice();
  // Flow reads by module, so its rows sit under the API group the SERVER put on
  // each of them. A stable sort by that label keeps the server's order inside
  // every group.
  if (tab === 'flow') {
    const order = [];
    for (const row of R.shown) if (!order.includes(row.group)) order.push(row.group);
    R.shown = R.shown.slice().sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));

function railRenderChips(tab){
  const D = RAILDEF[tab];

  const box = byId(D.chipsId);
  // FLOW'S SWITCH IS ONLY A SWITCH WHERE THERE IS SOMETHING TO SWITCH TO. On a
  // pack with no frontend the `Screens` half would list nothing for ever, so
  // the whole control stands down rather than offering a dead half. Read off
  // the answer's own kind census, never guessed.
  if (tab === 'flow') {
    // Not yet answered counts as "no": a control that appears and then vanishes
    // under the pointer is worse than one that arrives with its own numbers.
    const none = R.counts == null || !R.counts.screen;
    box.classList.toggle('hidden', none);
    if (none) { box.replaceChildren(); return; }
  }
  box.title = tab === 'flow' ? t('rail.flowkind.title') : '';
  box.replaceChildren(...D.kinds.map((k) => el('button', {
    className: k === R.kind ? 'on' : '',

    onclick: () => railSetKind(tab, k),

    t(RAIL_KIND_KEY[k]),

    // so a number beside them would promise a list this rail will not show.
    (k !== 'symbol' && R.counts && R.counts[k] != null)

/**
 * The masthead says `endpoints 978` on jeecg and this rail says `969`, and a

function railRowNodes(tab, kind, row, kids, child){

/** A stat chip: a LABEL, the number, and a title saying what it counts.

}
function railStats(kind, row){

// ---- the Impact tree: one table, its own columns, ONE request ---------------
async function railToggleTable(tab, id){
  const R = RAIL[tab];
  if (R.openTables.has(id)) { R.openTables.delete(id); railRenderRows(tab); return; }
  R.openTables.add(id);
  if (R.cols.has(id)) { railRenderRows(tab); return; }   // asked once, kept
  R.cols.set(id, null);                                  // null means "on its way"
  railRenderRows(tab);
  try {
    const r = await api('browse', { kind:'column', table:id, limit:RAIL_PAGE });
    R.cols.set(id, r.answer.items || []);
  } catch(e){
    if (stale(e)) { R.cols.delete(id); return; }
    R.cols.set(id, []);
  }
  railRenderRows(tab);
}
function railChildren(tab, id){
  const R = RAIL[tab], cols = R.cols.get(id);
  if (cols == null) return el('div', { className:'brchildren' }, [el('div', { className:'empty', textContent:t('rail.tree.loading') })]);
  if (!cols.length) return el('div', { className:'brchildren' }, [el('div', { className:'empty', textContent:t('empty.none') })]);
  const kids = [];
  for (const c of cols) railRowNodes(tab, 'column', c, kids, true);
  return el('div', { className:'brchildren' }, kids);
}

// ---- picking ----------------------------------------------------------------
// The existing renderers take over from here, unchanged: this only says WHICH
// one and with what.
function railPick(tab, kind, row){
  const R = RAIL[tab], id = railId(kind, row);
  R.sel = id; R.selKind = kind;
  railCloseDrawer(tab);
  railMarkSel(tab);
  if (tab === 'explore') {
    if (kind === 'screen') { showScreen(id); return; }
    if (kind === 'statement' || kind === 'symbol') {
      // A statement or a method IS its source, so picking one IS the request
      // for the pane. The pane and the pick are ONE history entry: the URL
      // carries both.
      srcOpen(kind + ':' + id, { tab:'explore', push:false });
      pickSet('explore', kind + ':' + id);
      return;
    }
    if (kind === 'table') showTable(id); else showColumn(id);
    // A pane already open follows the pick; a closed one stays closed.
    if (srcIsOpen()) srcOpen(kind + ':' + id, { tab:'explore', push:false });
    return;
  }
  if (tab === 'flow') { openFlow(kind === 'screen' ? { screen:id } : { endpoint:id }); return; }
  const arg = {};
  arg[kind] = id;
  openImpact(arg);
}
/** Re-mark the picked row without re-rendering the list under the reader. */
function railMarkSel(tab){
  const R = RAIL[tab];

    const on = R.sel === railId(x.kind, x.row) && R.selKind === x.kind;
    x.el.classList.toggle('on', on);
    x.el.setAttribute('aria-selected', on ? 'true' : 'false');
  }
}

// ---- the keyboard -----------------------------------------------------------
function railSetCur(tab, i){
  const R = RAIL[tab];
  R.cur = i;
  R.rowEls.forEach((x, k) => x.el.classList.toggle('cur', k === i));
}
/**
 * Move the highlight and scroll it into view. `takeFocus` is true when the move

 * it came from the FILTER BOX, where stealing the focus would stop the reader
 * typing the next letter.

  const R = RAIL[tab], n = R.rowEls.length;
  if (!n) return;
  const next = R.cur < 0 ? (d > 0 ? 0 : n - 1) : (R.cur + d + n) % n;

const RAIL_PANE_PASSES = 3;

  const box = byId(RAILDEF[tab].railId);

  const vw = (typeof window !== 'undefined' && window.innerWidth) || 1400;
  const vh = (typeof window !== 'undefined' && window.innerHeight) || 900;
  // As a DRAWER it is floor to ceiling and owns its own height; releasing the
  // measured one here is what lets the stylesheet do that.
  if (vw <= 1100) { box.style.height = ''; return null; }

  const input=byId(v.entryId);
  input.addEventListener('keydown', e=>{
    const box=byId(v.sugId), open=!box.classList.contains('hidden');
    // The dropdown owns the arrows while it is up. Closed, they belong to the
    // rail beside the picture.
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(open){ e.preventDefault(); chainSugMove(v, e.key==='ArrowDown'?1:-1); }
      else { e.preventDefault(); railMove(v.name, e.key==='ArrowDown'?1:-1); }
      return;
    }
    if(e.key!=='Enter') return;
    chainCommit(v);
  });
  // ONE box, two jobs: it still resolves what you type through the typeahead,
  // and it filters the rail from the rows already loaded, asking nothing.
  input.addEventListener('input', ()=>{ v.pick=null; clearTimeout(v.sugTimer); v.sugTimer=setTimeout(()=>chainSuggest(v, input.value.trim()),150);
    railFilterInput(v.name); });
  input.addEventListener('focus', ()=>{ if(!input.value.trim()) chainSuggest(v, ''); });
  byId(v.modeId).onchange = ()=>drawChain(v);
  byId(v.depthId).onchange = ()=>drawChain(v);
  // lanes | layers — two renderings of the SAME answer: no re-query on toggle.
  document.querySelectorAll('#'+v.segId+' button').forEach(b=> b.onclick=()=>{
    if(v.view===b.dataset.view) return;
    v.view=b.dataset.view;
    document.querySelectorAll('#'+v.segId+' button').forEach(x=> x.classList.toggle('on', x===b));
    if(v.resp) renderChain(v, v.resp);
  });
  vwrap(v).addEventListener('mouseleave', ()=>flowClearHover(v));
  document.addEventListener('click', (ev)=>{ if(!ev.target.closest('#'+v.sugId) && ev.target.id!==v.entryId) closeSug(v); });
}
// ---------- graph maths, shared with src/viewer/graphlayout.mjs ----------
// The page is ONE self-contained file served out of memory, so it cannot import
// from src/. The block below is therefore a VERBATIM copy of
// src/viewer/graphlayout.mjs (minus the `export ` keywords), and
// test/graphlayout.test.mjs fails if the two ever drift. Edit the module, then
// copy it here — never one without the other.
// --- graphlayout (verbatim copy of src/viewer/graphlayout.mjs) ---

/**
 * BFS hop distance from `focus`, walking edges the way the ANSWER walked them.
 * `direction` is the neighborhood tool's own: 'down' follows the arrow
 * (from → to), 'up' walks against it (to → from), 'both' (the default) ignores
 * direction entirely. This matters because the tool returns every edge BETWEEN
 * the nodes it collected, not only the ones it walked: in an `up` answer a
 * downward edge is a shortcut that would put a node three steps up on ring 1.
 *
 * A node the edges never reach gets no entry — the caller decides what to do
 * with it (the Graph tab parks those on one outer ring, labelled `unreached`,
 * rather than pretending they are at hop 0 or at some hop it did not measure).
 * @param {string} focus
 * @param {{from:string,to:string}[]} edges
 * @param {'up'|'down'|'both'} [direction='both']
 * @returns {Map<string,number>} node id -> hop
 */
function hopsFrom(focus, edges, direction = 'both') {
  const adj = new Map();
  const add = (a, b) => { let s = adj.get(a); if (!s) adj.set(a, s = new Set()); s.add(b); };
  const down = direction !== 'up', up = direction !== 'down';
  for (const e of edges || []) { if (down) add(e.from, e.to); if (up) add(e.to, e.from); }
  const hop = new Map([[focus, 0]]);
  let frontier = [focus];
  for (let h = 1; frontier.length; h++) {
    const next = [];
    for (const id of frontier) for (const nb of adj.get(id) || []) {
      if (hop.has(nb)) continue;
      hop.set(nb, h);
      next.push(nb);
    }
    frontier = next;
  }
  return hop;
}

/**
 * Where each hop ring sits. Ring h is at least `step` further out than ring
 * h-1, at least h*step from the centre, and — this is the part that keeps the
 * picture readable — far enough out that its own nodes fit AROUND it: a ring
 * holding 90 nodes needs a circumference of 90 node-widths, whatever its hop.
 *
 * Then one evening pass. A crowded outer ring can leave the inner ones packed
 * into a dot at the middle with a wide empty moat around them (hop 1 with 23
 * nodes at r=130, hop 2 with 102 at r=536); spreading the rings across the
 * radius the picture ALREADY takes costs nothing and gives the inner rings the
 * room. It can only push a ring outward, so the fit and the ordering hold.
 * @param {Map<number,number>} counts  hop -> how many nodes sit on it
 * @param {{step?:number, gap?:number, nodeR?:number}} opts
 * @returns {{hop:number,count:number,radius:number}[]} ordered by hop
 */
function ringPlan(counts, opts = {}) {
  const step = opts.step ?? 120;
  const gap = opts.gap ?? 14;
  const nodeR = opts.nodeR ?? 7;
  const hops = [...counts.keys()].sort((a, b) => a - b);
  const out = [];
  let prev = null;
  for (const h of hops) {
    const count = counts.get(h) || 0;
    if (h === 0) { out.push({ hop: 0, count, radius: 0 }); prev = 0; continue; }
    const need = count > 1 ? (count * (nodeR * 2 + gap)) / (2 * Math.PI) : 0;
    const floor = prev == null ? h * step : prev + step;
    const radius = Math.max(floor, h * step, need);
    out.push({ hop: h, count, radius });
    prev = radius;
  }
  const outer = out.length ? out[out.length - 1] : null;
  if (outer && outer.hop > 0) {
    for (const r of out) if (r.hop > 0) r.radius = Math.max(r.radius, (r.hop / outer.hop) * outer.radius);
  }
  return out;
}

/**
 * Lay `ids` out on their hop rings: even angular spacing within a ring, each
 * ring rotated by the golden angle so the spokes of neighbouring rings do not
 * line up into radial corridors. Deterministic — same input, same picture.
 * @param {string[]} ids  in the order they should appear around each ring
 * @param {(id:string)=>number} hopOf
 * @param {{cx?:number, cy?:number, step?:number, gap?:number, nodeR?:number}} opts
 * @returns {{plan:{hop:number,count:number,radius:number}[],
 *            nodes:{id:string,hop:number,angle:number,radius:number,x:number,y:number}[]}}
 */
function ringLayout(ids, hopOf, opts = {}) {
  const cx = opts.cx ?? 0, cy = opts.cy ?? 0;
  const counts = new Map();
  for (const id of ids) { const h = hopOf(id); counts.set(h, (counts.get(h) || 0) + 1); }
  const plan = ringPlan(counts, opts);
  const radiusOf = new Map(plan.map((p) => [p.hop, p.radius]));
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const seen = new Map();
  const nodes = ids.map((id) => {
    const hop = hopOf(id);
    const i = seen.get(hop) || 0;
    seen.set(hop, i + 1);
    const n = counts.get(hop) || 1;
    const radius = radiusOf.get(hop) || 0;
    const angle = radius === 0 ? 0 : GOLDEN * hop + (i * 2 * Math.PI) / n;
    return { id, hop, angle, radius, x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
  });
  return { plan, nodes };
}

/**
 * What a ring is CALLED. Every ring but one is a measured hop. The exception is
 * the ring the caller parks nodes on that its BFS never reached: that ring is
 * not a distance the picture measured, so it says `unreached` instead of
 * claiming a hop one further out than the last real one.
 * @param {number} hop
 * @param {number|null} count  how many nodes sit on it (omitted from the label when null)
 * @param {number|null} [unreachedHop]  the parking ring's hop, if the caller made one
 * @returns {string}
 */
function hopRingLabel(hop, count, unreachedHop = null) {
  const head = (unreachedHop != null && hop === unreachedHop) ? 'unreached' : 'hop ' + hop;
  return count == null ? head : head + '  (' + count + ')';
}

/**
 * The leading token of a snake_case name — "pms_product" -> "pms". null when
 * the name carries no underscore: there is nothing to group by, and a caller
 * that gets null everywhere should say so rather than invent families.
 * @param {string} name
 * @returns {string|null}
 */
function nameFamily(name) {
  const s = String(name ?? '');
  const i = s.indexOf('_');
  return i > 0 ? s.slice(0, i) : null;
}

/**
 * The families present in `names`, biggest first (ties alphabetically). Names
 * with no family are counted together under `family:null` and always come last.
 * @param {string[]} names
 * @returns {{family:string|null,count:number}[]}
 */
function familyCounts(names) {
  const m = new Map();
  for (const n of names || []) { const f = nameFamily(n); m.set(f, (m.get(f) || 0) + 1); }
  const rows = [...m.entries()].map(([family, count]) => ({ family, count }));
  rows.sort((a, b) => {
    if ((a.family === null) !== (b.family === null)) return a.family === null ? 1 : -1;
    if (a.count !== b.count) return b.count - a.count;
    return String(a.family) < String(b.family) ? -1 : String(a.family) > String(b.family) ? 1 : 0;
  });
  return rows;
}

/**
 * Assign each family a colour from a palette the page ALREADY has — this is
 * presentation derived from names, so it borrows existing tokens rather than
 * inventing a new scale. Biggest family takes the first colour; if there are
 * more families than colours the palette repeats (and the legend, which lists
 * the names, is what disambiguates).
 * @param {(string|null)[]} families  in priority order
 * @param {string[]} palette
 * @returns {Map<string|null,string>}
 */
function familyPalette(families, palette) {
  const out = new Map();
  if (!palette || !palette.length) return out;
  let i = 0;
  for (const f of families || []) { out.set(f, palette[i % palette.length]); i++; }
  return out;
}

/**
 * How thick an edge witnessed by `count` statements is drawn: `min` at one
 * witness, `max` at `top`, linear between. One witness and ten witnesses are
 * not the same claim, and the picture should not say they are.
 * @param {number} count
 * @param {number} top  the most witnesses any edge in this picture has
 * @returns {number}
 */
function witnessWidth(count, top, min = 1, max = 3) {
  const n = Number(count) || 0;
  if (!(top > 1)) return min;
  const t = Math.max(0, Math.min(1, (n - 1) / (top - 1)));
  return min + (max - min) * t;
}

/**
 * The connected components of an undirected graph, over the edges the picture
 * actually DRAWS. A node no drawn edge touches is its own one-member component
 * — that is a fact about the drawing, not a claim that the table is unrelated.
 *
 * Deterministic: components come out in the order their first member appears in
 * `ids`, and each component's members keep that same order. Ids repeated in the
 * input are visited once; an edge naming an unknown id is ignored.
 * @param {string[]} ids
 * @param {{from:string,to:string}[]} edges
 * @returns {string[][]}
 */
function connectedComponents(ids, edges) {
  const rank = new Map();
  const list = [];
  for (const id of ids || []) if (!rank.has(id)) { rank.set(id, rank.size); list.push(id); }
  const adj = new Map(list.map((id) => [id, []]));
  for (const e of edges || []) {
    if (!adj.has(e.from) || !adj.has(e.to) || e.from === e.to) continue;
    adj.get(e.from).push(e.to);
    adj.get(e.to).push(e.from);
  }
  const seen = new Set();
  const out = [];
  for (const id of list) {
    if (seen.has(id)) continue;
    seen.add(id);
    const comp = [id];
    for (let i = 0; i < comp.length; i++) {
      for (const nb of adj.get(comp[i])) if (!seen.has(nb)) { seen.add(nb); comp.push(nb); }
    }
    comp.sort((a, b) => rank.get(a) - rank.get(b));
    out.push(comp);
  }
  return out;
}

/**
 * Shelf packing: lay boxes out in rows, biggest area first, wrapping when a row
 * passes a target width. sqrt(total area x aspect) is the first guess at that
 * width; a handful of scalings of it are tried and the one whose finished block
 * comes closest to `aspect` wins, because with a dozen lumpy boxes the first
 * guess can miss badly (a 1.27-wide block in a 1.61-wide pane wastes a third of
 * the room). No candidate is ever narrower than the widest box.
 *
 * WHY THIS EXISTS. A force settle that repels every node from every other one
 * pushes disconnected clusters hundreds of pixels apart, and the picture then
 * fits on screen only at a scale where the tables are dots. Settling each
 * cluster on its own and then packing the results puts the clusters shoulder to
 * shoulder, so the fit is set by how big the clusters really are.
 *
 * The gap between neighbours is `gap` plus the larger of the two boxes' node
 * radii: a box's bounding box is measured to its node CENTRES' extremes plus
 * radius already, and the extra keeps a fat hub on one edge from touching its
 * neighbour. Deterministic given the input order (ties in area break by index).
 *
 * A missing (undefined/null) box size or radius means 0. A NON-FINITE one — or a
 * non-finite `aspect` or `gap` — is a bug in the caller, not a layout: every
 * candidate then scores Infinity, no candidate can beat the first, and what came
 * back used to be `null` for the caller to dereference. It throws a RangeError
 * naming the field instead.
 * @param {{key?:any,w:number,h:number,maxR?:number}[]} boxes
 * @param {{aspect?:number, gap?:number}} opts
 * @throws {RangeError} on a non-finite box w/h/maxR, aspect or gap
 * @returns {{placed:{key:any,x:number,y:number,w:number,h:number}[], width:number, height:number}}
 */
function shelfPack(boxes, opts = {}) {
  const finite = (v, what) => {
    if (v === undefined || v === null) return 0;
    const n = Number(v);
    if (!Number.isFinite(n)) throw new RangeError(`shelfPack: ${what} must be a finite number, got ${v}`);
    return n > 0 ? n : 0;
  };
  if (opts.aspect !== undefined && opts.aspect !== null && !Number.isFinite(Number(opts.aspect)))
    throw new RangeError(`shelfPack: aspect must be a finite number, got ${opts.aspect}`);
  if (opts.gap !== undefined && opts.gap !== null && !Number.isFinite(Number(opts.gap)))
    throw new RangeError(`shelfPack: gap must be a finite number, got ${opts.gap}`);
  const aspect = opts.aspect > 0 ? opts.aspect : 1;
  const gap = opts.gap ?? 24;
  const items = (boxes || []).map((b, i) => ({
    i,
    key: b.key === undefined ? i : b.key,
    w: finite(b.w, `box ${i} width`),
    h: finite(b.h, `box ${i} height`),
    maxR: finite(b.maxR, `box ${i} maxR`),
  }));
  if (!items.length) return { placed: [], width: 0, height: 0 };
  let area = 0, widest = 0;
  for (const it of items) { area += (it.w + gap) * (it.h + gap); widest = Math.max(widest, it.w); }
  const order = items.slice().sort((a, b) => (b.w * b.h) - (a.w * a.h) || a.i - b.i);
  const rowsFor = (target) => {
    const rows = [];
    let row = [], rowW = 0;
    for (const it of order) {
      const step = row.length ? gap + Math.max(row[row.length - 1].maxR, it.maxR) : 0;
      if (row.length && rowW + step + it.w > target) { rows.push(row); row = []; rowW = 0; }
      const s = row.length ? gap + Math.max(row[row.length - 1].maxR, it.maxR) : 0;
      it.rx = rowW + s;
      rowW = it.rx + it.w;
      row.push(it);
    }
    if (row.length) rows.push(row);
    const placed = [];
    let y = 0, width = 0, prevMaxR = 0;
    for (let ri = 0; ri < rows.length; ri++) {
      let rowH = 0, rowMaxR = 0, rowW2 = 0;
      for (const it of rows[ri]) { rowH = Math.max(rowH, it.h); rowMaxR = Math.max(rowMaxR, it.maxR); rowW2 = Math.max(rowW2, it.rx + it.w); }
      if (ri > 0) y += gap + Math.max(prevMaxR, rowMaxR);
      for (const it of rows[ri]) placed.push({ key: it.key, x: it.rx, y, w: it.w, h: it.h });
      y += rowH;
      prevMaxR = rowMaxR;
      width = Math.max(width, rowW2);
    }
    return { placed, width, height: y };
  };
  const guess = Math.sqrt(area * aspect);
  let best = null, bestScore = Infinity;
  for (let f = 5; f <= 20; f++) {
    const got = rowsFor(Math.max(widest, guess * (f / 10)));
    const got2 = got.height > 0 ? got.width / got.height : aspect;
    const score = Math.abs(Math.log(got2 / aspect));
    if (score < bestScore - 1e-9) { bestScore = score; best = got; }
  }
  return best;
}

/**
 * A seeded stream of pseudo-random numbers in [0,1) — a 32-bit linear
 * congruential generator with Numerical Recipes' constants.
 *
 * WHY NOT Math.random. The ERD layout used it, so the same pack drew a
 * different picture on every load: a reader who learned where the order tables
 * sit had to find them again after a refresh, and no two screenshots of the
 * same schema could be compared. The randomness is only ever used to break
 * symmetry (which way two coincident nodes part, in what order the community
 * pass visits nodes), and a fixed stream breaks symmetry just as well while
 * making the layout a FUNCTION of the pack.
 * @param {number} seed
 * @returns {() => number}
 */
function seededRandom(seed) {
  let s = (Number(seed) >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

/**
 * The ERD's layout: settle each connected component on its own, then pack the
 * settled clusters shoulder to shoulder, then separate whatever still overlaps.
 * Nodes in, positions out — no DOM, no animation, no `Math.random`.
 *
 * WHY PER COMPONENT. Repulsion that reaches across a component pushes two
 * clusters sharing no edge hundreds of pixels apart, and the picture then fits
 * on screen only at a scale where a table is a dot. Nothing repels across a
 * component here; `shelfPack` decides where the finished clusters go, so the
 * fit is set by how big the clusters really are.
 *
 * WHAT EACH PHASE DOES.
 *  - seed:    every component's members on a sunflower spiral inside a disc,
 *             the discs packed, so the settle starts spread out instead of with
 *             every cluster piled on the same middle.
 *  - communities: label propagation, so the settle can push clusters WITHIN a
 *             component apart and hold each one together.
 *  - settle:  `iterations` steps of 1/d repulsion (boosted between communities),
 *             springs whose rest length grows with the node radii, a light pull
 *             to each community's centroid, a capped velocity and two collision
 *             sweeps a step.
 *  - pack:    each settled component measured and placed by `shelfPack` into a
 *             block the shape of the pane. A component holding a PINNED node is
 *             anchored on it: it keeps its place and leaves its slot empty,
 *             because the only translation that leaves a pinned node where the
 *             caller put it is none at all.
 *  - relax:   collision sweeps until no two circles overlap. If a round cannot
 *             clear a compressed hub-spoke pile, every free node is inflated
 *             outward from the centroid (a pure zoom — structure preserved) and
 *             the round runs again.
 *
 * A node given `pinned:true` comes out at exactly the `x`/`y` it went in with:
 * no phase moves it, and two pinned nodes inside the gap are a picture the
 * caller built, which no sweep may take apart.
 * @param {{id:string, r?:number, x?:number, y?:number, pinned?:boolean}[]} nodes
 * @param {{from:string,to:string}[]} links
 * @param {{width?:number, height?:number, gap?:number, seed?:number, iterations?:number,
 *          pack?:boolean, relaxAttempts?:number, relaxSweeps?:number}} opts
 * @returns {{nodes:{id:string,x:number,y:number,r:number,comp:number,comm:number}[],
 *            components:string[][]}}
 */
function settleComponents(nodes, links, opts = {}) {
  const W = opts.width > 0 ? opts.width : 900;
  const H = opts.height > 0 ? opts.height : 620;
  const GAP = opts.gap ?? 16;
  const steps = opts.iterations ?? 194;   // alpha 1 → 0.02 at the old 0.98 decay
  const attempts = opts.relaxAttempts ?? 7;
  const sweeps = opts.relaxSweeps ?? 250;
  const rnd = seededRandom(opts.seed ?? 1);

  const idx = new Map();
  const list = [];
  for (const n of nodes || []) {
    if (!n || idx.has(n.id)) continue;
    const m = {
      id: n.id, r: Number(n.r) || 0, pinned: !!n.pinned,
      x: Number.isFinite(n.x) ? Number(n.x) : 0, y: Number.isFinite(n.y) ? Number(n.y) : 0,
      vx: 0, vy: 0, comp: 0, comm: 0,
    };
    idx.set(m.id, m); list.push(m);
  }
  const components = connectedComponents(list.map((n) => n.id), links);
  components.forEach((c, ci) => { for (const id of c) idx.get(id).comp = ci; });
  const compNodes = components.map((c) => c.map((id) => idx.get(id)));
  const edges = [];
  for (const l of links || []) {
    const s = idx.get(l.from), t = idx.get(l.to);
    if (s && t && s !== t) edges.push({ s, t });
  }
  const result = () => ({
    nodes: list.map((n) => ({ id: n.id, x: n.x, y: n.y, r: n.r, comp: n.comp, comm: n.comm })),
    components,
  });
  if (!list.length) return result();

  // --- where a component starts ---------------------------------------------
  const seed = () => {
    const boxes = compNodes.map((cn, ci) => {
      const R = Math.max(24, Math.sqrt(cn.length) * 36);
      let mr = 0; for (const n of cn) if (n.r > mr) mr = n.r;
      return { key: ci, w: 2 * R, h: 2 * R, maxR: mr };
    });
    for (const slot of shelfPack(boxes, { aspect: W / H, gap: GAP + 8 }).placed) {
      const cn = compNodes[slot.key], R = slot.w / 2, ox = slot.x + R, oy = slot.y + R;
      cn.forEach((n, i) => {
        if (n.pinned) return;
        const ang = 2.399963229728653 * i, rr = R * Math.sqrt((i + 0.5) / cn.length);
        n.x = ox + rr * Math.cos(ang); n.y = oy + rr * Math.sin(ang); n.vx = 0; n.vy = 0;
      });
    }
  };

  // --- communities (label propagation) --------------------------------------
  // A cheap, dependency-free clustering INSIDE a component, so the settle can
  // give each cluster its own room and still hold it together. The visiting
  // order is shuffled by the seeded stream, never by Math.random.
  const adj = new Map(list.map((n) => [n.id, []]));
  for (const e of edges) { adj.get(e.s.id).push(e.t.id); adj.get(e.t.id).push(e.s.id); }
  let nComm = 1;
  const communities = () => {
    const lab = new Map(list.map((n) => [n.id, n.id]));
    const order = list.map((n) => n.id);
    for (let it = 0; it < 12; it++) {
      for (let i = order.length - 1; i > 0; i--) {
        const j = (rnd() * (i + 1)) | 0;
        const t = order[i]; order[i] = order[j]; order[j] = t;
      }
      let moved = false;
      for (const id of order) {
        const cnt = new Map();
        for (const nb of adj.get(id)) { if (nb === id) continue; const l = lab.get(nb); cnt.set(l, (cnt.get(l) || 0) + 1); }
        if (!cnt.size) continue;
        let best = lab.get(id), bc = -1;
        for (const [l, c] of cnt) { if (c > bc || (c === bc && l < best)) { best = l; bc = c; } }
        if (lab.get(id) !== best) { lab.set(id, best); moved = true; }
      }
      if (!moved) break;
    }
    const uniq = [...new Set(list.map((n) => lab.get(n.id)))];
    const ci = new Map(uniq.map((c, i) => [c, i]));
    for (const n of list) n.comm = ci.get(lab.get(n.id));
    nComm = uniq.length;
  };

  // --- collision ------------------------------------------------------------
  // One Gauss-Seidel sweep (corrections applied in place, so chains resolve over
  // a few sweeps), over a uniform grid whose cell is the largest separation two
  // nodes can ask for: each node only ever looks at the 9 cells around it, so a
  // sweep is O(n) rather than O(n²) and a 400-table schema settles in the time
  // a 25-table one used to. Returns the worst overlap depth it saw.
  const fixed = (n) => n.pinned;
  let cell = 1;
  const measureCell = () => { let mr = 0; for (const n of list) if (n.r > mr) mr = n.r; cell = Math.max(1, 2 * mr + GAP + 1); };
  const push = (a, b, i, j) => {
    let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    // Two nodes at the very same point have no direction to part along, so one
    // is derived from the pair's own indices: the same picture every run.
    if (d < 0.01) { dx = ((i % 5) - 2) || 1; dy = ((j % 5) - 2) || 1; d = Math.hypot(dx, dy) || 1; }
    const min = a.r + b.r + GAP;
    if (d >= min) return 0;
    const ov = min - d;
    const fa = fixed(a), fb = fixed(b);
    // Two PINNED nodes closer than the gap is a picture the caller built, and no
    // sweep may take it apart: neither may move, so the overlap survives every
    // pass and must not be reported as "the relax failed" — that is what used to
    // inflate the whole picture x17 chasing something it could never fix.
    if (fa && fb) return 0;
    const p = ov / d, wa = fa ? 0 : (fb ? 1 : 0.5), wb = fb ? 0 : (fa ? 1 : 0.5);
    a.x -= dx * p * wa; a.y -= dy * p * wa;
    b.x += dx * p * wb; b.y += dy * p * wb;
    return ov;
  };
  const collideSweep = () => {
    const grid = new Map();
    for (let i = 0; i < list.length; i++) {
      const n = list[i], k = Math.floor(n.x / cell) + ':' + Math.floor(n.y / cell);
      const b = grid.get(k); if (b) b.push(i); else grid.set(k, [i]);
    }
    let worst = 0;
    for (let i = 0; i < list.length; i++) {
      const a = list[i], gx = Math.floor(a.x / cell), gy = Math.floor(a.y / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const bucket = grid.get((gx + dx) + ':' + (gy + dy));
        if (!bucket) continue;
        for (const j of bucket) { if (j <= i) continue; const ov = push(a, list[j], i, j); if (ov > worst) worst = ov; }
      }
    }
    return worst;
  };
  // The grid is built from the positions a sweep STARTED at, so a node that
  // moves far during one can be missed. This is the exact answer — every pair,
  // no corrections — and it is what the relax loop believes.
  const worstOverlap = () => {
    let worst = 0;
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      if (fixed(a) && fixed(b)) continue;
      const ov = a.r + b.r + GAP - Math.hypot(b.x - a.x, b.y - a.y);
      if (ov > worst) worst = ov;
    }
    return worst;
  };

  // --- one settle step ------------------------------------------------------
  const center = compNodes.map((cn) => Math.min(0.02, 0.0006 + 6 / (cn.length * cn.length)));
  const step = () => {
    // pairwise repulsion, O(n²) WITHIN a component. 1/d falloff (long-range, à la
    // Fruchterman-Reingold) so nodes spread into open space instead of piling in
    // the middle; boosted between communities, softened inside one.
    for (const cn of compNodes)
      for (let i = 0; i < cn.length; i++) for (let j = i + 1; j < cn.length; j++) {
        const a = cn[i], b = cn[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1, dd = d < 24 ? 24 : d;
        const rep = (a.comm === b.comm ? 230 : 470) * (1 + (a.r + b.r) / 26) / dd;
        const fx = dx / d * rep, fy = dy / d * rep;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      }
    // springs — rest length grows with node size, so big hubs don't crush neighbours.
    for (const e of edges) {
      const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const k = (d - (72 + e.s.r + e.t.r)) * 0.04, fx = dx / d * k, fy = dy / d * k;
      e.s.vx += fx; e.s.vy += fy; e.t.vx -= fx; e.t.vy -= fy;
    }
    // community cohesion — a light pull toward each node's cluster centroid.
    if (nComm > 1) {
      const sx = new Float64Array(nComm), sy = new Float64Array(nComm), sn = new Float64Array(nComm);
      for (const n of list) { sx[n.comm] += n.x; sy[n.comm] += n.y; sn[n.comm]++; }
      for (let c = 0; c < nComm; c++) if (sn[c]) { sx[c] /= sn[c]; sy[c] /= sn[c]; }
      for (const n of list) { if (n.pinned) continue; n.vx += (sx[n.comm] - n.x) * 0.005; n.vy += (sy[n.comm] - n.y) * 0.005; }
    }
    // integrate + weak centering, each node toward ITS OWN component's centroid.
    // Velocity is capped per step (a Fruchterman-Reingold "temperature") so a node
    // overlapping many others cannot accumulate a huge push and fling itself off.
    const kx = new Float64Array(compNodes.length), ky = new Float64Array(compNodes.length);
    for (let c = 0; c < compNodes.length; c++) {
      const cn = compNodes[c];
      let mx = 0, my = 0;
      for (const n of cn) { mx += n.x; my += n.y; }
      kx[c] = mx / cn.length; ky[c] = my / cn.length;
    }
    for (const n of list) {
      if (n.pinned) { n.vx = 0; n.vy = 0; continue; }
      const c = center[n.comp];
      n.vx += (kx[n.comp] - n.x) * c; n.vy += (ky[n.comp] - n.y) * c;
      n.vx *= 0.9; n.vy *= 0.9;
      const sp = Math.hypot(n.vx, n.vy);
      if (sp > 26) { const s = 26 / sp; n.vx *= s; n.vy *= s; }
      n.x += n.vx; n.y += n.vy;
    }
    collideSweep(); collideSweep();
  };

  // --- pack the settled components ------------------------------------------
  const packAll = () => {
    if (components.length < 2) return;
    const boxes = compNodes.map((cn, ci) => {
      let a1 = Infinity, b1 = Infinity, a2 = -Infinity, b2 = -Infinity, mr = 0;
      for (const n of cn) {
        if (n.x - n.r < a1) a1 = n.x - n.r; if (n.y - n.r < b1) b1 = n.y - n.r;
        if (n.x + n.r > a2) a2 = n.x + n.r; if (n.y + n.r > b2) b2 = n.y + n.r;
        if (n.r > mr) mr = n.r;
      }
      return { key: ci, w: a2 - a1, h: b2 - b1, maxR: mr, x0: a1, y0: b1 };
    });
    for (const slot of shelfPack(boxes, { aspect: W / H, gap: 24 }).placed) {
      const cn = compNodes[slot.key];
      if (cn.some((n) => n.pinned)) continue;
      const b = boxes[slot.key], dx = slot.x - b.x0, dy = slot.y - b.y0;
      for (const n of cn) { n.x += dx; n.y += dy; n.vx = 0; n.vy = 0; }
    }
  };

  seed();
  communities();
  measureCell();
  for (let i = 0; i < steps; i++) step();
  if (opts.pack !== false) packAll();
  for (let attempt = 0; attempt < attempts; attempt++) {
    for (let p = 0; p < sweeps; p++) if (collideSweep() < 0.5) break;
    if (worstOverlap() < 0.5) break;
    let mx = 0, my = 0, k = 0;
    for (const n of list) if (!n.pinned) { mx += n.x; my += n.y; k++; }
    if (!k) break;
    mx /= k; my /= k;
    for (const n of list) if (!n.pinned) { n.x = mx + (n.x - mx) * 1.5; n.y = my + (n.y - my) * 1.5; }
  }
  return result();
}

// --- end graphlayout ---

// ---------- the shared canvas machinery ----------
// Both graph pictures on this page — the ERD's whole schema and the Graph tab's
// `Around <node>` hop rings — are drawn by the SAME vendored canvas renderer the
// map uses (viewer/vendor/force-graph.min.js). One renderer for three pictures:
// a fix to the panning, the hit-testing or the tooltip fixes all three, and a
// schema of thousands of tables becomes one canvas the browser composites
// instead of thousands of SVG elements it must lay out and hit-test.
//
// The LAYOUT, though, is OURS. The library's own d3 forces repel every node from
// every other one, which pushes clusters that share no edge hundreds of pixels
// apart — the exact drift this page fixed by settling each component on its own
// and packing the results. So every position is computed up front by the pure
// helpers above (settleComponents for the ERD, ringLayout for the rings) and
// handed over as FIXED coordinates: fx/fy on every node, cooldownTicks(0) and
// d3AlphaDecay(1) so not one simulation tick ever runs. The library renders,
// pans, zooms, hit-tests and drags; it never decides where anything goes. That
// also makes the picture STILL when nothing is happening — no rAF loop, no
// physics warming up under a reader trying to read a name.
const gfHas2D=()=> typeof window.ForceGraph!=='undefined';
function gfMount(host, w, h){
  const made=new window.ForceGraph();
  const g=(typeof made==='function') ? made(host) : made;   // kapsule builds either way
  g.width(w).height(h)
    // The hit disc IS the drawn disc: the shadow canvas the library hit-tests on
    // paints sqrt(nodeVal) x nodeRelSize, so val=r² and nodeRelSize=1 make the
    // two the same circle whatever nodeCanvasObject then draws on top.
    .nodeRelSize(1).nodeVal((n)=>n.val)
    .cooldownTicks(0).d3AlphaDecay(1).warmupTicks(0)
    .minZoom(0.02).maxZoom(12);
  return g;
}
// A node the layout placed. `fx/fy` is what makes the library leave it alone —
// and what makes a DRAG stick: it clears fx/fy at drag end only for a node that
// had none to begin with, so a node dropped somewhere stays exactly there.
const gfPin=(n,x,y)=>{ n.x=x; n.y=y; n.fx=x; n.fy=y; return n; };
// Re-setting a draw prop is how a canvas that has gone still is told to paint
// again: `autoPauseRedraw` stops the loop when nothing moves, which is the whole
// point of a layout that does not animate, so a highlight has to say so.
const gfRepaint=(g, draw)=>{ if(!g) return; try{ g.nodeCanvasObject(draw); }catch(e){} };
// One monospace face, one place. `size` is in SCREEN pixels: the canvas is
// scaled by the zoom, so everything drawn at a fixed screen size divides by it.
const gfFont=(size, weight)=> (weight?weight+' ':'')+size+'px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace';
// Two boxes in the same space overlap?
const gfHits=(a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
// A palette token plus an alpha, as one canvas colour. The palette lives in CSS
// variables (#rrggbb) and a canvas stroke carries its own alpha, so a line that
// is drawn at 0.6 — and at 0.07 when something else is spotlighted — says so
// here rather than through a separate opacity the canvas does not have.
function gfAlpha(color, a){
  const m=/^#([0-9a-f]{6})$/i.exec(String(color==null?'':color).trim());
  if(!m || !(a>=0 && a<1)) return color;
  const n=parseInt(m[1],16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

// --- the instant tooltip ----------------------------------------------------
// One div for the whole page, shown on hover with the text a native <title>
// would carry — native tooltips wait about a second to appear, far too slow for
// a picture you read by sweeping the pointer over it. The canvas has no
// per-node element to hang a mouseenter on, so the pointer is tracked on the
// host and the RENDERER says what is under it.
const gtip=(()=>{
  const at={x:0, y:0};
  const box=()=>{ let t=document.getElementById('gtip');
    if(!t){ t=document.createElement('div'); t.id='gtip'; document.body.append(t); } return t; };
  const place=()=>{ const t=box(), pad=14, r=t.getBoundingClientRect();
    let x=at.x+pad, y=at.y+pad;
    if(x+r.width>window.innerWidth-8) x=Math.max(8, at.x-r.width-pad);
    if(y+r.height>window.innerHeight-8) y=Math.max(8, at.y-r.height-pad);
    t.style.left=x+'px'; t.style.top=y+'px'; };
  const hide=()=>{ box().style.display='none'; };
  const show=(text)=>{ if(!text){ hide(); return; } const t=box();
    t.textContent=text; t.style.display='block'; place(); };
  // The pointer LEAVING the canvas is the one thing the renderer cannot report:
  // it hit-tests where the pointer was, and a pointer that is no longer over the
  // canvas never moves again as far as it is concerned. So the host says so, and
  // the caller uses that to put its hover preview back the way it was — without
  // it, a picture stayed dimmed around whatever the pointer last brushed past.
  const follow=(host, onLeave)=>{
    host.addEventListener('mousemove',(e)=>{ at.x=e.clientX; at.y=e.clientY;
      if(box().style.display==='block') place(); });
    host.addEventListener('mouseleave',()=>{ hide(); if(onLeave) onLeave(); });
  };
  return { show, hide, follow };
})();

// --- the collision-free label placer ----------------------------------------
// Labels that overlap are worse than no label: two names on top of each other
// read as a third, wrong one. So the names wanted this frame are placed in
// priority order and any whose box would land on a box already taken — or on a
// node disc, because a name written across the circles of its neighbours is
// just as unreadable — is DROPPED. A dropped name is not lost: its node is
// still there, still hoverable, and the rail still lists it.
//
// It runs ONCE per frame, in `onRenderFramePre`, and the drawing then only reads
// what it decided. Everything is in GRAPH units with the screen-constant sizes
// divided by the zoom, which is the same comparison as screen space (the pan is
// a translation both boxes share) without a coordinate conversion per box.
// @returns Map(id -> {x, y, size}) — the baseline point to draw the name at.
function gfPlaceLabels(ctx, k, nodes, want, rank){
  const cand=nodes.filter(want);
  cand.sort((a,b)=> rank(b)-rank(a) || (a.id<b.id?-1:a.id>b.id?1:0));
  const taken=nodes.map((n)=>({x:n.x-n.r, y:n.y-n.r, w:2*n.r, h:2*n.r}));
  const out=new Map();
  for(const n of cand){
    const size=(n.fontSize||10)/k;
    ctx.font=gfFont(size, n.fontWeight);
    const w=ctx.measureText(n.label==null?n.id:n.label).width, h=size;
    const y=n.y+3.5/k, top=y-h;
    const free=(x)=>{ for(const b of taken) if(gfHits({x, y:top, w, h}, b)) return false; return true; };
    // The right of the node first, and if that side is taken its MIRROR on the
    // left (anchored at its far end, so it grows away from the node). Only ever
    // going right left every label on the left half of a ring one candidate
    // place, in the busiest direction there is — straight at the middle.
    const right=n.x+n.r+4/k, left=n.x-n.r-4/k-w;
    const x = free(right) ? right : (free(left) ? left : null);
    if(x==null) continue;
    taken.push({x, y:top, w, h});
    out.set(n.id, {x, y, size});
  }
  return out;
}
// Which names are drawn at REST — before any zoom or spotlight asks for more.
// A budget filled from the ranking, but every COMPONENT reserves its
// best-connected node first: ranked globally, a two-table island never
// out-ranks a 60-table hub's spokes and whole clusters were drawn as anonymous
// dots. A picture may not show a cluster it refuses to name.
function gfAlwaysLabel(nodes){
  const best=new Map();
  for(const n of nodes){ const b=best.get(n.comp); if(!b || n.rank>b.rank) best.set(n.comp, n); }
  const set=new Set([...best.values()].map(n=>n.id));
  const budget=Math.min(28, Math.max(8, Math.ceil(nodes.length*0.12)));
  for(const n of [...nodes].sort((a,b)=> b.rank-a.rank || (a.id<b.id?-1:a.id>b.id?1:0))){
    if(set.size>=budget) break;
    set.add(n.id);
  }
  return set;
}
// One name, with the white halo that lets it survive crossing a line.
function gfDrawLabel(ctx, at, text, weight, fill){
  ctx.font=gfFont(at.size, weight);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.lineWidth=at.size*0.28; ctx.strokeStyle=cssVar('--halo');
  ctx.strokeText(text, at.x, at.y);
  ctx.fillStyle=fill; ctx.fillText(text, at.x, at.y);
}

// ---------- Graph tab: one node's neighborhood, laid out by hop ----------
// The answer is `neighborhood`'s: nodes and graded edges around a focus. The
// page adds two things it can compute honestly from that answer — how many hops
// each node is from the focus (a BFS over the very edges it was sent) and how
// many of the DRAWN edges touch each node — and hands the rest to the shared
// engine. Rings are the reading: hop 0 at the centre, hop 1 around it, and so on.
const GRING={step:130, gap:15, nodeR:9};
const GRAPHV={ name:'graph', direction:'graph', entryId:'gfocus', sugId:'gsug',
  // 'map' — the whole pack (the default the tab opens on); 'around' — these
  // hop rings, the drill-down. The entry box is shared, so what a commit MEANS
  // is decided by the sub-mode, not by a second box.
  mode:'map',
  resp:null, seq:0, sel:null, hop:new Map(), hidden:new Set(), hiddenFor:null, counts:null,
  sugSeq:0, sugTimer:null, sugItems:[], sugRows:[], sugCur:-1, sugMoved:false, sugLast:null, pick:null };
GRAPHV.draw=()=> GRAPHV.mode==='map' ? mapCommitSearch() : drawGraph();
// A line says three things at once: its GRADE (solid / dashed / dotted — the
// same vocabulary Flow and Impact use), its DIRECTION (the arrowhead), and, when
// it is a read or a write, WHICH (the read/write hues the tags use everywhere
// else). An edge with no access keeps its grade's colour.
const gAccessColor=(a)=> a==='read' ? cssVar('--read') : (a==='write'||a==='delete') ? cssVar('--write') : null;
// Where the access LIVES depends on the edge: a statement→table EXECUTES edge
// carries it as evidence, while READS / WRITES say it in the type itself. Both
// are read here, so a read is blue and a write red wherever the engine put it.
const GTYPEACCESS={READS:'read', WRITES:'write'};
// The dash IS the grade — GRADE_DASH, the one table at the top of this file, is
// what every line on this page reads. A relation the engine could not resolve
// keeps the muted ink of its grade and never borrows an access hue: it must not
// look like one that was proved.
const GWEAK=new Set(['RUNTIME_ONLY','UNRESOLVED']);
// A CAPTURE OF THE RUNNING SYSTEM adds a FOURTH thing, and only to the weight:
// an edge a trace saw run is drawn heavier and less faded, and keeps its
// grade's colour and its grade's dash. That is the whole rule. A runtime-only
// edge stays dotted in its muted ink and simply gets that weight on top, so it
// still reads as the below-every-floor thing it is. Nothing here promotes an
// edge: `observed` says the call RAN, never that it is surer, and an edge
// without it was not visited by that capture rather than dead.
function gEdgeStyle(e){
  const access = e.access || GTYPEACCESS[e.type] || null;
  const weak = GWEAK.has(e.grade);
  const seen = e.observed===true;
  return { color: (weak? null : gAccessColor(access)) || gradeColor(e.grade),
    width: (e.grade==='EXACT'?1.5:1.2) + (seen?1.4:0), dash: gradeDash(e.grade),
    opacity: seen?0.95:0.6, observed: seen };
}
// One inline sample of what a grade's line looks like, for the legend the hint
// points at — drawn with the very table above, so the two cannot disagree.
function gradeLineSample(grade, weight){
  const s=svgEl('svg',{width:30, height:8, viewBox:'0 0 30 8','aria-hidden':'true'});
  const ln=svgEl('line',{x1:0, y1:4, x2:30, y2:4, stroke:gradeColor(grade), 'stroke-width':weight||1.5});
  if(gradeDash(grade)) ln.setAttribute('stroke-dasharray', gradeDash(grade));
  s.append(ln); return s;
}
// The drill-down: `Around <node>`. Every handoff into the Graph tab lands here
// (a node someone already named has a neighbourhood, not a map), and the
// `‹ back to map` button is what returns.
function openGraph(nodeId){
  activateTab('graph');
  // ONE BOX, TWO QUESTIONS. The entry field is the map's "find a node" and
  // Around's "which node", and the drill-down used to leave its own query
  // sitting in it: `‹ back to map` returned to the map with the drilled-down
  // node id (`endpoint:POST ...`) still typed in the map's own find box. So the
  // map's text is put aside on the way in and given back on the way out.
  if(GRAPHV.mode==='map') GMAP.find=byId('gfocus').value;
  graphMode('around');
  byId('gfocus').value = nodeId||'';
  // A full id needs no resolving — it IS the node. Anything else goes through
  // the same resolution the typeahead uses.
  GRAPHV.pick = (nodeId && nodeId.includes(':')) ? {kind:'node', value:nodeId} : null;
  closeSug(GRAPHV);
  drawGraph();
  if(nodeId && nodeId.includes(':')) pickSet('graph', nodeId);
}
// Which tool argument this entry box means. A full "<kind>:<key>" is the node
// itself; a '#' is a method; "GET /path" is a route; otherwise the ENGINE says
// which kind carries this key (the same rule the Impact box follows) — the page
// never guesses a kind from the dots in a name.
async function graphArgs(raw){
  const i=raw.indexOf(':');
  if(i>0 && KINDS.includes(raw.slice(0,i))) return {node:raw};
  if(raw.includes('#')) return {symbol:raw};
  if(GRAPHV.pick && GRAPHV.pick.value===raw) return {[GRAPHV.pick.kind]:raw};
  if(/^[A-Z]+\s+\//.test(raw)) return {endpoint:raw};
  try{
    const s=(await api('search',{query:raw, limit:100})).answer;
    if((s.tables||[]).some(t=>t.table===raw)) return {table:raw};
    if((s.columns||[]).some(c=>c.column===raw)) return {column:raw};
    if((s.statements||[]).some(x=>x.statement===raw)) return {statement:raw};
  }catch(e){ /* fall through to the shape rule, so the ENGINE names what it cannot find */ }
  return raw.split('.').length>=2 ? {column:raw} : {table:raw};
}
async function drawGraph(){
  const raw=byId('gfocus').value.trim();
  const side=byId('gside'), counts=byId('gcounts');
  if(!raw){
    stopAround(); byId('gchips').replaceChildren(); side.replaceChildren();
    counts.replaceChildren(t('graph.empty'));
    GRAPHV.resp=null; return;
  }
  counts.replaceChildren(t('load.around'));
  // A late answer is NEVER the current answer: every request carries a sequence
  // number and drops itself if a newer Draw has started since.
  const mine=++GRAPHV.seq;
  let args;
  try{ args=await graphArgs(raw); }
  catch(e){ if(stale(e)||mine!==GRAPHV.seq) return; counts.replaceChildren();
    side.replaceChildren(errPanel(e)); return; }
  if(mine!==GRAPHV.seq) return;
  args.direction=byId('gdir').value;
  args.hops=Number(byId('ghops').value);
  args.limit=220;
  let r;
  try{ r=await api('neighborhood',args); }
  catch(e){ if(stale(e)||mine!==GRAPHV.seq) return; counts.replaceChildren();
    stopAround(); byId('gchips').replaceChildren();
    side.replaceChildren(errPanel(e)); return; }
  if(mine!==GRAPHV.seq) return;
  GRAPHV.resp=r; GRAPHV.sel=null;
  // Along the direction the answer walked. `neighborhood` collects nodes by
  // direction but returns EVERY edge between them, so an undirected BFS finds
  // shortcuts the walk never took and puts a node three steps up on ring 1.
  GRAPHV.hop=hopsFrom(r.answer.focus, r.answer.edges, r.answer.direction);
  // Columns are the bulk of the hairball when the focus is a table or a
  // statement, so they start hidden — the chip still says how many there are. A
  // NEW focus resets the chips; redrawing the same focus keeps them.
  if(GRAPHV.hiddenFor!==r.answer.focus){
    GRAPHV.hiddenFor=r.answer.focus;
    const fk=r.answer.focus.slice(0, r.answer.focus.indexOf(':'));
    GRAPHV.hidden=new Set((fk==='table'||fk==='statement') ? ['column'] : []);
  }

const gaDimLink=()=> cssVar('--dim-link');

function mountAround(host, w, h){
  const g=gfMount(host, w, h);
  g.nodeCanvasObject(aroundDrawNode).nodeCanvasObjectMode(()=>'replace')
    .linkColor(aroundLinkColor).linkWidth((l)=>l.w).linkLineDash((l)=>l.dash)
    // The arrowhead is the library's, at relPos 1 — which lands its tip on the
    // target node's own radius, the same place the hand-drawn one used to sit.
    .linkDirectionalArrowLength(6.5).linkDirectionalArrowRelPos(1).linkDirectionalArrowColor(aroundLinkColor)
    .onRenderFramePre(aroundFramePre)
    .onNodeHover(aroundHover).onNodeClick(aroundClick).onBackgroundClick(()=>aroundClear())
    .onLinkHover((l)=>gtip.show(l?l.tip:null))

    // and a picture whose rings mean "this far from the focus" must not let a
    // drag move a node to a distance nothing measured.

    .graphData({nodes:GA.nodes, links:GA.links});

  GA.api=g;

}
