// ---------- Coupling tab — which API group writes what another one reads ----------
// The SERVER builds the matrix (tool `coupling`); this only draws it. A cell is
// a COUNT of shared columns/tables, so it is painted in ONE hue at varying
// strength — never in the grade colours, which mean something else entirely.
// The ranked pair list is the primary reading (the matrix is sparse by nature);
// the matrix is the overview and the way into a pair.
const CP={resp:null, sel:null, seq:0, axis:'column', showAll:false, cellEls:new Map()};
const cpKey=(w,r)=>w+'\u0000'+r;   // NUL: no group name can contain it
const cpUnit=(axis,one)=> (axis==='column' ? (one?'column':'columns') : (one?'table':'tables'));

async function drawCoupling(){
  const wrap=byId('cpmatrix'), side=byId('cpside'), sum=byId('cpsummary');
  sum.replaceChildren(t('load.coupling'));
  wrap.replaceChildren(); side.replaceChildren();
  CP.cellEls=new Map();
  const q={axis:CP.axis, mode:byId('cpmode').value, depth:Number(byId('cpdepth').value)};
  // The PREVIOUS answer dies with the request, not with its reply: a query that
  // fails must not leave the old axis's matrix live behind a toolbar that now
  // says something else.
  CP.resp=null; CP.sel=null;
  // A late answer is never the current answer: an axis switched twice must not
  // be overwritten by the first request coming back second.
  const mine=++CP.seq;
  let r;
  try{ r=await api('coupling',{...q, limit:500}); }
  catch(e){ if(stale(e)||mine!==CP.seq) return; sum.replaceChildren();
    wrap.replaceChildren(el('div',{className:'panel',
      textContent:t('err.coupling',{axis:q.axis, mode:q.mode, depth:q.depth, message:e.message})})); return; }
  if(mine!==CP.seq) return;
  CP.resp=r;
  renderCoupling();
}
// An empty matrix in the Explore words ("none — nothing reaches this") reads as
// "these modules share nothing". It usually is not: it is the grade floor, or
// the depth. Say WHICH, and offer the mode that would look wider.
function cpEmptyNote(a){
  if(a.empty && a.empty.pairs==='not-shipped') return emptyNote(a.empty,'pairs');
  const byMode=(a.walk&&a.walk.byMode)||0;
  if(byMode>0){
    const wider = a.mode==='strict' ? 'conservative' : a.mode==='conservative' ? 'heuristic' : null;
    return el('li',{className:'empty'},[
      t('cp.empty.bymode',{mode:a.mode, n:byMode}),
      wider? el('button',{className:'mini',style:'margin-left:8px',textContent:t('cp.empty.switch',{mode:wider}),onclick:()=>{ byId('cpmode').value=wider; drawCoupling(); }}) : null ]);
  }
  return el('li',{className:'empty',textContent:t('cp.empty.none',{depth:a.depth})});
}
function renderCoupling(){
  const r=CP.resp; if(!r) return;
  const a=r.answer, cells=a.cells||[], s=a.summary||{};
  byId('cpsummary').replaceChildren(
    el('b',{textContent:String(s.groups??0)}), ' groups\u00a0\u00a0',
    el('b',{textContent:String(s.participatingGroups??0)}), ' participating\u00a0\u00a0',
    el('b',{textContent:String(cells.length)}), ' pairs\u00a0\u00a0',
    el('b',{textContent:String(s.coupledItems??0)}), ' coupled '+cpUnit(a.axis), '\u00a0\u00a0',
    el('b',{textContent:String(s.selfOnlyItems??0)}), ' self-only\u00a0\u00a0',
    el('b',{textContent:String((s.writeOnlyItems??0)+(s.readOnlyItems??0))}), ' write-only or read-only');
  renderCouplingMatrix(a, cells);
  renderCouplingSide();
}
function renderCouplingMatrix(a, cells){
  const wrap=byId('cpmatrix');
  const part=new Set(); cells.forEach(c=>{ part.add(c.writer); part.add(c.reader); });
  const all=(a.groups||[]).map(g=>g.group);
  // Collapsed to the participating groups by default: on a real pack the matrix
  // is sparse (mall: 14 filled cells of 650), and 26×26 mostly-empty squares
  // hide the finding instead of showing it.
  const groups=CP.showAll?all:all.filter(g=>part.has(g));
  CP.cellEls=new Map();
  if(!groups.length){
    wrap.replaceChildren(el('div',{className:'panel'},[el('ul',{className:'list'},[cpEmptyNote(a)])]));
    return;
  }
  const unit=cpUnit(a.axis);
  const count=new Map(cells.map(c=>[cpKey(c.writer,c.reader), c.count]));
  const max=cells.reduce((m,c)=>Math.max(m,c.count),0)||1;
  const colTh=[], rowTh=[];
  const head=el('tr',{},[el('th',{className:'cpcorner',title:'a row WRITES what a column READS',textContent:'writer ↓ / reader →'})]);
  groups.forEach(g=>{ const th=el('th',{title:g,textContent:g}); colTh.push(th); head.append(th); });
  const body=el('tbody');
  groups.forEach((w,i)=>{
    const rth=el('th',{title:w,textContent:w}); rowTh.push(rth);
    const tr=el('tr',{},[rth]);
    groups.forEach((rd,j)=>{
      const n=count.get(cpKey(w,rd))||0;
      const cell=el('div',{className:'cpcell'+(w===rd?' diag':'')+(n?' on':'')});
      if(w===rd){
        cell.title=t('cp.diag.title',{group:w, unit});
      } else if(n){
        // One hue, alpha by count -- the WRITE hue, because a cell counts what
        // the row writes. The ramp is the token's own colour at an alpha, so it
        // follows the theme; past the halfway mark the text flips to the ground.
        const alpha=0.08+0.62*(n/max);
        cell.style.background=gfAlpha(cssVar('--write'), alpha);
        if(alpha>0.45) cell.style.color=cssVar('--g0');
        cell.textContent=String(n);
        cell.title=w+' writes '+n+' '+cpUnit(a.axis,n===1)+' that '+rd+' reads';
        cell.tabIndex=0;
        cell.setAttribute('role','button');
        cell.setAttribute('aria-label',cell.title);
        const open=()=>cpSelect(w,rd);
        cell.addEventListener('click',open);
        cell.addEventListener('keydown',(ev)=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); open(); } });
        CP.cellEls.set(cpKey(w,rd),cell);
        if(CP.sel===cpKey(w,rd)) cell.classList.add('sel');
      } else {
        cell.textContent='·';
      }
      // A cell far from its labels is unreadable: hovering (or focusing) one
      // lights the row and column it belongs to.
      const lightOn=()=>{ colTh[j].classList.add('hot'); rowTh[i].classList.add('hot'); };
      const lightOff=()=>{ colTh[j].classList.remove('hot'); rowTh[i].classList.remove('hot'); };
      cell.addEventListener('mouseenter',lightOn);
      cell.addEventListener('mouseleave',lightOff);
      cell.addEventListener('focus',lightOn);
      cell.addEventListener('blur',lightOff);
      tr.append(el('td',{},[cell]));
    });
    body.append(tr);
  });
  wrap.replaceChildren(el('table',{className:'cpm'},[el('thead',{},[head]), body]));
}
function cpSelect(w,rd){
  const k=cpKey(w,rd);
  CP.sel = CP.sel===k ? null : k;
  for(const [key,e] of CP.cellEls) e.classList.toggle('sel', key===CP.sel);
  renderCouplingSide();
}
function cpClear(){ CP.sel=null; for(const [,e] of CP.cellEls) e.classList.remove('sel'); renderCouplingSide(); }
function renderCouplingSide(){
  const r=CP.resp; if(!r) return;
  const a=r.answer, pairs=a.pairs||[];
  const sel=CP.sel ? pairs.find(p=>cpKey(p.writer,p.reader)===CP.sel) : null;
  const kids=[];

    // list limit — say so rather than showing an empty card.
    kids.push(el('div',{className:'panel'},[

      el('div',{className:'empty',textContent:t('cp.pastcut',{unit:cpUnit(a.axis)})})]));

  byId('cpside').replaceChildren(...kids);
}
function cpPairList(r, a, pairs){

        el('span',{className:'cpg',textContent:p.writer}), el('span',{className:'cparrow',textContent:'→'}), el('span',{className:'cpg',textContent:p.reader}) ]),

        el('span',{className:'tag',textContent:String(p.count)}) ]) ])) : [cpEmptyNote(a)])

// ---------- Overview tab: the pack at a glance, from ONE answer ----------
// The landing page. It asks the server once and draws what comes back: the
// ribbon, the census, the gaps and the hubs are all fields of that one
// response, so nothing here can disagree with the engine. The only arithmetic
// the page does is a band's height and the "n of total" split of two numbers
// the answer already carries — it never walks the graph itself.
const OV = { resp:null, screens:null };
const ovNum = (n)=> n==null ? '—' : Number(n).toLocaleString('en-US');
// The engine's own name for a long id: the last two dotted segments. The full
// id travels in the title, so nothing is lost by shortening the chip.
const ovShort = (id)=> String(id).split('.').slice(-2).join('.');
const ovTotal = (r, field, fallback)=>{
  const f = (r.truncated && (r.truncated.fields||[]).find(x=>x.field===field));
  return f ? f.total : fallback;
};

async function loadOverview(){
  const cards=byId('ovcards'), panels=byId('ovpanels'), side=byId('ovside');
  cards.replaceChildren(el('div',{className:'panel',textContent:t('load.overview')}));
  panels.replaceChildren(); side.replaceChildren();
  let r;
  try { r=await api('overview',{}); }
  catch(e){ if(stale(e)) return; cards.replaceChildren(errPanel(e)); return; }
  OV.resp=r;
  OV.screens=null;
  renderOverview();
  // THE ONE EXTRA REQUEST THIS TAB MAKES, and only where there is something to
  // ask about: the busiest screens, from the same `browse kind=screen` list the
  // Explore rail draws. The overview answer carries the screen CENSUS but no
  // per-screen rows, and the page must not invent them. Drawn when it lands, so
  // nothing on this tab waits for it.
  if(!r.answer.screens) return;
  const mine=STATE.seq, forProject=STATE.project;
  let b;
  try { b=await api('browse',{kind:'screen', sort:'tables', limit:OV_HUB_TOP}); }
  catch(e){ return; }
  if(mine!==STATE.seq || forProject!==STATE.project || OV.resp!==r) return;
  OV.screens=b;
  renderOverview();
}
function renderOverview(){
  const r=OV.resp; if(!r) return;
  const a=r.answer;

  byId('ovhero').classList.remove('hidden');
  byId('ovherocol').replaceChildren(ovHubBars(r,a), ovGapsPanel(a), ovGradesPanel(a));
  // The ribbon is NOT deleted: it is the drawing theme's own picture of the same
  // four numbers, one click below the dials that replaced it.
  byId('ovfold').replaceChildren(el('div',{className:'panel ovfoldwrap'},[
    fold('ov.ribbon', [t('ribbon.title')], ()=> [ovRibbon(a)]) ]));
  byId('ovpanels').replaceChildren(ovNodesPanel(a), ovEdgesPanel(a),
    ovCodePanel(a), ovHubEndpoints(r,a), ovHubScreens(a));
  byId('ovside').replaceChildren(honesty(r, 'overview'));
  // The screens layer's default is a COUNT, and the count is on THIS answer. A
  // map drawn before it landed (a deep link straight to the Graph tab) was
  // asked for without the layer, so it is asked again — once, and only where
  // the decision is "on". Everywhere else this costs nothing.
  mapScreensDecide();
  if(GMAP.askedScreens!==undefined && GMAP.askedScreens!==GMAP.screens) drawMap();

// ---- the hero, row 1: four KPI dials ---------------------------------------
// The SAME four numbers the ribbon was drawn from — `overview.answer.reach`,
// field for field — read as "how much of this lane is wired". The page does one
// division and one rounding; it walks nothing and counts nothing.
// THE FIFTH DIAL is the far end of the round trip, and it is drawn only where
// the answer carries a `screens` block: an axis that never ran has no share to
// show, and a 0% dial there would say the frontend reaches nothing when the
// truth is that no frontend was analyzed.
const OV_KPI = [
  { kind:'endpoint',  lbl:'kpi.endpoints',  rest:'kpi.rest.endpoints',
    has:()=> true,
    of:(a)=> (a.reach||{}).endpoints||0,
    got:(a)=> ((a.reach||{}).endpoints||0)-((a.reach||{}).endpointsWithoutStatement||0) },
  { kind:'statement', lbl:'kpi.statements', rest:'kpi.rest.statements',
    has:()=> true,
    of:(a)=> (a.reach||{}).statements||0, got:(a)=> (a.reach||{}).statementsReached||0 },
  { kind:'table',     lbl:'kpi.tables',     rest:'kpi.rest.tables',
    has:()=> true,
    of:(a)=> (a.reach||{}).tables||0,     got:(a)=> (a.reach||{}).tablesReached||0 },
  { kind:'column',    lbl:'kpi.columns',    rest:'kpi.rest.columns',
    has:()=> true,
    of:(a)=> (a.reach||{}).columns||0,    got:(a)=> (a.reach||{}).columnsReached||0 },
  { kind:'screen',    lbl:'kpi.screens',    rest:'kpi.rest.screens',
    has:(a)=> !!a.screens,
    of:(a)=> (a.screens||{}).screens||0,  got:(a)=> (a.screens||{}).reachingATable||0,
    // A router the SERVER fills in at run time makes the denominator itself a
    // lower bound, and a share of a lower bound has to say so on the card.
    note:(a)=> ((a.screens||{}).serverDriven ? 'kpi.screens.serverdriven' : null) },
];
const KPI_R=26, KPI_C=2*Math.PI*KPI_R;
function ovKpis(a){
  return OV_KPI.filter((k)=>k.has(a)).map((k)=>{
    const total=k.of(a), got=k.got(a), rest=Math.max(0, total-got);
    const pct = total ? Math.round(got/total*100) : 0;
    const card=el('div',{className:'kpi', style:'color:'+kindColor(k.kind)},[
      el('div',{className:'kpilbl',textContent:t(k.lbl)}),
      el('div',{className:'kpinum'},[ ovNum(got===0&&total===0?0:pct),
        el('span',{className:'kpipct',textContent:'%'}) ]),
      el('div',{className:'kpiden',
        textContent: ovNum(got)+' / '+ovNum(total)+'\u00a0\u00a0'+t(k.rest,{n:ovNum(rest)})}),
      (k.note && k.note(a)) ? el('div',{className:'kpinote',textContent:t(k.note(a))}) : null,
    ]);
    // The arc: the same share, drawn. `stroke-dasharray` is the share of the
    // circumference, so the gauge cannot disagree with the number beside it.
    const svg=svgEl('svg',{class:'kpidial', width:64, height:64, viewBox:'0 0 64 64','aria-hidden':'true'});
    svg.append(svgEl('circle',{class:'kpitrack', cx:32, cy:32, r:KPI_R, fill:'none','stroke-width':7}));
    svg.append(svgEl('circle',{class:'kpiarc', cx:32, cy:32, r:KPI_R, fill:'none','stroke-width':7,
      'stroke-linecap':'round', transform:'rotate(-90 32 32)',
      'stroke-dasharray':(KPI_C*pct/100).toFixed(1)+' '+(KPI_C*2).toFixed(1)}));
    card.append(svg);
    card.setAttribute('aria-label', t(k.lbl)+': '+pct+'% — '+ovNum(got)+' / '+ovNum(total));
    return card;
  });
}

// ---- the hero: the cascade ribbon ------------------------------------------
// The ONE bold thing on this page. Four lanes of the chain, left to right, each
// a vertical band whose height is proportional to the SQUARE ROOT of its count:
// on a real pack the lanes differ by more than tenfold (906 statements against
// 76 tables) and a linear scale flattens the small ones into a line. The solid
// part is what an endpoint reaches, the hatched part what nothing analysed
// reaches, and the tapered band between two lanes is reached carrying over into
// reached. Static — nothing here moves, on load or ever.
// One SVG text node, built in one call — the DOM's `textContent` is the only
// safe way to put a string into a picture, and a helper keeps it that way.
const svgText=(attrs, text, tag)=>{ const e=svgEl(tag||'text', attrs); e.textContent=text; return e; };
// A count and what it counts, on one line: the number in Mono, the word muted.
const ribbonCount=(x, y, num, word)=> {
  const e=svgEl('text',{x, y});
  e.append(svgText({class:'num'}, num, 'tspan'), svgText({class:'small'}, word, 'tspan'));
  return e;
};
const RIBBON_H=170, RIBBON_STEP=168, RIBBON_W=34, RIBBON_TOP=14, RIBBON_LEFT=10;
function ovRibbon(a){
  const rc=a.reach||{};
  // Each lane names its two catalogue keys OUTRIGHT rather than building them
  // out of the lane name: a key assembled at run time is a key no test can see.
  const lanes=[
    { lane:'ribbon.lane.endpoints',  say:'ribbon.say.endpoints',
      total:rc.endpoints||0,  reached:(rc.endpoints||0)-(rc.endpointsWithoutStatement||0) },
    { lane:'ribbon.lane.statements', say:'ribbon.say.statements',
      total:rc.statements||0, reached:rc.statementsReached||0 },
    { lane:'ribbon.lane.tables',     say:'ribbon.say.tables',
      total:rc.tables||0,     reached:rc.tablesReached||0 },
    { lane:'ribbon.lane.columns',    say:'ribbon.say.columns',
      total:rc.columns||0,    reached:rc.columnsReached||0 },
  ];
  const top=lanes.reduce((m,l)=>Math.max(m,l.total),0)||1;
  const height=(n)=> Math.max(2, RIBBON_H*Math.sqrt(Math.max(0,n)/top));
  const W=RIBBON_LEFT+RIBBON_STEP*(lanes.length-1)+RIBBON_W+112;
  const H=RIBBON_TOP+RIBBON_H+30;
  const ink3=cssVar('--t3');
  const svg=svgEl('svg',{class:'ribbonsvg', viewBox:'0 0 '+W+' '+H, preserveAspectRatio:'xMidYMid meet',
    role:'img', 'aria-label':t('ribbon.title')});
  const note=t('ribbon.note',{mode:a.mode, depth:a.depth});
  // The scale this picture used, as the picture's OWN accessible name — and as
  // a sentence under the heading, because a reader should not have to hover to
  // learn that the heights are square-rooted.
  svg.append(svgText({}, note, 'title'));
  const defs=svgEl('defs');
  const pat=svgEl('pattern',{id:'ribbonhatch', width:5, height:5, patternUnits:'userSpaceOnUse', patternTransform:'rotate(45)'});
  pat.append(svgEl('line',{x1:0, y1:0, x2:0, y2:5, stroke:ink3, 'stroke-width':1}));
  defs.append(pat); svg.append(defs);

  // Every band stands on the SAME ground line, with what is reached at the
  // bottom (solid ink) and what is not above it (hatched): the chain is read
  // along the ground, and the hatching is the part of the pack it never gets to.
  const base=RIBBON_TOP+RIBBON_H;
  const geo=lanes.map((l,i)=>{
    const full=height(l.total);
    const reach=l.total ? full*(l.reached/l.total) : 0;
    return { l, x:RIBBON_LEFT+i*RIBBON_STEP, full, reach,
      top:base-full, reachTop:base-reach, base };
  });
  // the reached-to-reached connectors go UNDER the bands, along the ground line
  for(let i=0;i<geo.length-1;i++){
    const A=geo[i], B=geo[i+1];
    const x1=A.x+RIBBON_W, x2=B.x;
    svg.append(svgEl('path',{class:'flowband',
      d:'M'+x1+','+A.reachTop+' L'+x2+','+B.reachTop+' L'+x2+','+base+' L'+x1+','+base+' Z'}));
  }
  svg.append(svgEl('line',{class:'ground', x1:0, y1:base, x2:W, y2:base}));
  const say=el('div',{className:'ribbonsay', textContent:t('ribbon.hover')});
  const groups=[];
  for(const g of geo){
    const l=g.l, rest=Math.max(0, l.total-l.reached);
    const box=svgEl('g',{class:'band', tabindex:'0'});
    if(g.reach>0.5) box.append(svgEl('rect',{class:'solid', x:g.x, y:g.reachTop, width:RIBBON_W, height:g.reach}));
    if(g.full-g.reach>0.5) box.append(svgEl('rect',{class:'hatch', x:g.x, y:g.top, width:RIBBON_W, height:g.full-g.reach}));
    // The counts sit beside the part each one measures, centred on it — and the
    // upper one is pushed clear when the two parts are too thin to hold both.
    const lx=g.x+RIBBON_W+8;
    let yReach=Math.min(g.base-4, g.reachTop+g.reach/2+4);
    let yRest=g.top+(g.full-g.reach)/2+4;
    if(yReach-yRest<14) yRest=yReach-14;
    box.append(ribbonCount(lx, yReach, ovNum(l.reached), ' '+t('ribbon.reached')));
    if(rest>0) box.append(ribbonCount(lx, yRest, ovNum(rest), ' '+t('ribbon.unreached')));
    box.append(svgText({class:'lane', x:g.x, y:base+21}, t(l.lane)));
    const sentence=t(l.say, {reached:ovNum(l.reached), total:ovNum(l.total), rest:ovNum(rest)});
    box.setAttribute('aria-label', sentence);
    const light=()=>{ say.textContent=sentence;
      for(const other of groups) other.classList.toggle('dim', other!==box);
      box.classList.add('on'); };
    const clear=()=>{ say.textContent=t('ribbon.hover');
      for(const other of groups){ other.classList.remove('dim'); other.classList.remove('on'); } };
    box.addEventListener('mouseenter', light);
    box.addEventListener('mouseleave', clear);
    box.addEventListener('focus', light);
    box.addEventListener('blur', clear);
    groups.push(box);
    svg.append(box);
  }
  return el('div',{className:'ribbon'},[
    el('h2',{textContent:t('ribbon.title')}),
    el('p',{className:'ribbonnote', textContent:note}),
    svg, say ]);
}

// The honesty panel, at GLANCE level: one row of chips, `kind count`, in the
// order the answer tells the story. A chip opens the engine's own sentence about
// that gap — and the sample ids under it, each still a handoff to the view that
// can answer "so what IS this one?". Nothing is dropped; the count is outside
// the fold, because a count is what a glance is for.
// A gap's TINT is a reading of its kind, not of its count: `warn`, the soft
// amber, for the boundaries of what the analyzer can see at all, and plain for
// the rest — which are counts of the pack, not of the analysis. The count
// itself never folds.
//
// NOTHING HERE IS RED (RM36). `unresolved-calls` wore the error red until this
// round, and it is the first chip on the panel: a reader meeting this tool was
// told in the colour of a broken build that the honest disclosure at the top of
// the page was a fault. It is not. A blind spot named and counted is the thing
// this product exists to do, so the worst any of them wears is amber.
const OV_GAP_TINT = { 'unresolved-calls':'warn', 'external-symbols':'warn',
  'multi-handler-routes':'warn' };
// THE NAME OF A GAP, in the reader's words. `unresolved-calls` is what the
// engine calls it and stays on the tooltip beside the count; this is what a
// person who has not read the docs can read off the chip. A kind with no label
// in the catalogue falls back to its own slug, so the day the engine emits a
// new one the panel says its name rather than a catalogue key or nothing.
//
// The existence check is against the ENGLISH catalogue and not against t(),
// because English is the key set every translation is held to and because
// asking t() for a key nobody wrote would file it in the missing-key ledger.
// That ledger is how a real dropped string is found, and a fallback we designed
// on purpose is not a dropped string.
function ovGapLabel(kind){
  const key='ov.gap.'+kind+'.label';
  return Object.hasOwn(VIEWER_STRINGS.en, key) ? t(key) : String(kind).replace(/-/g,' ');
}
function ovGapsPanel(a){
  const gaps=a.gaps||[];
  const kids=[ el('h2',{},[t('ov.gaps.title')+' ', el('span',{className:'count',textContent:'('+gaps.length+')'})]),
    el('div',{className:'panelsub',textContent:t('ov.gaps.note',{n:gaps.length})}) ];
  if(!gaps.length){ kids.push(el('ul',{className:'list'},[emptyNote(a.empty,'gaps')])); return el('div',{className:'panel'},kids); }
  const chips=el('div',{className:'ovchips'});
  const bodies=el('div',{className:'ovgapbodies'});
  for(const g of gaps){
    const tint=OV_GAP_TINT[g.kind];
    const [head, body]=foldParts('ov.gap.'+g.kind,

// THE "THIS PACK" CARD IS GONE. Every field it printed is already on this
// screen: project, digest, lanes and base commit in the masthead's title block,
// built and freshness in the evidence rail's `basis` block beside this column,
// and mode/depth in the ribbon's own note. A second copy of all six was the
// clearest case of the same fact printed twice on one page.

// ---------- the cascade rail — the chain, in the order this engine walks it ---
// The header's second line. Six lanes joined by hairlines: every count is the
// `overview` answer's own node census, and a lane whose AXIS the pack does not
// ship is drawn hollow saying so rather than reading as a count of zero.
//
// The api-group lane is the one the overview answer does not carry. A group is
// the `map` tool's own bucket (the first segment of a route), so this lane waits
// for that answer and shows an em dash until the Graph map has been drawn — the
// page does not invent the number, and does not spend a second whole-pack walk
// on the landing screen to learn it.
const CRAIL = [
  ['screen',    'crail.screens'],
  ['group',     'crail.groups'],
  ['endpoint',  'crail.endpoints'],
  ['symbol',    'crail.services'],
  ['statement', 'crail.sql'],
  ['table',     'crail.tables'],
  ['column',    'crail.columns'],
];
const CRAIL_AXIS = { screen:'screen', endpoint:'code', symbol:'code', statement:'statements', table:'catalog', column:'column' };
function renderCascadeRail(){
  const box=byId('crail');
  const a=OV.resp && OV.resp.answer;
  if(!a){ box.replaceChildren(); box.title=''; return; }
  const census=new Map((a.nodes||[]).map((n)=>[n.kind, n.count]));
  const axes=a.axes||{};
  const groups=(GMAP.resp && GMAP.resp.answer && GMAP.resp.answer.summary)
    ? GMAP.resp.answer.summary.groups : null;
  box.title=t('crail.title');
  const kids=[];
  CRAIL.forEach(([kind,key],i)=>{
    if(i) kids.push(el('span',{className:'crrule'}));
    const axis=CRAIL_AXIS[kind];
    // THREE STATES, not two. An axis that never ran says so; one that RAN AND
    // COULD NOT SEE ALL OF IT keeps its number, with a mark saying the number
    // is a lower bound and the engine's own reason on it. A screens block the
    // answer does not carry at all IS the engine saying there is no screen
    // axis, whatever an older pack declares in its axis map.
    let status = (axis && axes[axis] && axes[axis].status) || 'shipped';
    if(kind==='screen' && !a.screens) status='not-shipped';
    const reason = (axis && axes[axis] && axes[axis].reason) || null;
    let value, title='', hollow=false;
    if(kind==='group'){
      value = groups==null ? '—' : ovNum(groups);
      hollow = groups==null;
      title = t('crail.groups.title');
    } else if(status!=='shipped' && status!=='degraded'){
      value=t('crail.notshipped'); hollow=true;
      title=reason || t('crail.notshipped.title');
    } else {
      // The screen count is the overview's own screens block, which is the
      // number every other screen view on this page is drawn from.
      value=ovNum(kind==='screen' ? (a.screens.screens||0) : (census.get(kind)||0));
      if(status==='degraded'){
        value=value+'\u00a0~';
        title=reason || t('crail.degraded.title');
      }
    }
    kids.push(el('span',{className:'crlane'+(hollow?' hollow':''), title},
      [ t(key)+' ', el('b',{textContent:value}) ]));
  });
  box.replaceChildren(...kids);
}

// ---------- tabs / init ----------
const TABNAMES=['overview','explore','flow','impact','coupling','graph','erd','tx'];
const CHAINTABS={flow:FLOWV, impact:IMPACTV};
// Showing a tab and LOADING a tab are two different things: a project switch
// empties every tab's cache and then asks the visible one to fill itself again,
// which is exactly `loadTab` with nothing cached.
function activateTab(name){
  if(TABNAMES.indexOf(name)<0) name='overview';
  STATE.tab=name;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===name));
  TABNAMES.forEach(n=> document.getElementById('tab-'+n).classList.toggle('hidden', name!==n));
  writeHash();
  loadTab(name);
  refreshShowAll();
}
function loadTab(name){
  if (name==='overview'){
    if(!byId('ovcards').hasChildNodes()) loadOverview();
    // The cartography is the live map: bring it here (from the Graph tab, if
    // that is where it was) rather than mounting a second one.
    else ovMapMount();
  }
  if (name==='tx' && !document.getElementById('txview').hasChildNodes()) loadTx();
  // Explore, Flow and Impact open SHOWING the pack: the rail draws what it
  // already holds, and asks the server for its list exactly once.
  if (RAILDEF[name]) railOpenTab(name);
  const v=CHAINTABS[name];
  if (v){
    if(!vwrap(v).hasChildNodes()) drawChain(v);
    // The picture may have been rendered while this tab was hidden (no layout,
    // so no lines could be measured). Now that it is visible, measure it.
    else if(v.resp && v.view==='lanes') requestAnimationFrame(()=>drawChainLinks(v));
  }
  if (name==='erd' && !document.getElementById('erdside').hasChildNodes()) { document.getElementById('etable').value=''; drawErd(); }
  if (name==='coupling' && !document.getElementById('cpmatrix').hasChildNodes()) drawCoupling();
  // The Graph tab opens on the WHOLE map and loads it on first visit — the old
  // empty-until-you-type state was a regression. A picture already on screen is
  // left alone: a re-render would throw its settled layout away.
  if (name==='graph'){
    // The pane is sized from its own top offset, which only exists once the tab
    // is on screen: measure BEFORE anything mounts into it, or the renderer is
    // built at the wrong size and every layout that follows is fitted to it.
    graphPaneResize();
    if (GRAPHV.mode==='map'){
      mapMoveTo('graph');
      if(!GMAP.resp) drawMap();
      else if(!GMAP.api) renderMap();
    }
    else if (!GA.api) drawGraph();
    graphPaneApply();
  }
}
// CLICKING THE TAB YOU ARE ALREADY ON puts it back to its opening state. It is
// the gesture every reader already tries, and until now it did nothing.
// Everything the PAGE navigates with calls activateTab directly, so an internal
// hand-off to a tab never reads as that click.
document.querySelectorAll('.tab').forEach((node)=> { node.onclick=()=>{
  const name=node.dataset.tab;
  if(name===STATE.tab && Object.hasOwn(SHOWALL, name)){ showAll(name); return; }
  activateTab(name);
}; });

// ---------- the URL hash: which project, which tab, which pick --------------
// `#p=<id>&tab=<name>&pick=<node id>&src=<node id>`. A tab or a project change
// REPLACES the entry (they are not steps a Back button should undo one at a
// time); a PICK, and opening the source pane, PUSH one — so Back returns to the
// previous picture and a reload lands on the same one. `popstate` and
// `hashchange` come back through the same door, and a pick whose answer is
// still in memory is re-drawn without a request.
function readHash(){
  const q=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  return { p:q.get('p')||null, tab:q.get('tab')||null, pick:q.get('pick')||null, src:q.get('src')||null };
}
function hashNow(){
  // A server with no project has no id to write: the hash then says only which
  // tab is open, rather than carrying an empty `p=`.
  const parts=[];
  if(STATE.project) parts.push('p='+encodeURIComponent(STATE.project));
  parts.push('tab='+encodeURIComponent(STATE.tab||'overview'));
  const pick=PICK[STATE.tab];
  if(pick) parts.push('pick='+encodeURIComponent(pick));
  if(SRC.open && SRC.node) parts.push('src='+encodeURIComponent(SRC.node));
  return '#'+parts.join('&');
}
function writeHash(push){
  if(HASHLOCK) return;
  const h=hashNow();
  if(location.hash===h) return;
  try{ push ? history.pushState(null,'',h) : history.replaceState(null,'',h); }
  catch(e){ location.hash=h; }
}
function applyHash(){
  const h=readHash();
  if(h.p && h.p!==STATE.project && STATE.projects.some((x)=>x.id===h.p)){ switchProject(h.p); return; }
  const was=HASHLOCK; HASHLOCK=true;
  try{
    if(h.tab && h.tab!==STATE.tab && TABNAMES.indexOf(h.tab)>=0) activateTab(h.tab);
    if(Object.hasOwn(PICK, STATE.tab)) pickRestore(STATE.tab, h.pick||null);
    if(h.src){ if(!SRC.open || SRC.node!==h.src) srcOpen(h.src, {push:false}); }
    else if(SRC.open) srcClose();
  } finally { HASHLOCK=was; }
  refreshShowAll();
}
window.addEventListener('hashchange', applyHash);
window.addEventListener('popstate', applyHash);

// ---------- the project selector --------------------------------------------
// Selecting a project is not a filter on what is on screen: it is a different
// pack, so everything on screen is WRONG until it is asked again. STATE.seq is
// bumped first (every answer still in flight is now stale and will be dropped),
// then every tab's cache and every live renderer is torn down, and only then is
// anything re-asked.
function switchProject(id){
  if(!id || id===STATE.project) return;
  STATE.project=id;
  STATE.seq++;
  lsSet(LS_PROJECT, id);
  writeHash();
  resetProjectState();
  renderProjectChrome();
  loadMeta();
  // The Overview is the landing answer for every project, whichever tab is on
  // screen; the visible tab then fills itself, because its cache is now empty.
  loadOverview();
  loadTab(STATE.tab);
}
// Everything the PREVIOUS project left behind. A renderer that is not stopped
// here keeps its own animation loop and its own canvas alive behind the new
// picture — which is why the Graph tab is put back on the map with the renderer
// DOWN (graphSetMode draws nothing) rather than through graphMode().
function resetProjectState(){
  // Every pick, every remembered answer and the source pane belong to the pack
  // that is being left: none of them describes the one arriving.
  for(const k of Object.keys(PICK)) PICK[k]=null;
  PICKMEM.clear();
  SRC.mem.clear();
  srcClose();
  OV.resp=null;
  byId('ovcards').replaceChildren(); byId('ovpanels').replaceChildren(); byId('ovside').replaceChildren();
  byId('ovhero').classList.add('hidden');
  byId('ovherocol').replaceChildren(); byId('ovmapsub').replaceChildren();
  byId('ovmapleg').replaceChildren(); byId('ovfold').replaceChildren();
  renderCascadeRail();
  renderMastChrome();
  view.replaceChildren();
  // The browse rails are the OLD pack's lists: everything in them is wrong now.
  for(const tab of RAILTABS){
    RAIL[tab].seq++;
    railCloseDrawer(tab);
    const input=byId(RAILDEF[tab].inputId); if(input) input.value='';
    RAIL[tab]=railFresh(tab);   // …and the filter it held: railFresh types nothing
    byId(RAILDEF[tab].listId).replaceChildren();
    byId(RAILDEF[tab].countId).replaceChildren();
    byId(RAILDEF[tab].moreId).replaceChildren();
    if(RAILDEF[tab].chipsId) byId(RAILDEF[tab].chipsId).replaceChildren();
  }
  for(const v of [FLOWV, IMPACTV]){
    v.seq++; v.resp=null; v.sel=null; v.pick=null; v.limit=40;
    v.rows.clear(); v.linkSpecs=[]; v.paths=[]; v.layerOpen.clear();
    const w=vwrap(v); w.classList.remove('layersmode'); w.replaceChildren();
    vside(v).replaceChildren();
    closeSug(v);
  }
  CP.seq++; CP.resp=null; CP.sel=null; CP.cellEls=new Map();
  byId('cpsummary').replaceChildren(); byId('cpmatrix').replaceChildren(); byId('cpside').replaceChildren();
  GRAPHV.seq++; GMAP.seq++; GMAP.findSeq++;
  stopMap(false); stopAround();
  GMAP.resp=null; GMAP.sel=null; GMAP.hover=null; GMAP.lit=null; GMAP.fitDone=false;
  mapForgetLayout();
  GMAP.nodes=[]; GMAP.links=[];
  GRAPHV.resp=null; GRAPHV.sel=null; GRAPHV.pick=null; GRAPHV.hop=new Map();
  GRAPHV.hidden=new Set(); GRAPHV.hiddenFor=null;
  closeSug(GRAPHV);
  graphSetMode('map');
  byId('gchips').replaceChildren(); byId('gcounts').replaceChildren(); byId('gside').replaceChildren();
  erdStop();
  erdData=null; erdSelectFn=null; erdClearFn=null; erdResetFn=null;
  ERD.answer=null; ERD.sel=null; ERD.lit=null; ERD.fitDone=false; ERD.byId=new Map();
  ERD.iso=[]; ERD.cols=new Map();
  byId('etable').value='';
  byId('erdside').replaceChildren(); byId('erdiso').replaceChildren();
  byId('ehonesty').replaceChildren(); byId('erdleg').replaceChildren();
  byId('txview').replaceChildren();
}
// Zero projects, one, or several — three different controls, because "pick one"
// is a lie when there is nothing to pick and noise when there is no choice.
function renderProjectChrome(){

// What the registry (and, for a project already in memory, its pack) says about
// one entry. Relayed, never recomputed — and `null` for an unloaded project
// means "not loaded", not "nothing to say".
function projectTitle(p){
  const bits=[p.id];
  if(p.stack && p.stack.length) bits.push('lanes: '+p.stack.join(' + '));
  if(p.meta && p.meta.digest) bits.push('digest: '+p.meta.digest);
  if(p.meta && p.meta.builtAt) bits.push('built: '+String(p.meta.builtAt).replace('T',' ').replace(/\..*$/,''));
  if(!p.loaded) bits.push('(not loaded)');

// BUILD IDENTITY, opened and closed by the reader. It uses the fold's own
// memory, so a reader who wants the digest on screen has it on every page they
// load until they close it again — the same bargain every other fold on this
// page makes. `mast.build` is a static id, not a per-answer key: which pack is
// on screen does not change whether this reader wants to see digests.
const MAST_BUILD_FOLD='mast.build';
function paintBuildFold(open){
  byId('mbuild').classList.toggle('hidden', !open);
  byId('mbuildbtn').setAttribute('aria-expanded', String(open));
}
function wireBuildFold(){
  const btn=byId('mbuildbtn');
  btn.onclick=()=>{ const open=!foldIsOpen(MAST_BUILD_FOLD); foldSetOpen(MAST_BUILD_FOLD, open); paintBuildFold(open); };

// FRESHNESS, in the reader's words. The verdict is a COMPUTED value the engine
// emits and this page never types one: what changes here is only how loud it is
// said. `behind` and `provisional-overlay` are the two a reader can act on, so
// they get a sentence; `current` gets a quiet two words; `unknown` gets the dot
// and nothing else, because `unknown` is the resting state of a pack with no git
// base to compare against and printing the word made it read as a failure.
// EVERY one of the four keeps the engine's own verdict, verbatim, in the chip's
// tooltip beside the contract field it came from.
const MAST_FRESH = {
  'behind': { say:'mast.fresh.behind', why:'mast.fresh.behind.title', tint:'warn' },
  'provisional-overlay': { say:'mast.fresh.overlay', why:'mast.fresh.overlay.title', tint:'warn' },
  'current': { say:'mast.fresh.current', why:'mast.fresh.current.title', tint:'' },
  'unknown': { say:'', why:'mast.fresh.unknown.title', tint:'' },
};
// TRUST, the same bargain. The GLOSS is a rewording of the engine's own value
// and nothing more: a level with no gloss here is printed exactly as it arrived,
// so an unknown level can never be silently renamed to a known one.
//
// THIS PAGE HOLDS NO LIST OF LEVELS. A trust level is computed by the engine
// (SPEC §14.3), and only the module that computes it may write those names, so
// the key is DERIVED from whatever value arrived rather than looked up in a
// table the page typed. `mastSay` is the whole rule: use the plain wording if
// we wrote one for this value, and otherwise say the value itself.
const mastTrustKey=(lvl)=> 'mast.trust.'+String(lvl).toLowerCase();
const mastSay=(key, fallback)=> Object.hasOwn(VIEWER_STRINGS.en, key) ? t(key) : fallback;
// THE MASTHEAD CHIPS: what this answer is worth, and the two things a reader may
// change. The limits chip is the SAME fold as the one in the evidence rail (it
// shares its key, so opening either opens both), and its body drops under the
// masthead rather than beside a tab.
function renderMastChrome(){
  const now=themeNow();
  byId('themeseg').replaceChildren(...THEMES.map((name)=> el('button',{
    textContent: t(name==='signal' ? 'theme.dark' : 'theme.light'),
    className: name===now ? 'on' : '',
    onclick: ()=> setTheme(name) })));
  wireBuildFold();
  const m=STATE.meta;
  const fresh=(m && !m.error && m.freshness && m.freshness.verdict) || 'unknown';
  const fs=MAST_FRESH[fresh] || { say:'', why:'', tint:'' };
  const fchip=byId('mfreshchip');
  byId('mfresh').textContent=fs.say ? t(fs.say) : '';
  fchip.className='mchip quiet'+(fs.tint ? ' '+fs.tint : '');
  // SAID OUT LOUD, for a reader who is being read to. The visible chip leans on
  // a coloured dot and a tooltip, and neither of those reaches a screen reader,
  // so the state is written again here and clipped to a pixel. It names what it
  // is about, because in speech there is no row of chips to read it in context.
  // Where the page has no plain wording, this says the engine's own verdict:
  // that is exactly the parity a hover already gives.
  byId('mfreshsr').textContent=t('mast.freshness')+' '+(fs.say ? t(fs.say) : fresh);
  // A verdict this page has no sentence for still says WHICH verdict it is: the
  // tooltip is where the engine's word lives, so it is never the missing half.
  fchip.title=[ fs.why ? t(fs.why) : '', t('mast.freshness')+' '+fresh,
    'basis.freshness.verdict' ].filter((x)=>x).join('  ');
  // The trust level rides with the landing answer, which every tab's rail also
  // carries: one source, printed once at the top of the page. The NAME is the
  // engine's and is relayed verbatim in the tooltip; the TINT is read off the
  // engine's own reasons and never off that name — a trust level is a computed
  // value (SPEC §14.3), and a page that typed one would be a second source of
  // truth for it. An answer that names a gate it could not show, or a gap it
  // knows about, wears the soft amber; one that names neither wears nothing.
  // NOT the green it used to wear: an uncertified pack painted like a passing
  // build is the page telling the reader something the engine never said.
  const tt=(OV.resp && OV.resp.trust) || null;
  const lvl=(tt && tt.trustLevel) || null;
  const held=tt ? ((tt.gatesNotShown||[]).length + (tt.knownGaps||[]).length) : 0;
  const chip=byId('mtrustchip');
  const key=lvl ? mastTrustKey(lvl) : '';
  byId('mtrust').textContent=lvl ? mastSay(key, lvl) : '';
  byId('mtrustsr').textContent=t('mast.trust')+' '+(lvl ? mastSay(key, lvl) : t('mast.trust.none.title'));
  chip.className='mchip quiet'+(held ? ' warn' : '');
  chip.title=[ lvl ? mastSay(key+'.title', '') : t('mast.trust.none.title'),
    lvl ? t('mast.trust')+' '+lvl : '', 'trust.trustLevel',
    ...(held ? [...(tt.gatesNotShown||[]), ...(tt.knownGaps||[])] : []) ].filter((x)=>x).join('  ');
  // WHICH CAPTURE INFORMED THIS PACK. `basis.runtimeEvidence` is the engine's
  // own coverage statement and this chip only puts two of its fields in ink:
  // the source word and the span count, both relayed and neither rewritten. The
  // NOTE is the half that keeps the mark honest ("a row without the mark was
  // not visited, not dead"), so it rides in the tooltip verbatim. No capture,
  // no chip: an absent trace has nothing to say and says nothing.
  const re=runtimeEvidenceOf(OV.resp);
  const tchip=byId('mtracechip');
  tchip.classList.toggle('hidden', !re);
  byId('mtrace').textContent = re ? t('mast.trace',{source:re.source??'', n:re.spans??0}) : '';
  tchip.title = re ? [t('mast.trace.title'), runtimeNote(OV.resp), 'basis.runtimeEvidence']
    .filter((x)=>x).join('  ') : '';
  const lim=(OV.resp && OV.resp.limits) || [];
  const cell=byId('mlimitcell'), body=byId('mfolds');
  if(!lim.length){ cell.replaceChildren(); body.replaceChildren(); return; }
  const [head, list]=foldParts('rail.overview.limits', [t('mast.limits',{n:lim.length})],
    ()=> lim.map((l,i)=> railLimit('rail.overview.lim.'+i, l)), 'mchip');
  // The rail below is built from the same key, so the two chips agree about
  // what is open — whichever one the reader used. The rail is re-drawn from the
  // answer already in memory: nothing is asked for again.
  const flip=head.onclick;
  head.onclick=()=>{ flip(); if(OV.resp) byId('ovside').replaceChildren(honesty(OV.resp,'overview')); };
  cell.replaceChildren(head);
  body.replaceChildren(list);
}
// Every string on this page that the PAGE wrote, re-read from the catalogue.
// Answers are not touched: they are the engine's words, in the engine's
// language, and re-rendering them would be a translation of evidence.
function applyChrome(){
  for(const n of document.querySelectorAll('[data-t]')) n.textContent=t(n.dataset.t);
  for(const n of document.querySelectorAll('[data-t-rich]')) n.replaceChildren(...richNodes(t(n.dataset.tRich)));
  for(const n of document.querySelectorAll('[data-t-fold]')) renderFoldHint(n);
  for(const n of document.querySelectorAll('[data-t-title]')) n.title=t(n.dataset.tTitle);
  for(const n of document.querySelectorAll('[data-t-ph]')) n.placeholder=t(n.dataset.tPh);
  renderProjectChrome();
  renderLangChrome();
  renderMastChrome();
  renderGraphChrome();
  renderMetaChrome();
  renderCascadeRail();
  renderAuthoredChrome();
  document.documentElement.lang=I18N.lang;
}
// A TAB HINT, folded. The `data-t-fold` attribute names a PAIR of catalogue keys:
// `hint.x.lead` is the one line that stands on the page, `hint.x.more` the
// paragraph this tab used to print in full. The whole block is rebuilt on a
// language switch — the reader's open/closed choice lives under the key, in
// localStorage, so it survives that rebuild.
function renderFoldHint(n){
  const key=n.dataset.tFold;
  n.classList.add('hintfold');
  n.replaceChildren(fold(key, richNodes(t(key+'.lead')),
    ()=> [el('div',{}, richNodes(t(key+'.more')))]));
}
// The chrome the page writes in JAVASCRIPT, beside an answer, rather than as a
// `data-t` attribute in the markup: the Graph map's legend and its lead card,
// the Flow/Impact side panels, and the ERD's side and strip. `applyChrome()`
// above can only re-read attributes, so without this a language switch left
// every one of those panels in the language they were drawn in — a Korean
// reader saw a Korean toolbar over an English pane.
//
// Each one is re-drawn from the answer ALREADY IN MEMORY. Nothing is re-asked:
// the engine's words do not change with the interface language, and putting a
// request on the wire for a translation would be both slower and a lie about
// what changed. (test/viewer_multi.test.mjs asserts the zero-request part.)
function renderAuthoredChrome(){
  renderMapLegend();
  // The Overview and the Graph rail are drawn in JavaScript too — and neither
  // asks the server for anything to be drawn again.
  if(OV.resp) renderOverview();
  if(GRAPHV.mode==='around' && GRAPHV.resp){
    renderGraphSide();
    // ...and the count line under the picture, from the answer it was drawn from.
    const c=GRAPHV.counts; if(c) renderGraphCounts(c.r, c.a, c.shownNodes, c.shownLinks);
  }
  if(GRAPHV.mode==='map' && GMAP.resp){ renderMapSide(); renderMapChips(); renderMapCounts(); }
  // The browse rail is page words from end to end: the kind chips, the sort
  // names, the count line, the stat titles, the lead card. Re-drawn from the
  // `browse` answer already in `RAIL[tab].resp`, so the switch asks nothing.
  for(const tab of RAILTABS) if(RAIL[tab].resp || RAIL[tab].needQuery){ railRender(tab); railIdle(tab); }
  // The lane STRIP carries page words too — the lane headings, the hop dividers,
  // the candidate bands — so the whole picture is drawn again, not only the rail
  // beside it. From the answer already in memory, like everything else here.
  for(const v of [FLOWV, IMPACTV]) if(v.resp) renderChain(v, v.resp);
  if(erdData){
    redrawErdLegend();
    renderErdIsolated(ERD.iso||[], ERD.famColor||erdInk);
    if(ERD.sel) renderErdSideTable(ERD.sel); else renderErdSideOverview();
  }
}
// Coupling toolbar: a different axis / mode / depth is a different ANSWER (the
// server walks again); "show all groups" is only a different drawing of the one
// already on screen, so it never re-queries.
document.getElementById('cpdraw').onclick = ()=>drawCoupling();
document.getElementById('cpmode').onchange = ()=>drawCoupling();
document.getElementById('cpdepth').onchange = ()=>drawCoupling();
document.getElementById('cpall').onchange = (e)=>{ CP.showAll=e.target.checked; if(CP.resp) renderCoupling(); };
document.querySelectorAll('#cpaxis button').forEach(b=> b.onclick=()=>{
  if(CP.axis===b.dataset.axis) return;
  CP.axis=b.dataset.axis;
  document.querySelectorAll('#cpaxis button').forEach(x=> x.classList.toggle('on', x===b));
  drawCoupling();
});
document.getElementById('ereset').onclick = ()=>{ document.getElementById('etable').value=''; if(erdClearFn) erdClearFn(); if(erdResetFn) erdResetFn(); };
document.getElementById('etable').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const q=e.target.value.trim(); if(q && erdSelectFn) erdSelectFn(q); else if(erdClearFn) erdClearFn(); } });
// Explore's box is the rail's filter AND the old search box. Enter takes the
// highlighted row; with nothing highlighted (the filter matched none of the
// rows this kind holds) it asks the server, exactly as it always did.
document.getElementById('q').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); railMove('explore', e.key==='ArrowDown'?1:-1); return; }
  if(e.key!=='Enter') return;
  if(railEnter('explore')) return;
  doSearch(e.target.value.trim());
});
document.getElementById('q').addEventListener('input', ()=>railFilterInput('explore'));
document.getElementById('edits').onclick = showEdits;
railWire();
srcWire();
// The five Show all buttons, and the page's one Escape rule. The pane's own
// keys (j / k / arrows to scroll a line, f for the whole file) ride the same
// listener, because they only mean anything while the pane is open.
for(const [tab, id] of Object.entries(SHOWALL)) byId(id).onclick = ()=>showAll(tab);
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ escapeRule(e); return; }
  if(srcKeydown(e) && e.preventDefault) e.preventDefault();
});
// Both lane tabs are wired by the same function — one behaviour, two pictures.
wireChainToolbar(FLOWV);
wireChainToolbar(IMPACTV);
// The Graph tab's entry box is the SAME typeahead the lane tabs use (one
// resolution rule, so a focus is never a guessed kind); only what a commit
// draws differs.
(function wireGraphToolbar(){
  const input=byId('gfocus');
  byId('gload').onclick=()=>chainCommit(GRAPHV);
  input.addEventListener('keydown', e=>{
    const open=!byId('gsug').classList.contains('hidden');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ if(open){ e.preventDefault(); chainSugMove(GRAPHV, e.key==='ArrowDown'?1:-1); } return; }
    if(e.key==='Enter') chainCommit(GRAPHV);
  });
  input.addEventListener('input', ()=>{ GRAPHV.pick=null; clearTimeout(GRAPHV.sugTimer);
    GRAPHV.sugTimer=setTimeout(()=>chainSuggest(GRAPHV, input.value.trim()),150); });
  input.addEventListener('focus', ()=>{ if(!input.value.trim()) chainSuggest(GRAPHV, ''); });
  byId('gdir').onchange=()=>drawGraph();
  byId('ghops').onchange=()=>drawGraph();
  // A different mode or depth is a different ANSWER — the server walks again.
  byId('gmode').onchange=()=>drawMap();
  byId('gdepth').onchange=()=>drawMap();
  // 2D or 3D is only a different PROJECTION of the answer already on screen:
  // no re-query, and the node positions carry across (GMAP.pos).
  document.querySelectorAll('#grend button').forEach(b=> b.onclick=()=>{
    if(GMAP.rend===b.dataset.rend) return;
    GMAP.rend=b.dataset.rend;
    document.querySelectorAll('#grend button').forEach(x=> x.classList.toggle('on', x===b));
    if(GRAPHV.mode==='map' && GMAP.resp) renderMap();
  });
  // Folded or unfolded is a property of the DRAWING, not of the answer: the
  // endpoints were always in it. Nothing is re-queried; the picture is rebuilt
  // and the forces settle it again.
  document.querySelectorAll('#gfold button').forEach(b=> b.onclick=()=>{
    const moved = b.dataset.fold==='endpoints' ? mapUnfoldAll() : mapFoldAll();
    if(!moved){ renderMapFoldNote(); return; }
    GMAP.sel=null;
    mapRebuild();
  });
  // The flow is a property of the PICTURE, not of the answer: nothing is
  // re-queried and nothing is re-laid-out, the renderers are just re-read.
  byId('gflow').onclick=()=>flowToggle();
  byId('fflow').onclick=()=>flowToggle();
  byId('iflow').onclick=()=>flowToggle();
  byId('gback').onclick=()=>graphMode('map');
  byId('gfit').onclick=()=>mapRefit();
  document.addEventListener('click',(ev)=>{ if(!ev.target.closest('#gsug') && ev.target.id!=='gfocus') closeSug(GRAPHV); });
})();
// The Graph tab's own Escape, UNCHANGED, called by the page's one Escape rule
// while that tab is the one on screen — so it cannot reach past a picture the
// user is not looking at.
function graphEscape(){
  if(!byId('gsug').classList.contains('hidden')){ closeSug(GRAPHV); return; }
  if(GRAPHV.mode!=='map'){ aroundClear(); return; }
  // Escape means "back to rest": the spotlight goes, and so does every group
  // the reader opened.
  if(mapFoldAll()){ GMAP.sel=null; GMAP.hover=null; mapRebuild(); refreshShowAll(); return; }
  mapClear();
  refreshShowAll();
}
// THE GRAPH PANE HAS ITS OWN RESIZE LISTENER, ahead of the shared one below,
// because its height is MEASURED rather than declared and everything else in
// that handler reads the size it produces. It runs twice: once when the resize
// stops, and once more a moment later, because the window manager can deliver
// the last `resize` event before the browser has settled on its final
// innerHeight and before the masthead has re-wrapped at the new width. The
// second pass is a style write and two measurements, and it is idempotent: when
// nothing moved it writes back the height that is already there.
let graphPaneTimer=null, graphPaneConfirm=null;
function graphPaneOnResize(){
  clearTimeout(graphPaneTimer);
  graphPaneTimer=setTimeout(()=>{
    graphPaneTimer=null;
    if(byId('tab-graph').classList.contains('hidden')) return;
    graphPaneApply();
    clearTimeout(graphPaneConfirm);
    graphPaneConfirm=setTimeout(()=>{
      graphPaneConfirm=null;
      if(!byId('tab-graph').classList.contains('hidden')) graphPaneApply();
    }, 220);
  }, 100);
}
window.addEventListener('resize', graphPaneOnResize);
// the bezier ends are measured from the DOM, so a resize must re-measure them
let chainResizeTimer=null;
window.addEventListener('resize', ()=>{ clearTimeout(chainResizeTimer); chainResizeTimer=setTimeout(()=>{
  // The browse rail's height is MEASURED, like the Graph pane's: a new window
  // means a new bottom edge, and a drawer-width window means no measured height
  // at all.
  { const tab=railVisibleTab(); if(tab) railPaneApply(tab); }
  // The source pane is fixed under a masthead whose height moves with the
  // width, and its own width is a share of the window until the reader drags it.
  srcPaneApply();
  for(const v of [FLOWV, IMPACTV]) if(v.resp && v.view==='lanes') drawChainLinks(v);
  // Every canvas renderer owns a canvas sized in PIXELS: it has to be told. The
  // layouts are not recomputed — a resize is a different window on the same
  // picture, not a different picture.
  // The Graph pane's height was re-measured by graphPaneOnResize above; this
  // reads what it settled on.
  if(!byId('tab-graph').classList.contains('hidden')) graphPaneResize();
  const gw=byId('gwrap');
  if(GA.api){ try{ GA.api.width(gw.clientWidth||900).height(gw.clientHeight||620); }catch(e){} }
  if(GMAP.api){ const mw=mapWrapEl();
    try{ GMAP.api.width(mw.clientWidth||900).height(mw.clientHeight||420); }catch(e){} }
  if(ERD.api){ const w=byId('erdwrap');
    try{ ERD.api.width(w.clientWidth||900).height(w.clientHeight||620); }catch(e){} }
},120); });
// Scrolling changes WHICH connectors the reader can see, and only those may
// move. Throttled, and never a re-measure of the beziers - only the dots.
let laneScrollTimer=null;
window.addEventListener('scroll', ()=>{ clearTimeout(laneScrollTimer); laneScrollTimer=setTimeout(()=>{
  for(const v of [FLOWV, IMPACTV]) if(v.resp && v.view==='lanes') laneFlowVisibility(v);
},140); }, {passive:true});
// A hidden tab is not being read. SMIL keeps its own clock, so it is told.
document.addEventListener('visibilitychange', ()=>{
  laneFlowPause(document.visibilityState==='hidden');
});

// The TITLE BLOCK's rows: what pack is on screen, which lanes built it, what it
// was built against, how fresh the served answer is. Every VALUE is /api/meta's,
// word for word; only the labels beside them come from the catalogue, which is
// why the block can be re-drawn on a language switch without asking again.
//
// The `project` row is not written here: it is the selector, and
// renderProjectChrome() owns its three states (a <select>, one static name, or
// the init hint). A value the meta does not carry is left EMPTY — an em dash
// would read as a fact the engine stated.
function renderMetaChrome(){
  const note=byId('proj'), m=STATE.meta;
  const put=(id,v)=>{ byId(id).textContent = v==null ? '' : String(v); };
  const blank=()=>{ for(const id of ['mdigest','mbase','mlanes']) put(id,''); };
  if(!m){ note.textContent=t('header.loading'); blank(); renderMastChrome(); return; }
  if(m.error){
    // An unknown project (404) or an unnamed one on a multi-project server
    // (409) is SAID, under the line, in the engine's own words. A blank line
    // would leave the reader thinking the project is empty.
    note.textContent=t('err.generic',{message:m.error.message||m.error.code});
    blank(); renderMastChrome(); return;
  }
  note.textContent='';
  put('mdigest', m.digest||'');
  put('mbase', m.base && m.base.commit ? m.base.commit.slice(0,10) : '');
  // The lanes read as the engine names them, joined the way the dateline
  // reads: `sql + java`, one field of four.
  put('mlanes', m.lanes ? m.lanes.join(' + ') : '');
  renderMastChrome();
}
async function loadMeta(){
  const forProject=STATE.project, mine=STATE.seq;
  STATE.meta=null; renderMetaChrome();
  let m=null;
  try{ m=await (await fetch(withProject('/api/meta'))).json(); }
  catch(e){ return; }
  if(mine!==STATE.seq || forProject!==STATE.project) return;   // another project is on screen now
  STATE.meta=m; renderMetaChrome();
}
// Which projects this server serves. Registry only — asking does not load a
// single pack (`meta` is null until a project has answered something).
async function loadProjects(){
  try{
    const j=await (await fetch('/api/projects')).json();
    if(j && !j.error && j.answer && Array.isArray(j.answer.projects)) STATE.projects=j.answer.projects;
  }catch(e){ /* leave the list empty: the selector then says so */ }
}

(async function init(){
  // The theme first, and QUIETLY: the head script already put it on <html>
  // before the first paint, so this only reconciles the state and writes the
  // choice back. Nothing is rendered yet to re-render.
  setTheme(lsGet(LS_THEME) || THEMES[0], true);
  // ...and the one flow preference the map and the two lane views share.
  flowPrefLoad();
  const kl = document.getElementById('klegend');
  KINDS.forEach(k=> kl.append(el('span',{},[ kindDot(k, 11), k ])));
  renderLineLegend();
  renderMapLegend();
  renderMapLegend('ovmapleg');
  graphPaneWatch();
  ovMapWheelGate();
  // Every translation is fetched at start-up, not on the first click: the
  // toggle names each language in ITS OWN language, and it cannot do that for a
  // catalogue it has not read.
  await Promise.all(LANGS.filter((l)=>l!=='en').map(loadCatalog));
  await loadProjects();
  const hash=readHash();
  const ids=STATE.projects.map((p)=>p.id);
  const known=(x)=> !!x && ids.indexOf(x)>=0;
  // The hash wins (it is what a shared link says), then the ?project= the
  // server prints at start-up, then what this browser chose last time.
  STATE.project=[hash.p, new URLSearchParams(location.search).get('project'), lsGet(LS_PROJECT)].find(known) || ids[0] || null;
  if(STATE.project) lsSet(LS_PROJECT, STATE.project);
  STATE.tab=(hash.tab && TABNAMES.indexOf(hash.tab)>=0) ? hash.tab : 'overview';
  setLang(lsGet(LS_LANG) || 'en');   // applyChrome() runs inside
  byId('projsel').onchange=(e)=>switchProject(e.target.value);
  writeHash();
  loadMeta();
  // The Overview is the landing answer whichever tab a link points at.
  loadOverview();
  activateTab(STATE.tab);
  // ...and a link that names a pick lands ON it, source pane and all. Nothing
  // is in memory on a cold load, so this is the one place a restore asks.
  if(hash.pick && Object.hasOwn(PICK, STATE.tab)) pickAsk(STATE.tab, hash.pick);
  // ...and only if the pick did not already open it on that very node, or the
  // page would ask for the same file twice on one load.
  if(hash.src && !(SRC.open && SRC.node===hash.src)) srcOpen(hash.src, {tab:STATE.tab, push:false});
  refreshShowAll();
})();
</script>
